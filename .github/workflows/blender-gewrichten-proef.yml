name: Blender gewrichten bouwproef (echte Blender)

on:
  push:
    branches: [main, "claude/blender-*"]
    paths: ["producten/blender-gewrichten/proef/**", ".github/workflows/blender-gewrichten-proef.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proef:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        blender: ["4.2.23", "5.2.3"]
    steps:
      - uses: actions/checkout@v4
      - name: Systeempakketten
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1 libegl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 zip
      - name: Blender ${{ matrix.blender }} ophalen
        id: blender
        run: |
          V="${{ matrix.blender }}"; KORT="${V%.*}"
          # download.blender.org geeft vanuit Actions soms 403 (16 nov, run 43792521740 en 43809037855); --retry probeert 403
          # niet opnieuw, dus dan een spiegel (zelfde bestand, zoals in blender-gewrichten-e2e.yml). Roestronde R1.
          B="release/Blender${KORT}/blender-${V}-linux-x64.tar.xz"
          for u in "https://download.blender.org/$B" "https://ftp.nluug.nl/pub/graphics/blender/$B" "https://mirrors.ocf.berkeley.edu/blender/$B"; do
            curl -fsSL --retry 3 --retry-delay 10 -o /tmp/blender.tar.xz "$u" && break
            echo "niet gelukt: $u"; rm -f /tmp/blender.tar.xz
          done
          [ -s /tmp/blender.tar.xz ] || { echo "FOUT: Blender $V niet te downloaden"; exit 1; }
          mkdir -p /tmp/blender && tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | head -1
      - name: Bouwproef één kogelgewricht
        run: /tmp/blender/blender -b --factory-startup --python producten/blender-gewrichten/proef/proef_gewricht.py
      - name: Beweegproef (buigbereik kogelgewricht, echte add-on)
        # ook na een rode bouwproef, maar niet als Blender er niet is
        if: (success() || failure()) && steps.blender.outcome == 'success'
        run: |
          bash producten/blender-gewrichten/e2e/maak_zip.sh
          /tmp/blender/blender -b --factory-startup --python producten/blender-gewrichten/proef/proef_beweeg.py -- /tmp/click_joints.zip
