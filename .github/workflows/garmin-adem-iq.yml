name: Garmin Ebb .iq (winkelbestand)

# Gijs, 10 nov 2026. Maakt het .iq-bestand dat Thijs in de Connect IQ-winkel uploadt (monkeyc -e, release-bouw),
# en zet het als release op GitHub. Bouwt bij elke push in producten/garmin-adem; de release alleen met de hand of met "[release]" in het commitbericht.
# Alleen een versie bouwen waarvan garmin-adem-e2e.yml groen is.
#
# Ondertekenen: Garmin wil dat elke update met dezelfde ontwikkelaarssleutel is ondertekend. Die sleutel hoort
# niet in deze openbare repo. Staat het geheim GARMIN_DEV_KEY (base64 van de DER-sleutel) er, dan wordt daarmee
# ondertekend en heet de release "ebb-v<versie>". Staat het er niet, dan een wegwerpsleutel en een proef-release
# "ebb-v<versie>-proef" die NIET ingediend mag worden.
# De image van een derde draait zonder netwerk (--network none) en in een job zonder schrijfrechten, zodat de sleutel
# er niet uit kan; alleen de job "release" mag schrijven en die draait de image niet.

on:
  push:
    branches: [main, "claude/garmin-*"]
    paths: ["producten/garmin-adem/**", ".github/workflows/garmin-adem-iq.yml"]
  workflow_dispatch:

jobs:
  bouw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/matco/connectiq-tester@sha256:64958e8fd2925d0c4986d72a9aa9d8e2101297a881354aab0118be2f1dc22105
      APP: producten/garmin-adem
    outputs:
      echt: ${{ steps.sleutel.outputs.echt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image ophalen
        run: for poging in 1 2 3; do docker pull -q "$IMAGE" && exit 0; sleep $((poging * 20)); done; exit 1
      - name: Sleutel
        id: sleutel
        env:
          KEY: ${{ secrets.GARMIN_DEV_KEY }}
        run: |
          mkdir -p /tmp/k && chmod 700 /tmp/k
          if [ -n "$KEY" ]; then
            echo "$KEY" | base64 -d > /tmp/k/key.der; echo "echt=ja" >> "$GITHUB_OUTPUT"; echo "Ondertekend met GARMIN_DEV_KEY"
          else
            openssl genrsa -out /tmp/k/key.pem 4096 2>/dev/null
            openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/k/key.pem -out /tmp/k/key.der -nocrypt
            echo "echt=nee" >> "$GITHUB_OUTPUT"; echo "::warning::Geen GARMIN_DEV_KEY: proefbestand, niet indienen"
          fi
      - name: Horloges die de SDK in de image kent (keuring bouw 3 punt 2)
        run: |
          docker run --rm --network none --entrypoint bash "$IMAGE" -c \
            'cd /root/.Garmin/ConnectIQ/Devices; for d in fenix7 fr255 venu2 fenix843mm fenix847mm fenix8pro47mm fenix8solar47mm fenix8solar51mm fenix7pro fenix7xpro fenix7x epix2pro42mm epix2pro47mm epix2pro51mm fr165 fr165m fr57042mm fr57047mm fr955 fr970 vivoactive6 venu3s venux1 venu441mm venu445mm; do
               echo "TOESTEL $d $(tr -d " \n\t" < $d/compiler.json | grep -o "\"resolution\":{[^}]*}\|\"launcherIcon\":{[^}]*}\|\"connectIQVersion\":\"[^\"]*\"\|\"watchApp\",\"memoryLimit\":[0-9]*\|\"type\":\"watchApp\"[^}]*" | tr "\n" " ")"; done; for d in fr255 fenix7xpro vivoactive5 fr265 fenix847mm venu2; do echo "LETTERS $d"; ls $d; tr -d " \n\t" < $d/simulator.json | grep -o "\"fonts\":\[.\{0,3000\}" | head -c 3000; echo; done; for d in venu3 venu441mm venux1; do echo "KNOPPEN $d"; ls -d $d 2>/dev/null || echo "ONBEKEND $d"; tr -d " \n\t" < $d/simulator.json 2>/dev/null | grep -o "\"keys\":\[.\{0,1500\}" | head -c 1500; echo; tr -d " \n\t" < $d/compiler.json 2>/dev/null | grep -o "\"resolution\":{[^}]*}\|\"displayType\":\"[^\"]*\"\|\"enhancedReadabilityModes\|\"shape\":\"[^\"]*\""; done' || true
      - name: .iq bouwen (alle horloges uit manifest.xml)
        run: |
          mkdir -p /tmp/uit && chmod 777 /tmp/uit
          docker run --rm --network none --entrypoint bash -v "$GITHUB_WORKSPACE/$APP:/app" -w /app -v /tmp/k:/k:ro -v /tmp/uit:/uit "$IMAGE" -c \
            'monkeyc -e -r -w -f monkey.jungle -y /k/key.der -o /uit/Ebb.iq > /uit/bouw.log 2>&1; cat /uit/bouw.log; test -s /uit/Ebb.iq'
          rm -rf /tmp/k
          ls -la /tmp/uit/Ebb.iq
          echo "Waarschuwingen: $(grep -ci warning /tmp/uit/bouw.log || true)"
          cd /tmp/uit && sha256sum Ebb.iq | tee Ebb.iq.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ebb-iq
          path: |
            /tmp/uit/Ebb.iq
            /tmp/uit/Ebb.iq.sha256
            /tmp/uit/bouw.log

  # Winkelplaatjes: plaatjes.jungle toont per start één stilgezette scène (vis, schildpad, walvis, Sea log).
  # Keuring bouw 2 punt 3: één job per horloge (8 x 22 scènes paste niet in 40 minuten), elk ±10 minuten.
  plaatjes:
    runs-on: ubuntu-latest
    timeout-minutes: 44
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        horloge: [fenix847mm, fr265, vivoactive5, fr255, venu2, venu3, epix2pro47mm, fr965, fenix7, fenix7xpro, fr165, venu3s, venu441mm]
    env:
      D: ${{ matrix.horloge }}
      IMAGE: ghcr.io/matco/connectiq-tester@sha256:64958e8fd2925d0c4986d72a9aa9d8e2101297a881354aab0118be2f1dc22105
      APP: producten/garmin-adem
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image ophalen
        run: for poging in 1 2 3; do docker pull -q "$IMAGE" && exit 0; sleep $((poging * 20)); done; exit 1
      - name: Scènes in de simulator
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$APP/plaatjes"
          cat > /tmp/plaatjes.sh <<'SH'
          set -x
          apt-get update -qq >/dev/null && apt-get install -y -qq imagemagick >/dev/null
          openssl genrsa -out /tmp/key.pem 4096 2>/dev/null
          openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/key.pem -out /tmp/key.der -nocrypt
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x1024x24 &
          sleep 2
          # Nachtronde 11 nov: testbeelden van elk scherm op 260 (fr255), 390 (vivoactive5), 416 (fr265) en 454 (fenix847mm).
          # Daan D8: ook Venu 2, Venu 3, epix 2 pro en FR965.
          for d in $D; do
            # Proeftak (naam met "proef"): alleen de proefscènes vanaf 51, zodat de uitslag er in minuten is.
            EERSTE=0; case "$GITHUB_REF_NAME" in *proef*) EERSTE=51; sed -i 's/const EERSTE = 0;/const EERSTE = 51;/' source/Bouw.mc ;; esac
            monkeyc -f plaatjes.jungle -d "$d" -o "bin/plaatje-$d.prg" -y /tmp/key.der -l 2 || exit 1
            pkill -f simulator 2>/dev/null; sleep 2; simulator > /tmp/sim.log 2>&1 & sleep 10
            for k in $(seq $EERSTE 74); do
              monkeydo "bin/plaatje-$d.prg" "$d" > "/tmp/plaatje-$d-$k.log" 2>&1 &
              MD=$!
              # Keuring bouw 6 punt 3: op AMOLED 20 s per scène, zodat sea complete af is als de foto genomen wordt.
              case "$d" in fr255|fenix7|fenix7xpro) sleep 12 ;; *) sleep 20 ;; esac
              # Bouw 3: de naam volgt de scène die de app zelf meldt ("PLAATJE scene k"), niet de teller van de lus;
              # een overgeslagen start schoof anders alle namen op (inhouden-krab toonde een eindscherm).
              s=$(grep -o "PLAATJE scene [0-9]*" "/tmp/plaatje-$d-$k.log" | tail -1 | awk '{print $3}')
              if [ -n "$s" ]; then import -window root "plaatjes/$d-scene$s.png"; else echo "GEEN SCENE bij start $k"; import -window root "plaatjes/$d-mis$k.png"; fi
              kill "$MD" 2>/dev/null || true; sleep 3
              cat "/tmp/plaatje-$d-$k.log"
            done
            cp /tmp/sim.log "/tmp/sim-$d.log" 2>/dev/null || true
          done
          # Keuring bouw 2 punt 2: een crash (watchdog of fout) in een scène maakt de run rood (stap "Geen crash").
          grep -iE "watchdog|app crash|unhandled exception|out of memory|VEILIG .* NEE" /tmp/plaatje-*.log /tmp/sim-*.log > plaatjes/CRASH-$D.txt || rm -f plaatjes/CRASH-$D.txt
          mogrify -fuzz 2% -trim +repage plaatjes/*.png
          # Daan D8: vaste namen per scherm (zelfde volgorde als de scènes in EbbApp.getInitialView).
          NAMEN="inhouden-0-30 inhouden-1-45 inhouden-2-30 inhouden-3-04 sealog-1 today 8weeks rustig herstel ademen-in start uitleg startcheck veilig-1 veilig-2 veilig-3 einde-6c einde-6b einde-6c-6rondes settings-1 settings-2 einde-6d calmcheck sealog-3-alle25 inhouden-krab einde-sea-complete calm-45s sealog-2 menu-leeg einde-weekdoel ademen-uit menu-krab einde-6c-krab einde-6b-zeekomkommer calm-einde-krab pauze einde-na-feest menu-today overzicht-menu wereld-schildpad wereld-krab wereld-clownvis wereld-0-30 wereld-2-30 wereld-schildpad-week4 wereld-krab-week4 wereld-clownvis-week4 lucht-ochtend-in lucht-dag-uit lucht-avond-in lucht-nacht-uit krab2-in-dag krab2-uit-dag krab2-calm-dag krab2-hold-dag krab2-menu-dag krab2-eind-dag krab2-in-nacht krab2-uit-nacht krab2-calm-nacht krab2-hold-nacht krab2-menu-nacht krab2-eind-nacht schild2-in-dag schild2-uit-dag schild2-calm-dag schild2-hold-dag schild2-menu-dag schild2-eind-dag schild2-in-nacht schild2-uit-nacht schild2-calm-nacht schild2-hold-nacht schild2-menu-nacht schild2-eind-nacht"
          mkdir -p plaatjes/namen
          for f in plaatjes/*-scene*.png; do
            b=$(basename "$f" .png); d=${b%-scene*}; k=${b##*-scene}
            n=$(echo $NAMEN | cut -d' ' -f$((k+1)))
            if [ -n "$n" ]; then cp "$f" "plaatjes/namen/$n-$d.png"; fi
          done
          # Winkelmaat: hoogstens 500 px hoog en onder 150 KB (Connect IQ-winkel), minder kleuren zonder zichtbaar verlies.
          SH
          docker run --rm --entrypoint bash -e D="$D" -e GITHUB_REF_NAME="$GITHUB_REF_NAME" -v "$GITHUB_WORKSPACE/$APP:/app" -w /app -v /tmp/plaatjes.sh:/tmp/plaatjes.sh "$IMAGE" /tmp/plaatjes.sh
          ls -la "$APP/plaatjes"
      - name: Poster en winkelmaat (zonder simulatorbalken, onder 150 KB)
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install -q --break-system-packages pillow || pip install -q pillow
          if [ -f "$APP/plaatjes/fenix847mm-scene0.png" ]; then python3 "$APP/bron/maak_poster.py" "$APP/plaatjes/fenix847mm-scene0.png" "$APP/plaatjes/winkel-0-poster.png"; fi
          for f in "$APP"/plaatjes/*-scene*.png; do python3 "$APP/bron/maak_winkel.py" "$f" "$APP/plaatjes/winkel-$(basename "$f")"; done
      # Keuring bouw 6 punt 9: pixelvergelijking met de laatste groene run op deze tak, per scherm (informatief:
      # bedoelde veranderingen mogen; bij opruimen moet hier overal 0 staan, REGELS.md punt 6).
      - name: Pixelvergelijking met de vorige groene run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vorige=$(gh run list -R "$GITHUB_REPOSITORY" -w garmin-adem-iq.yml -b "$GITHUB_REF_NAME" -s success -L 1 --json databaseId -q '.[0].databaseId' || true)
          echo "vorige groene run: ${vorige:-geen}"
          if [ -n "$vorige" ]; then gh run download "$vorige" -R "$GITHUB_REPOSITORY" -n "ebb-plaatjes-$D" -D /tmp/vorige || true; fi
          if [ -d /tmp/vorige/namen ] && [ -d "$APP/plaatjes/namen" ]; then
            python3 "$APP/bron/vergelijk_plaatjes.py" /tmp/vorige/namen "$APP/plaatjes/namen" --negeer-onder 24 | tee "$APP/plaatjes/pixelverschil-$vorige.txt" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebb-plaatjes-${{ matrix.horloge }}
          path: producten/garmin-adem/plaatjes
      # Codekeuring bouw 9 punt 8: de wereld ziet er op 0:30 en op 2:30 inhouden gelijk uit (beloont inhouden niet).
      - name: Veiligheid, wereld gelijk op 0:30 en 2:30
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install -q --break-system-packages pillow || pip install -q pillow
          case "$GITHUB_REF_NAME" in *proef*) echo "proeftak: alleen de proefscènes, geen scène 42 en 43"; exit 0 ;; esac
          python3 "$APP/bron/wereld_gelijk.py" "$APP/plaatjes/$D-scene42.png" "$APP/plaatjes/$D-scene43.png" "$APP/resources/werelden/werelden.xml" wereld3
      - name: Geen crash
        run: |
          if ls "$APP"/plaatjes/CRASH-*.txt 2>/dev/null; then cat "$APP"/plaatjes/CRASH-*.txt; echo "CRASH in de scènes op $D"; exit 1; fi
          echo "geen crash op $D"

  plaatjes-openbaar:
    needs: plaatjes
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ebb-plaatjes-*
          merge-multiple: true
          path: plaatjes
      - name: Naar tak schermen (garmin-adem/plaatjes)
        env:
          TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            rm -rf /tmp/s && git clone -q --depth 1 --branch schermen "$URL" /tmp/s || exit 1
            M=plaatjes; case "$GITHUB_REF_NAME" in *proef*) M=plaatjes-proef ;; esac
            D=/tmp/s/garmin-adem/$M; rm -rf "$D" && mkdir -p "$D" && cp -r plaatjes/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            (cd /tmp/s && git add -A && git commit -q -m "Plaatjes Ebb run ${GITHUB_RUN_ID}" && git push -q origin schermen) && break
            sleep $((poging * 3))
          done

  # Gijs 10 nov 16:35: de release alleen nog met de hand (workflow_dispatch) of met "[release]" in het commitbericht.
  # Eerst verving elke push ebb-v1.0.0, en twee runs tegelijk botsten (run 42853275668: HTTP 403 na het weggooien).
  # Zo blijft de release die Thijs uploadt vast staan; elke push levert de .iq nog wel als artefact.
  release:
    needs: bouw
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    concurrency:
      group: ebb-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: producten/garmin-adem/versie.txt
      - uses: actions/download-artifact@v4
        with:
          name: ebb-iq
          path: iq
      - name: Release op GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          ECHT: ${{ needs.bouw.outputs.echt }}
        run: |
          VERSIE=$(tr -d ' \n' < producten/garmin-adem/versie.txt)
          if [ "$ECHT" = "ja" ]; then TAG="ebb-v$VERSIE"; PRE=""; NOOT="Ebb $VERSIE voor de Connect IQ-winkel, ondertekend met de ontwikkelaarssleutel van Dortus."
          else TAG="ebb-v$VERSIE-proef"; PRE="--prerelease"; NOOT="PROEF: ondertekend met een wegwerpsleutel. Niet indienen; eerst het geheim GARMIN_DEV_KEY zetten en opnieuw draaien."; fi
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $PRE -t "$TAG" \
            -n "$NOOT Commit $GITHUB_SHA, run $GITHUB_RUN_ID. sha256: $(cut -d' ' -f1 iq/Ebb.iq.sha256)" iq/Ebb.iq iq/Ebb.iq.sha256
