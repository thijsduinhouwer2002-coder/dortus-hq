name: Click Joints render (knie uit Pro, Cycles)

# Chris, klus hoofdchat 16 nov 16:40: eerlijke render van de delen die Pro 1.0.2 exporteert, geen AI-film.
# Maakt de figuur opnieuw met Rubens script, exporteert met de add-on, rendert de STL-delen met Cycles.
# Uitslag openbaar op de tak schermen, map click-joints-render/<stand>/.
on:
  workflow_dispatch:
    inputs:
      stand:
        description: "snel (3 stilstaande beelden) of film (10 s, 240 beelden)"
        default: "snel"
      model:
        description: "Meshy-figuur uit people/ (MIT, Hugging Face), zonder .glb"
        default: "army_man"
      camera_voor:
        description: "hoeveel van voren de camera kijkt (0.35 is run 68; 0.7 meer van voren)"
        default: "0.35"
      licht_scheen:
        description: "1 = strijklicht op het scharniervlak bovenop de scheen"
        default: "0"

permissions:
  contents: write

jobs:
  render:
    # Chris run 74: de film (240 beelden, meer dan 60 s per beeld) haalde twee keer de limiet niet.
    # Bij stand film nu 8 jobs tegelijk van 30 beelden; de job "film" plakt ze daarna aan elkaar.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        deel: ${{ fromJSON(github.event.inputs.stand == 'film' && '[1,2,3,4,5,6,7,8]' || '[1]') }}
    env:
      CJ_DEEL: ${{ matrix.deel }}
      CJ_HOOGTE: "150"
      CJ_CAM_VOOR: ${{ github.event.inputs.camera_voor }}
      CJ_LICHT_SCHEEN: ${{ github.event.inputs.licht_scheen }}
    steps:
      - uses: actions/checkout@v4
      - name: Blender 5.3.0 en ffmpeg ophalen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          B="release/Blender5.3/blender-5.3.0-linux-x64.tar.xz"
          for u in "https://download.blender.org/$B" "https://ftp.nluug.nl/pub/graphics/blender/$B" "https://mirrors.ocf.berkeley.edu/blender/$B"; do
            curl -fsSL --retry 3 --retry-delay 10 -o /tmp/blender.tar.xz "$u" && break
            rm -f /tmp/blender.tar.xz
          done
          [ -s /tmp/blender.tar.xz ] || { echo "FOUT: Blender niet te downloaden"; exit 1; }
          mkdir -p /tmp/blender && tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
      - name: Meshy-figuur ophalen
        run: |
          pip install -q remotezip
          mkdir -p /tmp/meshy && cd /tmp/meshy
          python3 -c "from remotezip import RemoteZip; RemoteZip('https://huggingface.co/datasets/tfnn/MESHY.AI_800_GLB_3D-Assets_Categorised_and_Labelled/resolve/main/MESHY_GLB.zip').extract('MESHY_GLB/people/${{ github.event.inputs.model }}.glb', '.')"
      - name: Figuur met Pro-knie maken (script van Ruben)
        working-directory: producten/blender-gewrichten
        run: |
          bash e2e/maak_zip.sh betaald
          /tmp/blender/blender -b --factory-startup --python e2e/maak_chris_figuur.py -- /tmp/click_joints_betaald.zip /tmp/fig "/tmp/meshy/MESHY_GLB/people/${{ github.event.inputs.model }}.glb" 2>&1 | tee /tmp/fig.log | grep "\[cj-chris\]"
          grep -q "gelukt: \[.*knie" /tmp/fig.log || { echo "FOUT: knie niet gelukt"; exit 1; }
      - name: Renderen
        run: |
          BLEND=$(ls /tmp/fig/*.blend | head -1)
          if [ "${{ github.event.inputs.stand }}" = "film" ]; then
            export CJ_VAN=$(( (CJ_DEEL - 1) * 30 + 1 )) CJ_TOT=$(( CJ_DEEL * 30 ))
            echo "deel $CJ_DEEL: beeld $CJ_VAN tot en met $CJ_TOT"
          fi
          mkdir -p /tmp/uit
          /tmp/blender/blender -b --factory-startup --python commercie/blender-click-joints/render/render_knie.py -- /tmp/click_joints_betaald.zip "$BLEND" /tmp/uit "${{ github.event.inputs.stand }}" 2>&1 | tee /tmp/render.log | grep --line-buffered "\[cj-render\]\|Error\|Traceback"
          grep -q "KLAAR" /tmp/render.log || { tail -40 /tmp/render.log; exit 1; }
          grep "\[cj-render\]\|\[cj-chris\]" /tmp/fig.log /tmp/render.log > /tmp/uit/uitslag.txt
          rm -rf /tmp/uit/stl
      - name: Beelden bewaren voor de job film
        if: github.event.inputs.stand == 'film' && always()
        uses: actions/upload-artifact@v4
        with:
          name: beelden-${{ matrix.deel }}
          path: /tmp/uit
          retention-days: 3
      - name: Openbaar zetten (tak schermen)
        if: always() && github.event.inputs.stand != 'film'
        env:
          TOKEN: ${{ github.token }}
          STAND: ${{ github.event.inputs.stand }}
        run: |
          [ -d /tmp/uit ] && [ -n "$(ls -A /tmp/uit)" ] || { echo "niets om te zetten"; exit 0; }
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            rm -rf /tmp/s
            git clone -q --depth 1 --branch schermen "$URL" /tmp/s || exit 1
            # Chris run 70: een film met andere camera of licht krijgt een eigen map, zodat de vorige film (reserve) blijft staan
            MAP="$STAND"
            if [ "$STAND" = "film" ] && { [ "${CJ_CAM_VOOR:-0.35}" != "0.35" ] || [ "${CJ_LICHT_SCHEEN:-0}" = "1" ]; }; then
              MAP="film-cam${CJ_CAM_VOOR:-0.35}-licht${CJ_LICHT_SCHEEN:-0}"
            fi
            D="/tmp/s/click-joints-render/$MAP"
            rm -rf "$D" && mkdir -p "$D" && cp -r /tmp/uit/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd /tmp/s && git add -A && git commit -q -m "Schermen click-joints-render/$MAP run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then break; fi
            cd /; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/click-joints-render/$MAP"

  film:
    needs: render
    if: github.event.inputs.stand == 'film' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CJ_CAM_VOOR: ${{ github.event.inputs.camera_voor }}
      CJ_LICHT_SCHEEN: ${{ github.event.inputs.licht_scheen }}
    steps:
      - name: ffmpeg ophalen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - name: Delen ophalen
        uses: actions/download-artifact@v4
        with:
          pattern: beelden-*
          path: /tmp/delen
      - name: Beelden samenvoegen
        run: |
          mkdir -p /tmp/uit/beelden
          for d in /tmp/delen/beelden-*; do
            cp "$d"/beelden/*.png /tmp/uit/beelden/ 2>/dev/null || true
            cat "$d"/uitslag.txt >> /tmp/uit/uitslag.txt 2>/dev/null || true
          done
          N=$(ls /tmp/uit/beelden | wc -l)
          echo "[cj-film] beelden: $N van 240" | tee -a /tmp/uit/uitslag.txt
          for f in $(seq -f "%04g" 1 240); do [ -f /tmp/uit/beelden/$f.png ] || echo "[cj-film] ontbreekt: $f" | tee -a /tmp/uit/uitslag.txt; done
          [ "$N" = "240" ] || { echo "FOUT: niet alle beelden"; rm -rf /tmp/uit/beelden; exit 1; }
      - name: Film maken met onderschrift
        run: |
          # Chris run 75 (Daan 17 nov): onderschrift 1,5 keer groter, laatste seconde "Bends 0° to 115°" (tekst van de add-on zelf)
          F=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          FB=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          ffmpeg -y -loglevel error -framerate 24 -i /tmp/uit/beelden/%04d.png \
            -vf "drawtext=fontfile=$F:text='Rendered in Blender from the exported parts':fontsize=44:fontcolor=white@0.8:x=(w-text_w)/2:y=h-80,drawtext=fontfile=$FB:text='Bends 0° to 115°':fontsize=64:fontcolor=white:alpha='min(1,max(0,(t-9)/0.25))':x=(w-text_w)/2:y=44:enable='gte(t,9)'" \
            -c:v libx264 -pix_fmt yuv420p -crf 18 -movflags +faststart /tmp/uit/click-joints-pro-knie-render.mp4
          ffmpeg -y -loglevel error -i /tmp/uit/click-joints-pro-knie-render.mp4 -vf "select='eq(n\,0)+eq(n\,72)+eq(n\,144)',scale=360:-1,tile=3x1" -frames:v 1 /tmp/uit/blad.png
          rm -rf /tmp/uit/beelden
          ls -la /tmp/uit
      - name: Geluid nakijken (keurfilm, geen blokkade; roestronde R6)
        # Deze film is een keurbeeld voor de tak schermen, nog niet voor buiten. GELUID.txt naast de film zegt
        # of hij geluid heeft; zonder geluid eerst geluid eronder (zie commercie/filmpjes/planning.md) voor iemand hem plaatst.
        run: |
          curl -sSfL -o /tmp/geluid_check.py "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/organisatie/controle/geluid_check.py"
          if ! python3 /tmp/geluid_check.py /tmp/uit/*.mp4 > /tmp/uit/GELUID.txt; then
            echo "NIET PLAATSEN: deze film heeft geen hoorbaar geluid. Eerst geluid eronder en opnieuw nakijken." | tee -a /tmp/uit/GELUID.txt
            echo "::warning::Film zonder hoorbaar geluid: niet plaatsen voordat er geluid onder staat (GELUID.txt)"
          fi
      - name: Openbaar zetten (tak schermen)
        if: always()
        env:
          TOKEN: ${{ github.token }}
          STAND: film
        run: |
          [ -d /tmp/uit ] && [ -n "$(ls -A /tmp/uit)" ] || { echo "niets om te zetten"; exit 0; }
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            rm -rf /tmp/s
            git clone -q --depth 1 --branch schermen "$URL" /tmp/s || exit 1
            # Chris run 70: een film met andere camera of licht krijgt een eigen map, zodat de vorige film (reserve) blijft staan
            MAP="$STAND"
            if [ "$STAND" = "film" ] && { [ "${CJ_CAM_VOOR:-0.35}" != "0.35" ] || [ "${CJ_LICHT_SCHEEN:-0}" = "1" ]; }; then
              MAP="film-cam${CJ_CAM_VOOR:-0.35}-licht${CJ_LICHT_SCHEEN:-0}"
            fi
            D="/tmp/s/click-joints-render/$MAP"
            rm -rf "$D" && mkdir -p "$D" && cp -r /tmp/uit/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd /tmp/s && git add -A && git commit -q -m "Schermen click-joints-render/$MAP run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then break; fi
            cd /; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/click-joints-render/$MAP"
