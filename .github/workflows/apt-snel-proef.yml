name: apt-snel proef (Olaf)
# Toetst de stap .github/actions/apt-snel (bewaarde .deb-bestanden, sleutel op image, pakketlijst en script, keuring
# Daan M1). Job "vul" haalt de pakketten en bewaart ze; daarna installeren drie runners naast elkaar uit de bewaarde
# map, één ervan met een extra pakket (moet onder een nieuwe sleutel bewaard worden). Pakketlijst van regisseur-3/4.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/apt-snel-proef.yml, commercie/filmpjes/apt-snel.sh, .github/actions/apt-snel/action.yml]
env:
  PAKKETTEN: xvfb libgl1 libegl1 libgl1-mesa-dri libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 imagemagick xdotool ffmpeg fonts-inter tesseract-ocr
jobs:
  vul:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            commercie/filmpjes/apt-snel.sh
            .github/actions/apt-snel
      - uses: ./.github/actions/apt-snel
        with:
          pakketten: ${{ env.PAKKETTEN }}
      - run: |
          echo "bewaard: $(ls ~/apt-debs/*.deb | wc -l) bestanden, $(du -sh ~/apt-debs | cut -f1)"
  proef:
    needs: vul
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        extra: ['', '', 'cowsay']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            commercie/filmpjes/apt-snel.sh
            .github/actions/apt-snel
      - uses: ./.github/actions/apt-snel
        with:
          pakketten: ${{ env.PAKKETTEN }} ${{ matrix.extra }}
      - run: |
          for p in xvfb-run convert xdotool ffmpeg tesseract; do command -v $p >/dev/null || { echo "MIST $p"; exit 1; }; done
          fc-list | grep -qi inter || { echo "MIST fonts-inter"; exit 1; }
          echo "alles aanwezig"
