name: "Regisseur 7 (tip-gat, tip-maat, tip-plat, tip-glad: betere uitsneden)"

# 23 nov 2026 ±22:05 NL, Regisseur run 6. Eigen controle van release regisseur-5 en -6 vond drie beeldfouten:
# tip-gat STEP 1 pion half buiten beeld (tip-plat STEP 1 ei idem); tip-maat Units-labels en "310 mm" afgesneden aan de rand; tip-glad STEP 1
# Regisseur run 25 (24 nov): tip-dikte erbij (scenes uit regisseur-4, voorheen release regisseur-5); alle vijf met slotzin naar Gumroad, geen "not print tested".
# menu half buiten beeld en STEP 2 begint met een leeg donker vlak. Deze workflow neemt NIET opnieuw op: hij haalt de
# ruwe opnames uit release regisseur-3, -4 en -6 en monteert opnieuw met de verbeterde uitsneden in regisseur-7/.
# Stem: <naam>-elevenlabs.mp3 van de hoofdchat (ElevenLabs Max) als die er is, anders Kokoro (Apache 2.0). Niets geplaatst.
on:
  push:
    branches: [main]
    paths: ["commercie/filmpjes/regisseur-7/**", ".github/workflows/regisseur-7.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: regisseur-7
  KOKORO_URL: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
  KOKORO_ONNX_SHA: beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a
  KOKORO_VOICES_SHA: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d

jobs:
  herbouw:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Systeempakketten
        run: bash commercie/filmpjes/apt-snel.sh imagemagick ffmpeg fonts-inter
      - name: Ruwe opnames uit regisseur-3 en regisseur-4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for r in 3 4 6; do
            mkdir -p /tmp/pro$r
            gh release download regisseur-$r -R "$GITHUB_REPOSITORY" -p opname-tip.mkv -p film-tip.json -p 'render-*.png' -D /tmp/pro$r
            mv /tmp/pro$r/opname-tip.mkv /tmp/pro$r/opname-ruw.mkv; mv /tmp/pro$r/film-tip.json /tmp/pro$r/film.json
            ls -la /tmp/pro$r
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stem-pakketten en Kokoro (sha256 vast)
        run: |
          python -m pip install -q kokoro-onnx==0.6.1 soundfile faster-whisper==1.2.1 numpy pillow
          mkdir -p /tmp/kokoro
          curl -fsSL --retry 3 -o /tmp/kokoro/kokoro-v1.0.onnx "$KOKORO_URL/kokoro-v1.0.onnx"
          curl -fsSL --retry 3 -o /tmp/kokoro/voices-v1.0.bin "$KOKORO_URL/voices-v1.0.bin"
          echo "$KOKORO_ONNX_SHA  /tmp/kokoro/kokoro-v1.0.onnx" | sha256sum -c
          echo "$KOKORO_VOICES_SHA  /tmp/kokoro/voices-v1.0.bin" | sha256sum -c
      - name: Montage (vorm groot)
        env:
          KOKORO_MODEL: /tmp/kokoro/kokoro-v1.0.onnx
          KOKORO_VOICES: /tmp/kokoro/voices-v1.0.bin
        run: |
          mkdir -p /tmp/klaar
          : > /tmp/klaar/stemmen.txt
          for item in 3:tip-gat 3:tip-maat 4:tip-plat 6:tip-glad 4:tip-dikte; do
            r=${item%%:*}; n=${item#*:}; d=commercie/filmpjes/regisseur-$r
            unset STEM_MP3 STEM_BRON
            for m in $d/stem/$n-elevenlabs.mp3 $d/$n-elevenlabs.mp3 commercie/filmpjes/regisseur-7/$n-elevenlabs.mp3; do
              if [ -f "$m" ]; then export STEM_MP3=$PWD/$m STEM_BRON=elevenlabs; break; fi
            done
            echo "$n ${STEM_BRON:-kokoro} ${STEM_MP3:-}" | tee -a /tmp/klaar/stemmen.txt
            python commercie/filmpjes/regisseur-2/vul.py commercie/filmpjes/regisseur-7/$n.json /tmp/pro$r/film.json /tmp/$n.json
            rm -rf /tmp/klaar/zinnen
            python commercie/filmpjes/regisseur-2/montage2.py /tmp/$n.json /tmp/pro$r /tmp/klaar groot
            mv /tmp/klaar/$n-groot.mp4 /tmp/klaar/$n-geluid.mp4
            mv /tmp/klaar/overzicht-groot.jpg /tmp/klaar/overzicht-$n.jpg
          done
          rm -rf /tmp/klaar/zinnen
      - name: Controle (synchroon, geluid, lengte)
        env:
          WHISPER_MODEL: small.en
        run: |
          cd /tmp/klaar
          ok=0
          for n in tip-gat tip-maat tip-plat tip-glad tip-dikte; do
            mkdir -p meting-$n
            python $GITHUB_WORKSPACE/commercie/filmpjes/regisseur-2/synchroon2.py $n-geluid.mp4 $n-groot-script.json meting-$n || ok=1
            for f in meting-$n/*; do mv "$f" "$(basename ${f%.*})-$n.${f##*.}"; done
            rmdir meting-$n
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $n-geluid.mp4)
            echo "$n $d s" | tee -a lengtes.txt
            python -c "import sys; d=float('$d'); sys.exit(0 if 40.0 <= d <= 60.0 else 1)" || { echo "FOUT: $n is $d s"; ok=1; }
          done
          python $GITHUB_WORKSPACE/organisatie/controle/geluid_check.py *-geluid.mp4 | tee geluid_check.txt
          grep -q "FOUT" geluid_check.txt && ok=1
          sha256sum *.mp4 | tee SHA256SUMS.txt
          exit $ok
      - name: In de release zetten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d /tmp/klaar ] || exit 1
          cd /tmp/klaar
          echo "Regisseur 7: tip-gat, tip-maat en tip-glad opnieuw gemonteerd met betere uitsneden (ElevenLabs-stem waar die klaarstaat, anders Kokoro). Concepten: marketing/wachtrij/. Niets geplaatst." > /tmp/notes.md
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Regisseur 7 (tip-gat, tip-maat, tip-glad v3)" --notes-file /tmp/notes.md
          ls -la
          gh release upload "$TAG" $(ls *.mp4 *.json *.srt *.md *.txt *.jpg 2>/dev/null) --clobber -R "$GITHUB_REPOSITORY"
