name: Dashboard (elk half uur)

# Hoofdchat, 9 nov 2026. Bouwt het Dortus-dashboard uit de repo en een paar openbare adressen,
# zonder Claude. Uitvoer gaat naar de tak `dashboard` (GitHub Pages) en is ook te lezen als
# https://raw.githubusercontent.com/thijsduinhouwer2002-coder/dortus-hq/dashboard/data.json
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  # Roestronde R7 (19 nov): GitHub liet het schema hier ±elke 8 uur draaien in plaats van elk half uur, daarom ook
  # bij elke push naar main. De job klok (organisatie/controle/klok.py) laat hem hooguit elk half uur bouwen, en
  # altijd als de push dashboard/ of deze workflow raakt (het oude paths-filter) of bij een handmatige start.
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  klok:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      beurt: ${{ steps.klok.outputs.beurt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: organisatie/controle
      - id: klok
        run: python3 -I organisatie/controle/klok.py dashboard 30m --paden "dashboard/**,.github/workflows/dashboard.yml"

  bouw:
    needs: klok
    if: needs.klok.outputs.beurt == 'ja'
    # niet afbreken: de klok is al gezet, een afgebroken bouw zou een half uur geen dashboard geven
    concurrency:
      group: dashboard
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2500
          filter: blob:none   # git log heeft alleen commits nodig, geen oude bestanden (repo is 1,2 GB)
      - name: Dashboard bouwen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 dashboard/bouw.py "$RUNNER_TEMP/dash"
      - name: Naar de tak dashboard
        run: |
          cd "$RUNNER_TEMP/dash"
          touch .nojekyll
          git init -q -b dashboard
          git config user.name "Dortus dashboard"
          git config user.email "thijs@dortus.com"
          git add -A
          git commit -q -m "Dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dashboard
