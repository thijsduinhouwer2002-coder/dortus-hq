name: Kansenradar (onderzoek ai-handel)

# Bouwer radar, 19 nov 2026. Meet een week lang drie zeldzame momenten op crypto-beurzen: nieuwe noteringen,
# funding-pieken en stablecoins die van hun koppeling afwijken. Alleen openbare API's: geen account, geen sleutel,
# geen handel, geen geld. Uitleg: onderzoek/ai-handel/radar/README.md. Data en rapport gaan naar de tak
# ai-handel-data, map radar/ (niet main). Gebouwd naar het voorbeeld van scanner.yml.
#
# Ritme: één job van ±5 uur 25 minuten, daarna de volgende. GitHub laat geplande runs in deze repo vaak vallen,
# daarom start hij ook bij elke push naar main en beslist de klok (organisatie/controle/klok.py, interval 6h) of
# hij aan de beurt is. Een push die de code van de radar raakt (*.py, *.sh, deze workflow, en beurzen.py en
# scanner.py van de scanner, die de radar gebruikt), start hem opnieuw met de nieuwe code; een tekst (README,
# keuring) niet. De oude run stopt en bewaart wat hij had, ook de open funding-pieken (pieken-open.json), die de
# volgende run afmaakt. Met de hand starten (opdrachtbestand) is een proefrun: eigen rij, raakt de klok en de
# vaste run niet.
on:
  schedule:
    - cron: "47 5,11,17,23 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      minuten:
        description: "Hoe lang meten (minuten)"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  klok:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      beurt: ${{ steps.klok.outputs.beurt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: organisatie/controle
      - id: klok
        run: python3 -I organisatie/controle/klok.py radar 6h --paden "onderzoek/ai-handel/radar/*.py,onderzoek/ai-handel/radar/*.sh,.github/workflows/radar.yml,onderzoek/ai-handel/scanner/beurzen.py,onderzoek/ai-handel/scanner/scanner.py"

  meet:
    needs: klok
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.klok.outputs.beurt == 'ja') }}
    concurrency:
      group: radar-${{ github.event_name == 'workflow_dispatch' && 'proef' || 'vast' }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INVOER_MINUTEN: ${{ inputs.minuten }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # de radar hergebruikt beurzen.py en de rekensom uit scanner.py (alleen lezen)
          sparse-checkout: |
            onderzoek/ai-handel/radar
            onderzoek/ai-handel/scanner
      - name: Meten (en elk half uur tussentijds opslaan)
        run: |
          MINUTEN=325
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            MINUTEN="${INVOER_MINUTEN:-10}"
            case "$MINUTEN" in ''|*[!0-9]*) MINUTEN=10 ;; esac
            [ "$MINUTEN" -gt 325 ] && MINUTEN=325
          fi
          UIT="$RUNNER_TEMP/radar/$(date -u +%Y-%m-%d)/run-$GITHUB_RUN_ID"
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && UIT="$UIT-proef"
          mkdir -p "$UIT"
          # lijst met munten van de vorige run, zodat een notering tussen twee runs niet verloren gaat
          VORIGE="$RUNNER_TEMP/paren-vorige.json"
          curl -sf -m 30 -o "$VORIGE" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ai-handel-data/radar/paren-laatst.json" \
            || rm -f "$VORIGE"
          # open funding-pieken van de vorige vaste run afmaken (niet bij een proef: die raakt de vaste meting niet)
          PIEKEN="$RUNNER_TEMP/pieken-vorige.json"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || ! curl -sf -m 30 -o "$PIEKEN" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ai-handel-data/radar/pieken-open.json"; then
            rm -f "$PIEKEN"
          fi
          echo "Meten: $MINUTEN minuten, naar $UIT"
          python3 -u onderzoek/ai-handel/radar/radar.py --minuten "$MINUTEN" --uit "$UIT" --vorige "$VORIGE" \
            --pieken "$PIEKEN" &
          PID=$!
          # Bij afbreken stuurt de runner SIGINT/SIGTERM naar deze shell; doorgeven, zodat de radar zijn open
          # momenten en samenvatting.json nog wegschrijft.
          trap 'kill -TERM "$PID" 2>/dev/null; wait "$PID"; exit 1' INT TERM
          LAATST=$(date +%s)
          while kill -0 "$PID" 2>/dev/null; do
            sleep 30 & wait $!
            if [ $(( $(date +%s) - LAATST )) -ge 1800 ]; then
              bash onderzoek/ai-handel/radar/opslaan.sh "$RUNNER_TEMP/radar" || true
              LAATST=$(date +%s)
            fi
          done
          wait "$PID"
      - name: Opslaan op de tak ai-handel-data
        if: always()
        run: bash onderzoek/ai-handel/radar/opslaan.sh "$RUNNER_TEMP/radar"
      - name: Rapport in het log
        if: always()
        run: |
          python3 -I onderzoek/ai-handel/radar/radar_rapport.py "$RUNNER_TEMP/radar" --met-proef | head -150
          cat "$RUNNER_TEMP"/radar/*/*/samenvatting.json 2>/dev/null | head -60 || true
