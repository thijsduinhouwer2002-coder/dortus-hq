name: Het Hol (Steam, Godot op Windows)

# Olaf, 9 nov 2026. Start Het Hol op een echte Windows-runner met Kladblok erachter:
# schermafbeelding op 96, 120 en 160 px, CPU-meting op 120 px, en een film van een minuut spelen (GIF).
on:
  push:
    branches: [main, "claude/steam-*"]
    paths: ["producten/steam-hol/**", ".github/workflows/steam-hol.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hol:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3 downloaden
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
      - name: Importeren (eerste keer openen)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64_console.exe" -ArgumentList "--headless --path producten/steam-hol/godot --import" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force }
      - name: Toetsen systemen en held (Bram, moeten 0 FOUT geven)
        shell: pwsh
        run: |
          $fout = 0
          foreach ($t in @("toets_systemen", "toets_namen", "toets_held", "toets_vleermuis", "toets_berg_wand", "toets_klap", "toets_aanloop", "toets_licht", "toets_opslag", "toets_tekens", "toets_rand")) {
            $uit = & "godot/Godot_v4.3-stable_win64_console.exe" --headless --path producten/steam-hol/godot -s "systemen/toetsen/$t.gd" 2>&1 | Out-String
            Write-Output $uit
            if ($LASTEXITCODE -ne 0 -or $uit -match "FOUT [^0]|SCRIPT ERROR|Parse Error") { Write-Output "== $t ROOD"; $fout++ }
          }
          if ($fout -gt 0) { exit 1 }
      - name: Scripts van de kern laden zonder fout
        shell: pwsh
        run: |
          $alles = ""
          foreach ($f in @("kern/strook.gd", "kern/wachtrij.gd", "kern/namen.gd", "kern/afloop.gd", "kern/opslag.gd", "kern/veilig_bestand.gd", "kern/kaartje.gd", "kern/tekst.gd", "kern/eerste_minuut.gd", "hol/hol.gd", "hol/hol_vast.gd", "kern/hol_lagen.gd", "systemen/licht.gd", "systemen/licht_gloed.gd", "systemen/leven.gd")) {
            $uit = & "godot/Godot_v4.3-stable_win64_console.exe" --headless --path producten/steam-hol/godot --check-only -s $f 2>&1 | Out-String
            Write-Output "== $f"
            Write-Output $uit
            $alles += $uit
          }
          if ($alles -match "SCRIPT ERROR|Parse Error") { exit 1 }
      - name: Strook op 96, 120, 160, 200 en 240 px met Kladblok erachter, CPU op 120, 200 en 240 (en 200 met palet=vol)
        shell: pwsh
        run: |
          $uit = "producten/steam-hol/e2e/screenshots"
          New-Item -ItemType Directory -Force $uit | Out-Null
          Start-Process notepad.exe
          Start-Sleep 3
          $samen = @()
          # Daan #339 M2: de standaard is 200 px (2,8 keer de pixels van 120) met palet=zacht (een laag die het scherm
          # terugleest), dus CPU ook op 200 en 240, en 200 met palet=vol ernaast om te zien wat de laag kost.
          foreach ($hh in @("96", "120", "160", "200", "240", "200vol")) {
            $h = [int]($hh -replace 'vol','')
            $extra = if ($hh -like "*vol") { "palet=vol" } else { "" }
            $log = ((Resolve-Path $uit).Path -replace '\\','/') + "/hol-$hh.log"
            $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
              -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle -- hoogte=$h demo=1 vers=1 duur=50 $extra log=$log" -PassThru
            Start-Sleep 22
            & producten/steam-hol/e2e/scherm.ps1 "$uit/strook-$hh.png"
            if ($hh -in @("120", "200", "240", "200vol")) {
              # drie metingen van 6 s en de mediaan (Bram 15 nov: één meting van 20 s op een gedeelde runner sprong tussen 0,6 en 1,4
              # met dezelfde code). Alleen ter info: dit is de drukke demo-film; de maat voor demolijst 2 is de duurtest (steam-hol-duur.yml).
              $m = @()
              foreach ($i in 1..3) {
                $p.Refresh(); $c1 = $p.TotalProcessorTime.TotalSeconds; $t1 = Get-Date
                Start-Sleep 6
                $p.Refresh(); $c2 = $p.TotalProcessorTime.TotalSeconds; $dt = ((Get-Date) - $t1).TotalSeconds
                $m += [math]::Round(($c2 - $c1) * 10 / $dt, 2)
              }
              $med = ($m | Sort-Object)[1]
              $regel = "CPU hoogte $hh : $med CPU-seconden per 10 s (mediaan van $($m -join ' / '), alleen ter info: demo-film op een gedeelde runner, de maat is de duurtest), geheugen $([int]($p.WorkingSet64 / 1MB)) MB"
              Write-Output $regel; $samen += $regel
            }
            $p.WaitForExit(40000) | Out-Null
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Write-Output "===== log $hh"; Get-Content $log -ErrorAction SilentlyContinue
          }
          $samen | Set-Content "$uit/cpu.txt"
      - name: Gloop plat zonder regel op 96 en 120 px (Daan 16 nov 20:35)
        shell: pwsh
        run: |
          # plat_proef=1: de twee "flat"-regels van deze speelbeurt zijn al op, Gloop gaat meteen plat en blijft plat.
          # Beeld om te keuren of hij zonder tekst leest; de log moet "HOL plat zonder regel" hebben en geen "flat"-regel.
          $uit = "producten/steam-hol/e2e/screenshots"
          $fout = 0
          foreach ($h in @(96, 120)) {
            $log = ((Resolve-Path $uit).Path -replace '\\','/') + "/plat-$h.log"
            $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
              -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle -- hoogte=$h vers=1 plat_proef=1 duur=24 log=$log" -PassThru
            Start-Sleep 16
            & producten/steam-hol/e2e/scherm.ps1 "$uit/plat-$h.png"
            $p.WaitForExit(30000) | Out-Null
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Write-Output "===== log plat $h"; Get-Content $log -ErrorAction SilentlyContinue
            if (-not (Select-String -Path $log -Pattern "HOL plat zonder regel" -Quiet)) { Write-Output "FOUT: geen plat zonder regel op $h"; $fout++ }
            if (Select-String -Path $log -Pattern "HOL kroniek.*(flat|up again)" -Quiet) { Write-Output "FOUT: toch een plat-regel op $h"; $fout++ }
          }
          if ($fout -gt 0) { exit 1 }
      - name: Klikken door de lucht naar Kladblok, klik in het hol telt (96 px)
        shell: pwsh
        run: |
          # demolijst punt 5: een klik op de lucht boven het hol moet bij het venster erachter (Kladblok) aankomen en
          # niet in het spel; een klik onderin het hol wel in het spel (logregel "HOL klik op").
          # Op 96 px (Olaf 14 nov): sinds het muisvlak het 3D-gras volgt (anders tekent Windows het niet) is er op 120 en
          # 160 geen lucht meer, het gras vult rij 0 tot 8 (Mila, hol.py). Op 96 staat 16 px lucht boven het hol.
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class Voor { [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid); }
          "@
          function VoorProces { [uint32]$pid_ = 0; [Voor]::GetWindowThreadProcessId([Voor]::GetForegroundWindow(), [ref]$pid_) | Out-Null; (Get-Process -Id $pid_).ProcessName }
          $uit = (Resolve-Path "producten/steam-hol/e2e/screenshots").Path -replace '\\','/'
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Process notepad.exe -WindowStyle Maximized
          Start-Sleep 3
          $log = "$uit/klik.log"
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
            -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle -- hoogte=96 vers=1 duur=25 log=$log" -PassThru
          $start = $null
          for ($w = 0; $w -lt 30 -and -not $start; $w++) {
            Start-Sleep 1
            $start = Select-String -Path $log -Pattern "pos=\((\d+), (\d+)\)" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $start) { Write-Output "FOUT: geen startregel met pos in 30 s"; Get-Content $log -ErrorAction SilentlyContinue; exit 1 }
          Start-Sleep 3
          $x0 = [int]$start.Matches[0].Groups[1].Value; $y0 = [int]$start.Matches[0].Groups[2].Value
          Write-Output "venster op $x0,$y0"
          $fout = 0
          # Olaf 14 nov (moet Daan 20:50): het spel pakt nooit de focus (project.godot window/size/no_focus), dus geen
          # knipperende taakbalkknop. Bij de start en na een klik in het hol blijft Kladblok op de voorgrond.
          $voorS = VoorProces
          Write-Output "start: voorgrond $voorS"
          if ($voorS -ne "notepad") { Write-Output "FOUT: het spel pakte bij de start de focus ($voorS)"; $fout++ }
          # eerst in het hol: dat moet in het spel tellen, zonder de focus te pakken
          & producten/steam-hol/e2e/klik.ps1 ($x0 + 200) ($y0 + 90)
          Start-Sleep 1
          $voor0 = VoorProces
          $na_hol = @(Select-String -Path $log -Pattern "HOL klik op").Count
          Write-Output "hol: voorgrond $voor0, kliks in het spel $na_hol"
          if ($na_hol -ne 1 -or $voor0 -ne "notepad") { Write-Output "FOUT: klik in het hol telde niet of het spel pakte de focus"; $fout++ }
          # dan de voorgrond weg van Kladblok met een klik op een leeg stuk taakbalk, anders bewijst de luchtklik niets
          # net links van het systeemvak (daar staan geen programmaknoppen, ook niet bij een gecentreerde taakbalk)
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class Balk { [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [DllImport("user32.dll")] public static extern IntPtr FindWindow(string c, string n);
            [DllImport("user32.dll")] public static extern IntPtr FindWindowEx(IntPtr p, IntPtr a, string c, string n);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r); }
          "@
          $vak = New-Object Balk+R
          $tray = [Balk]::FindWindowEx([Balk]::FindWindow("Shell_TrayWnd", $null), [IntPtr]::Zero, "TrayNotifyWnd", $null)
          [Balk]::GetWindowRect($tray, [ref]$vak) | Out-Null
          $tx = $vak.L - 20; $ty = [int](($vak.T + $vak.B) / 2)
          & producten/steam-hol/e2e/klik.ps1 $tx $ty
          Start-Sleep 1
          $voorT = VoorProces
          Write-Output "taakbalk ($tx,$ty): voorgrond $voorT"
          & producten/steam-hol/e2e/scherm.ps1 "$uit/taakbalk-na.png"
          if ($voorT -eq "notepad") { Write-Output "FOUT: voorgrond niet weg van Kladblok, luchtklik bewijst niets"; $fout++ }
          # dan de lucht: moet bij Kladblok aankomen en niet in het spel
          & producten/steam-hol/e2e/klik.ps1 ($x0 + 200) ($y0 + 4)
          Start-Sleep 1
          $voor1 = VoorProces
          $na_lucht = @(Select-String -Path $log -Pattern "HOL klik op").Count
          Write-Output "lucht: voorgrond $voor1, kliks in het spel $na_lucht"
          if ($voor1 -ne "notepad" -or $na_lucht -ne 1) { Write-Output "FOUT: klik op de lucht kwam niet bij Kladblok"; $fout++ }
          & producten/steam-hol/e2e/scherm.ps1 "$uit/klik-na.png"
          $p.WaitForExit(40000) | Out-Null
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content $log
          # demo voorbij: een echte klik in het hol wordt geweigerd (kan-punt controleur 13 nov; Olaf 14 nov).
          # Zelfde plek als de holklik hierboven, maar met steamdemo=1 en een grens van 3 s.
          $log2 = "$uit/klik-demo.log"
          $p2 = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
            -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle -- hoogte=96 vers=1 steamdemo=1 demo_einde=3 duur=25 log=$log2" -PassThru
          $klaar = $null
          for ($w = 0; $w -lt 30 -and -not $klaar; $w++) {
            Start-Sleep 1
            $klaar = Select-String -Path $log2 -Pattern "HOL demo voorbij na" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          $s2 = Select-String -Path $log2 -Pattern "pos=\((\d+), (\d+)\)" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $klaar -or -not $s2) { Write-Output "FOUT: demo werd niet voorbij in 30 s of geen startregel"; $fout++ }
          else {
            $x2 = [int]$s2.Matches[0].Groups[1].Value; $y2 = [int]$s2.Matches[0].Groups[2].Value
            & producten/steam-hol/e2e/klik.ps1 ($x2 + 200) ($y2 + 90)
            Start-Sleep 2
            $geweigerd = @(Select-String -Path $log2 -Pattern "geweigerd \(klik in het hol\)").Count
            $geteld = @(Select-String -Path $log2 -Pattern "HOL klik op").Count
            Write-Output "demo voorbij: klik geweigerd $geweigerd, kliks in het spel $geteld"
            if ($geweigerd -ne 1 -or $geteld -ne 0) { Write-Output "FOUT: echte klik na het demo-einde niet geweigerd"; $fout++ }
          }
          $p2.WaitForExit(40000) | Out-Null
          if (-not $p2.HasExited) { Stop-Process -Id $p2.Id -Force }
          Get-Content $log2 -ErrorAction SilentlyContinue
          "klik: $fout FOUT (voorgrond na luchtklik: $voor1)" | Set-Content "$uit/klik.txt"
          if ($fout -gt 0) { exit 1 }
      - name: Film van een minuut spelen (Movie Maker, 15 fps)
        shell: pwsh
        run: |
          $uit = "producten/steam-hol/e2e/screenshots"
          $film = "$((Resolve-Path $uit).Path)/film"
          New-Item -ItemType Directory -Force $film | Out-Null
          $log = ($film -replace '\\','/') + "/film.log"
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
            -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle --write-movie `"$film/f.png`" --fixed-fps 20 --quit-after 1200 -- hoogte=120 demo=1 vers=1 film=1 log=$log" -PassThru
          if (-not $p.WaitForExit(600000)) { Stop-Process -Id $p.Id -Force }
          Get-Content $log -ErrorAction SilentlyContinue
          (Get-ChildItem $film -Filter *.png).Count
      - name: Demo-einde (steamdemo=1, grens 10 s; ontwerp.md sectie Demo-einde)
        shell: pwsh
        run: |
          # 1: met steamdemo komt de regel precies één keer, graven en kopen geweigerd, helden blijven komen
          # 2: zonder steamdemo geen regel en kopen werkt  3: herstart met dezelfde save: speeltijd loopt door, startregel
          # 4: hol.json staat in %APPDATA%/Dortus/Het Hol
          $uit = (Resolve-Path "producten/steam-hol/e2e/screenshots").Path -replace '\\','/'
          function Speel($log, $args_, $foto = "") {
            $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
              -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle -- hoogte=120 $args_ log=$log" -PassThru
            # beeld na weg: bordje met het wachtkaartje (Mila 16 nov 16:55), na de optocht
            if ($foto -ne "") { Start-Sleep 12; & producten/steam-hol/e2e/scherm.ps1 $foto }
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force }
            Get-Content $log -ErrorAction SilentlyContinue
          }
          $fout = 0
          $a = Speel "$uit/demo-einde-1.log" "steamdemo=1 demo_einde=10 demo=1 vers=1 duur=30" | Out-String
          Write-Output "===== 1 (steamdemo)"; Write-Output $a
          $n = ([regex]::Matches($a, "HOL demo voorbij na")).Count
          if ($n -ne 1 -or $a -notmatch "HOL kroniek [0-9.]+ \(wacht [0-9.]+\): That's the demo\.") { Write-Output "FOUT: eindregel $n keer of niet in de kroniek"; $fout++ }
          if ($a -notmatch "geweigerd \(kopen") { Write-Output "FOUT: kopen niet geweigerd"; $fout++ }
          if ($a -match "HOL koop ") { Write-Output "FOUT: toch gekocht"; $fout++ }
          if ($a -notmatch "geweigerd \(graven") { Write-Output "FOUT: graven niet geweigerd"; $fout++ }
          $na = $a.Substring([math]::Max(0, $a.IndexOf("HOL demo voorbij na")))
          if ($na -notmatch "HOL held binnen: ") { Write-Output "FOUT: geen held meer na het einde"; $fout++ }
          $b = Speel "$uit/demo-einde-2.log" "demo=1 vers=1 duur=30" | Out-String
          Write-Output "===== 2 (zonder steamdemo)"; Write-Output $b
          if ($b -match "That's the demo" -or $b -notmatch "HOL koop ") { Write-Output "FOUT: zonder steamdemo toch een einde"; $fout++ }
          $null = Speel "$uit/demo-einde-3a.log" "steamdemo=1 demo_einde=10 vers=1 duur=15"
          $c = Speel "$uit/demo-einde-3.log" "steamdemo=1 demo_einde=10 duur=8" | Out-String
          Write-Output "===== 3 (herstart)"; Write-Output $c
          if ($c -notmatch "speeltijd 1[5-9] s" -or $c -notmatch "HOL kroniek [0-9.]+ \(wacht [0-9.]+\): Demo over\. The full game keeps it all\.") { Write-Output "FOUT: speeltijd of startregel na herstart"; $fout++ }
          $save = Join-Path $env:APPDATA "Dortus/Het Hol/hol.json"
          if (Test-Path $save) { Write-Output "save staat in $save" } else { Write-Output "FOUT: geen save in $save"; $fout++ }
          Write-Output "demo-einde: $fout FOUT"; "demo-einde: $fout FOUT" | Set-Content "$uit/demo-einde.txt"
          if ($fout -gt 0) { exit 1 }
      - name: Weg geweest (demolijst 4, nooit straffen; 8 uur, klok terug)
        shell: pwsh
        run: |
          # 1: nieuw spel 15 s, save 8 uur terugzetten, opnieuw starten: goud alleen erbij, gangen en upgrades gelijk, kroniek-regels
          # 2: daarna de klok 1 uur vooruit in de save (klok terug op de pc): geen goud erbij en geen crash
          $uit = (Resolve-Path "producten/steam-hol/e2e/screenshots").Path -replace '\\','/'
          $save = Join-Path $env:APPDATA "Dortus/Het Hol/hol.json"
          function Speel($log, $args_, $foto = "") {
            $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
              -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle -- hoogte=120 $args_ log=$log" -PassThru
            # beeld na weg: bordje met het wachtkaartje (Mila 16 nov 16:55), na de optocht
            if ($foto -ne "") { Start-Sleep 12; & producten/steam-hol/e2e/scherm.ps1 $foto }
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force }
            Get-Content $log -ErrorAction SilentlyContinue
          }
          $fout = 0
          $null = Speel "$uit/weg-0.log" "vers=1 duur=15"
          $voor = python producten/steam-hol/e2e/save_terug.py $save 28800
          Write-Output "===== voor (8 uur terug): $voor"
          $a = Speel "$uit/weg-1.log" "duur=15" "$uit/weg-kaartje-120.png" | Out-String
          Write-Output $a
          $na = python producten/steam-hol/e2e/save_terug.py $save 0
          Write-Output "===== na: $na"
          $m = [regex]::Match($a, "HOL weg geweest (\d+) s \(klok terug: false\): goud voor (\d+), helden (\d+), erbij (\d+)")
          if (-not $m.Success) { Write-Output "FOUT: geen regel 'weg geweest'"; $fout++ }
          else {
            $ws = [int]$m.Groups[1].Value; $gv = [int]$m.Groups[2].Value; $h = [int]$m.Groups[3].Value; $er = [int]$m.Groups[4].Value
            if ($ws -lt 28700 -or $ws -gt 29000) { Write-Output "FOUT: weg $ws s, verwacht ±28800"; $fout++ }
            if ($h -lt 1 -or $er -lt 1) { Write-Output "FOUT: 8 uur weg gaf geen helden of goud ($h, $er)"; $fout++ }
            $g1 = [regex]::Match($a, "HOL opslag geladen: \d+ terugkomers, (\d+) goud")
            if (-not $g1.Success -or [int]$g1.Groups[1].Value -ne $gv + $er) { Write-Output "FOUT: goud na laden is niet voor + erbij"; $fout++ }
            # weg op 0,12 (Sanne 16 nov 22:00, balans.md): 8 uur weg = ±een uur spelen, ±115 helden, goud onder de winkel (1048);
            # de oude grens van anderhalve winkel (1572) vervalt
            if ($h -lt 105 -or $h -gt 125) { Write-Output "FOUT: 8 uur weg gaf $h helden, verwacht ±115 (snelheid 0,12)"; $fout++ }
            if ($er -ge 1048) { Write-Output "FOUT: 8 uur weg gaf $er goud, niet minder dan de winkel (1048)"; $fout++ }
            $hd = [regex]::Match($a, "erbij \d+, hoeden (\d+)")
            if (-not $hd.Success) { Write-Output "FOUT: geen hoeden in de regel 'weg geweest'"; $fout++ }
            Write-Output "8 uur weg: goud $gv -> $($gv + $er) (+$er), $h helden, hoeden $($hd.Groups[1].Value)"
            # Hoeden van de nacht (Sanne 17 nov, features.md; bouw Bram): de hoeden vallen na het openen een voor een op de toren
            $hn = [regex]::Match($a, "HOL hoeden van de nacht (\d+) ")
            if ($hd.Success -and [int]$hd.Groups[1].Value -gt 0 -and (-not $hn.Success -or $hn.Groups[1].Value -ne $hd.Groups[1].Value)) { Write-Output "FOUT: 'hoeden van de nacht' ontbreekt of telt anders dan de weg-regel"; $fout++ }
            $bz = [regex]::Match($a, "HOL berg zichtbaar (\d+) -> (\d+)")
            if ($hd.Success -and [int]$hd.Groups[1].Value -gt 0 -and -not $bz.Success) { Write-Output "FOUT: regel 'HOL berg zichtbaar a -> b' ontbreekt"; $fout++ }
            if ($bz.Success) { Write-Output "berg zichtbaar $($bz.Groups[1].Value) -> $($bz.Groups[2].Value)" }
          }
          $gv0 = [regex]::Match($voor, "gangen=(\d+ vallen=\S+ boven=\S+) upgrades=(.*)$"); $gn = [regex]::Match($na, "gangen=(\d+ vallen=\S+ boven=\S+) upgrades=(.*)$")
          if (-not ($gv0.Success -and $gn.Success) -or $gv0.Groups[1].Value -ne $gn.Groups[1].Value -or $gv0.Groups[2].Value -ne $gn.Groups[2].Value) { Write-Output "FOUT: gangen, vallen, kamers of upgrades veranderd"; $fout++ }
          if ($a -notmatch "HOL kroniek [0-9.]+ \(wacht [0-9.]+\): \d+ came, \d+ fell") { Write-Output "FOUT: geen verhaal-regel (came, fell) in de kroniek na terugkomen"; $fout++ }
          # moet Daan 16 nov 17:45: de regel "quarter speed" staat uit (leest als straf)
          if ($a -match "HOL kroniek [0-9.]+ \(wacht [0-9.]+\): Your hole worked at quarter speed") { Write-Output "FOUT: regel 'quarter speed' staat nog in de kroniek"; $fout++ }
          # optocht (Sanne 16 nov 14:50): een nieuw spel van 15 s staat op niveau 1 tot 2, 8 uur weg tilt het naar ±12 in één optocht
          # Daan 16 nov 20:50 (Iris keuring 6 tot 8): "Grew N levels while you were away." en "Gloop got N new hats." zijn eruit,
          # en daardoor mag de regel van de eerste held na terugkomst niet meer vervallen (15 s spelen: geen enkele regel vervalt)
          if ($a -match "HOL kroniek [0-9.]+ \(wacht [0-9.]+\): (Grew \d+ levels while you were away\.|\S+ got \d+ new hats?\.)") { Write-Output "FOUT: regel 'Grew N levels' of 'new hats' staat nog in de kroniek"; $fout++ }
          if ($a -match "HOL kroniek (terugkomer )?vervallen ([0-9.]+): (.*)") { Write-Output "FOUT: kroniekregel vervallen na terugkomst op $($Matches[2]) s: $($Matches[3])"; $fout++ }
          # faam uit één keer weg hooguit 2 hol-niveaus (Sanne 16 nov 22:00): een vers hol van 15 s komt hooguit op niveau 3 of 4,
          # dus geen rij bij de ingang meer en geen regel "N more to come" na één nacht
          $nivs = [regex]::Matches($a, "HOL hol-niveau (\d+) ") | ForEach-Object { [int]$_.Groups[1].Value }
          $hoogste = ($nivs | Measure-Object -Maximum).Maximum
          if (-not $hoogste -or $hoogste -gt 4) { Write-Output "FOUT: na 8 uur weg vanaf een vers hol hol-niveau $hoogste, verwacht 2 tot 4"; $fout++ }
          if ($a -notmatch "HOL weg faam afgekapt \d+ van \d+") { Write-Output "FOUT: faam na 8 uur weg niet afgekapt op 2 niveaus"; $fout++ }
          if ($a -match "HOL rij bij de ingang") { Write-Output "FOUT: rij bij de ingang na één nacht (hooguit 2 niveaus)"; $fout++ }
          if ($a -notmatch "HOL bordje wip na weg \(niveau \d+\)") { Write-Output "FOUT: het bordje wipte niet na weg (Mila 16 nov 16:20)"; $fout++ }
          if ($a -notmatch "HOL optocht wip, .*duur ([0-9.]+) s") { Write-Output "FOUT: geen optocht in de log"; $fout++ }
          elseif ([double]$Matches[1] -gt 12.0) { Write-Output "FOUT: optocht duurt $($Matches[1]) s, hooguit 12"; $fout++ }
          if ($a -match "SCRIPT ERROR") { Write-Output "FOUT: SCRIPT ERROR"; $fout++ }
          $vooruit = python producten/steam-hol/e2e/save_terug.py $save -3600
          $b = Speel "$uit/weg-2.log" "duur=8" | Out-String
          Write-Output "===== klok terug"; Write-Output $b
          # de bewaarde tijd gaat nooit achteruit (voortgang.gd, nieuwe_laatst): anders telt het uur nog een keer als de klok weer goed staat
          $na2 = python producten/steam-hol/e2e/save_terug.py $save 0
          $tv = [regex]::Match($vooruit, "tijd=(\d+)"); $tn = [regex]::Match($na2, "tijd=(\d+)")
          if (-not ($tv.Success -and $tn.Success) -or [long]$tn.Groups[1].Value -lt [long]$tv.Groups[1].Value) { Write-Output "FOUT: bewaarde tijd ging achteruit na klok terug ($vooruit -> $na2)"; $fout++ }
          else { Write-Output "bewaarde tijd bleef staan: $($tv.Groups[1].Value) -> $($tn.Groups[1].Value)" }
          if ($b -notmatch "HOL weg geweest 0 s \(klok terug: true\): goud voor \d+, helden 0, erbij 0") { Write-Output "FOUT: klok terug gaf toch iets of geen regel"; $fout++ }
          if ($b -match "SCRIPT ERROR") { Write-Output "FOUT: SCRIPT ERROR"; $fout++ }
          # Iris keuring 19 punt 1 (Bram 17 nov): tweede nacht met 40 hoeden vooraf (maat 2, volle toren): knijp, boog naar de berg,
          # berg groeit binnen een maat; beelden van het spel zelf op 1 en 6 s en een reeks van 8 per seconde in nacht-40/
          $h40 = python producten/steam-hol/e2e/save_hoeden.py $save 40 28800
          Write-Output "===== nacht met 40 hoeden: $h40"
          $c = Speel "$uit/weg-40.log" "duur=12 nacht_beeld=$uit/nacht-40" | Out-String
          Write-Output (($c -split "`n") | Select-String "weg geweest|hoeden van de nacht|berg zichtbaar|SCRIPT ERROR")
          $hn4 = [regex]::Match($c, "HOL hoeden van de nacht (\d+) \(vallen vanaf [0-9.]+ s, toren nu (\d+)\)")
          $bz4 = [regex]::Match($c, "HOL berg zichtbaar (\d+) -> (\d+)")
          if (-not $hn4.Success -or [int]$hn4.Groups[2].Value -ne 40) { Write-Output "FOUT: nacht met 40 hoeden: geen regel of toren niet op 40"; $fout++ }
          if (-not $bz4.Success -or [int]$bz4.Groups[2].Value -le [int]$bz4.Groups[1].Value) { Write-Output "FOUT: berg groeit niet zichtbaar na de nacht met 40 hoeden"; $fout++ }
          $nr = @(Get-ChildItem "$uit/nacht-40" -Filter "reeks-*.png" -ErrorAction SilentlyContinue).Count
          if (-not (Test-Path "$uit/nacht-40/op-1s.png") -or -not (Test-Path "$uit/nacht-40/op-6s.png") -or $nr -lt 40) { Write-Output "FOUT: beelden nacht-40 ontbreken (reeks $nr)"; $fout++ }
          if ($c -match "SCRIPT ERROR") { Write-Output "FOUT: SCRIPT ERROR in de nacht met 40 hoeden"; $fout++ }
          Write-Output "weg: $fout FOUT"; "weg: $fout FOUT" | Set-Content "$uit/weg.txt"
          if ($fout -gt 0) { exit 1 }
      - name: Eerste start bij de schaal van het scherm (Olaf 16 nov, speeltest)
        shell: pwsh
        run: |
          # zonder bewaarde hoogte en zonder hoogte=<n> kiest het spel de stand bij de dpi; de runner staat op 100% (96 dpi)
          $uit = (Resolve-Path "producten/steam-hol/e2e/screenshots").Path -replace '\\','/'
          $inst = Join-Path $env:APPDATA "Dortus/Het Hol/instellingen.json"
          function Start1($log, $args_) {
            Remove-Item $inst -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
              -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle -- vers=1 duur=6 $args_ log=$log" -PassThru
            if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force }
            (Get-Content $log -ErrorAction SilentlyContinue | Select-String "HOL eerste start|HOL start|SCRIPT ERROR") -join "`n"
          }
          $fout = 0
          $a = Start1 "$uit/schaal-gewoon.log" ""
          Write-Output "===== gewoon"; Write-Output $a
          if ($a -notmatch "HOL eerste start .*dpi=(\d+) hoogte=96") { Write-Output "FOUT: eerste start niet 96 px (#372)"; $fout++ }
          $b = Start1 "$uit/schaal-150.log" "dpi=144"
          Write-Output "===== dpi=144 (150%)"; Write-Output $b
          if ($b -notmatch "HOL eerste start .*dpi=144 hoogte=96" -or $b -notmatch "HOL start hoogte=96 .*venster=\(\d+, 96\)") { Write-Output "FOUT: op 150% niet 96 px (#372, stand van Thijs)"; $fout++ }
          $c = Start1 "$uit/schaal-gekozen.log" "dpi=144 hoogte=200"
          Write-Output "===== dpi=144 hoogte=200"; Write-Output $c
          if ($c -match "HOL eerste start" -or $c -notmatch "HOL start hoogte=200 ") { Write-Output "FOUT: gekozen hoogte niet gevolgd"; $fout++ }
          if ("$a$b$c" -match "SCRIPT ERROR") { Write-Output "FOUT: SCRIPT ERROR bij een eerste start"; $fout++ }
          Write-Output "schaal: $fout FOUT"
          if ($fout -gt 0) { exit 1 }
      - name: GIF maken
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python producten/steam-hol/e2e/gif.py producten/steam-hol/e2e/screenshots/film producten/steam-hol/e2e/screenshots/film.gif 20
      - name: Schermafbeeldingen openbaar zetten (tak schermen)
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          TAK: ${{ github.ref_name }}
        run: |
          SRC="$GITHUB_WORKSPACE/producten/steam-hol/e2e/screenshots"
          [ -d "$SRC" ] || { echo "geen schermafbeeldingen"; exit 0; }
          find "$SRC/film" \( -name 'f*.png' -o -name 'f.wav' \) -delete 2>/dev/null || true
          NAAM=$(echo "$TAK" | tr '/' '-')
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          T="$RUNNER_TEMP/s"
          for poging in 1 2 3 4 5; do
            rm -rf "$T"
            # Olaf 15 nov (tip Bram): smalle kloon, alleen de eigen map uitpakken (heel klonen duurde minuten)
            if git clone -q --depth 1 --filter=blob:none --sparse --branch schermen "$URL" "$T" 2>/dev/null; then
              git -C "$T" sparse-checkout set "steam-hol/$NAAM"
            else
              mkdir -p "$T" && cd "$T" && git init -q -b schermen && git remote add origin "$URL" && cd - >/dev/null
            fi
            D="$T/steam-hol/$NAAM"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd "$T" && git add -A && git commit -q -m "Schermen steam-hol/$NAAM run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then cd - >/dev/null; break; fi
            cd - >/dev/null; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/steam-hol/$NAAM"
          ls -la "$SRC" "$SRC/film" || true
