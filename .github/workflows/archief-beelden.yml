name: Archief beelden naar release

# Opruimen fase 2 (besluit Thijs 19 nov 17:31, vraag 2): oude beelden en ruwe data uit main naar een GitHub-release.
# Start bij een push naar main die iets in organisatie/opruimen/archief-beelden/ verandert (zoals de
# filmpjes-workflows). Een tag pushen weigert de proxy in sommige sessies (403, 22 nov), daarom zo.
# De release-tag staat in organisatie/opruimen/archief-beelden/TAG (een regel, moet beginnen met archief-beelden-).
# Elke lijst <naam>.txt (een pad per regel) wordt <naam>.zip in de release, met de lijst zelf erbij.
# Paden in de zip zijn de paden op main op het moment van de run.
# Staat <naam>.zip al in de release, dan slaat de run die lijst over (de bestanden zijn dan al uit main).
# Pas als deze run groen is en de zips met curl te downloaden zijn, gaan de bestanden uit main (nieuwe commit,
# geen geschiedenis herschreven).
on:
  push:
    branches: [main]
    paths: ["organisatie/opruimen/archief-beelden/**", ".github/workflows/archief-beelden.yml"]

permissions:
  contents: write

concurrency:
  group: archief-beelden
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Zips maken
        run: |
          set -euo pipefail
          TAG=$(head -1 organisatie/opruimen/archief-beelden/TAG | tr -cd 'a-z0-9.-')
          case "$TAG" in archief-beelden-?*) ;; *) echo "FOUT: TAG moet beginnen met archief-beelden-"; exit 1;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          al=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          mkdir -p /tmp/uit
          for lijst in organisatie/opruimen/archief-beelden/*.txt; do
            [ -s "$lijst" ] || continue
            naam=$(basename "$lijst" .txt)
            if printf '%s\n' "$al" | grep -qx "$naam.zip"; then echo "$naam.zip staat al in de release, overgeslagen"; continue; fi
            ontbreekt=0
            while IFS= read -r pad; do
              [ -z "$pad" ] && continue
              [ -f "$pad" ] || { echo "ontbreekt: $pad"; ontbreekt=$((ontbreekt+1)); }
            done < "$lijst"
            [ "$ontbreekt" -eq 0 ] || { echo "FOUT: $ontbreekt bestanden uit $lijst staan niet op main"; exit 1; }
            grep -v '^$' "$lijst" | zip -q -@ "/tmp/uit/$naam.zip"
            cp "$lijst" "/tmp/uit/$naam-lijst.txt"
            echo "$naam.zip: $(unzip -Z1 "/tmp/uit/$naam.zip" | wc -l) bestanden, $(du -h "/tmp/uit/$naam.zip" | cut -f1)"
          done
          ls -la /tmp/uit
      - name: Release maken
        run: |
          set -euo pipefail
          if [ -z "$(ls -A /tmp/uit)" ]; then echo "niets nieuws"; exit 0; fi
          notitie="Oude beelden en ruwe onderzoeksdata uit dortus-hq, uit main gehaald bij opruimen fase 2 (besluit Thijs 19 nov 2026). Elke zip heeft een lijst met de oude paden. Zie organisatie/opruimen/ in de repo."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/uit/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" /tmp/uit/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "$notitie"
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"'
