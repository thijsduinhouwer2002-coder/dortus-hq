name: Garmin Gloop-spel proef (Connect IQ simulator)

# Bouwstraat voor de speelbare proef van het Gloop-spel (Gijs, 16 nov 2026), kopie van garmin-proef.yml:
# compileren, Run No Evil-tests en schermafbeeldingen van een potje dat zichzelf speelt (Bouw.AUTO) in de echte
# Connect IQ-simulator. Image ghcr.io/matco/connectiq-tester bevat SDK 9.2.0, apparaten en fonts (2026-08-31).
# De image draait alleen in de bouw-job zonder schrijfrechten; alleen de job "schermen" mag pushen.

on:
  push:
    branches: [main, "claude/garmin-gloop*"]
    paths: ["producten/garmin-gloop/**", ".github/workflows/garmin-gloop.yml"]
  workflow_dispatch:

jobs:
  bouw:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/matco/connectiq-tester:latest
      APP: producten/garmin-gloop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image ophalen (tot drie pogingen)
        run: |
          for poging in 1 2 3; do docker pull -q "$IMAGE" && exit 0; sleep $((poging * 20)); done; exit 1
      - name: Tests in de simulator (fenix7)
        run: docker run --rm -v "$GITHUB_WORKSPACE/$APP:/app" -w /app "$IMAGE" fenix7
      - name: Schermafbeeldingen per horloge
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$APP/schermen"
          cat > /tmp/schermen.sh <<'SH'
          set -x
          apt-get update -qq >/dev/null && apt-get install -y -qq imagemagick >/dev/null
          openssl genrsa -out /tmp/key.pem 4096 2>/dev/null
          openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/key.pem -out /tmp/key.der -nocrypt
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x1024x24 &
          sleep 2
          simulator > /tmp/sim.log 2>&1 &
          sleep 8
          # Speelbare proef voor een echt horloge (AUTO = false), komt naast de beelden op de tak schermen.
          # Ondertekend met een wegwerpsleutel: alleen om via de kabel in GARMIN/APPS te zetten, niet voor de winkel.
          grep -q 'const AUTO = false;' source/Bouw.mc || exit 1
          # Welke maat launchericoon wil elk horloge? (alleen voor het logboek, mag mislukken)
          for d in fr255 fenix7 venu3s venusq2 fenix7x fr265 venu3 fenix7s fr965 vivoactive5 fenix847mm fr165; do
            f=$(find / -path "*Devices/$d/compiler.json" 2>/dev/null | head -1)
            echo "LAUNCHER $d $(tr -d ' \n' < "$f" 2>/dev/null | grep -o '"launcherIcon":{[^}]*}')" || true
          done
          for d in fr255 fenix7 venu3s venusq2 fenix7x fr265 venu3 fenix7s fr965 vivoactive5 fenix847mm fr165; do
            monkeyc -f monkey.jungle -d "$d" -o "/tmp/prg/gloop-proef-$d.prg" -y /tmp/key.der -r -l 1 || exit 1
            cp "/tmp/prg/gloop-proef-$d.prg" schermen/
          done
          # Proef van het winkelbestand (.iq, alle horloges uit het manifest) met de wegwerpsleutel: alleen om te
          # zien dat het pakket bouwt en hoe groot het is. Het echte bestand maakt de job iq-echt.
          monkeyc -e -r -w -f monkey.jungle -y /tmp/key.der -o /tmp/prg/proef.iq > /tmp/iq-proef.log 2>&1 || { tail -40 /tmp/iq-proef.log; exit 1; }
          echo "HORLOGES_IN_MANIFEST $(grep -c "iq:product id" manifest.xml)"; echo "IQ_PROEF $(stat -c %s /tmp/prg/proef.iq) bytes, waarschuwingen: $(grep -ci warning /tmp/iq-proef.log || true)"
          # Run 122: twaalf horloges met beelden (elke maat, met en zonder START); het manifest telt er 52, die bouwt proef.iq allemaal.
          # 30 beelden per horloge (was 26), zodat het eindscherm er altijd op staat.
          # Het potje speelt zichzelf: start na 6 s (zodat het startscherm op het eerste beeld staat), ronde van 30 s, daarna het eindscherm.
          sed -i 's/const AUTO = false;/const AUTO = true;/' source/Bouw.mc
          grep -q 'const AUTO = true;' source/Bouw.mc || exit 1
          for d in fr255 fenix7 venu3s venusq2 fenix7x fr265 venu3 fenix7s fr965 vivoactive5 fenix847mm fr165; do
            monkeyc -f monkey.jungle -d "$d" -o "bin/app-$d.prg" -y /tmp/key.der -l 1 || exit 1
            monkeydo "bin/app-$d.prg" "$d" > "/tmp/do-$d.log" 2>&1 &
            MD=$!
            # 12 s wachten: bij 8 s stond op het eerste beeld soms nog het vorige horloge (gezien door Daan).
            sleep 12
            for n in $(seq -w 1 30); do
              import -window root "schermen/$d-$n.png"
              sleep 1.5
            done
            kill "$MD" 2>/dev/null || true
            cat "/tmp/do-$d.log" | tail -5
            sleep 2
          done
          git checkout source/Bouw.mc 2>/dev/null || sed -i 's/const AUTO = true;/const AUTO = false;/' source/Bouw.mc
          mogrify -fuzz 2% -trim +repage schermen/*.png
          ls -la schermen
          SH
          docker run --rm --entrypoint bash -v "$GITHUB_WORKSPACE/$APP:/app" -w /app -v /tmp/schermen.sh:/tmp/schermen.sh "$IMAGE" /tmp/schermen.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garmin-gloop-schermen
          path: producten/garmin-gloop/schermen
          if-no-files-found: warn

  schermen:
    needs: bouw
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: garmin-gloop-schermen
          path: schermen
      - name: Schermafbeeldingen openbaar zetten (tak schermen)
        env:
          TOKEN: ${{ github.token }}
          TAK: ${{ github.ref_name }}
        run: |
          SRC="$PWD/schermen"
          [ -d "$SRC" ] && [ -n "$(ls -A "$SRC")" ] || { echo "geen schermafbeeldingen"; exit 0; }
          NAAM=$(echo "$TAK" | tr '/' '-')
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            rm -rf /tmp/s
            if git clone -q --depth 1 --branch schermen "$URL" /tmp/s 2>/dev/null; then :; else
              mkdir /tmp/s && cd /tmp/s && git init -q -b schermen && git remote add origin "$URL" && cd - >/dev/null
            fi
            D="/tmp/s/garmin-gloop/$NAAM"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd /tmp/s && git add -A && git commit -q -m "Schermen garmin-gloop/$NAAM run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then cd - >/dev/null; break; fi
            cd - >/dev/null; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/garmin-gloop/$NAAM"

  # Het winkelbestand, ondertekend met de ontwikkelaarssleutel van Dortus (geheim GARMIN_DEV_KEY, dezelfde als Ebb).
  # Alleen met de hand (workflow_dispatch) of met "[release-gloop]" in het commitbericht, en pas als bouw groen is.
  # Zoals bij Ebb: de image van een derde draait zonder netwerk in een job zonder schrijfrechten, zodat de sleutel er
  # niet uit kan; alleen de job release mag schrijven en die draait de image niet.
  iq-echt:
    needs: bouw
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-gloop]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/matco/connectiq-tester:latest
      APP: producten/garmin-gloop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image ophalen
        run: for poging in 1 2 3; do docker pull -q "$IMAGE" && exit 0; sleep $((poging * 20)); done; exit 1
      - name: Sleutel
        env:
          KEY: ${{ secrets.GARMIN_DEV_KEY }}
        run: |
          mkdir -p /tmp/k && chmod 700 /tmp/k
          if [ -z "$KEY" ]; then echo "::error::Geen GARMIN_DEV_KEY, geen release"; exit 1; fi
          echo "$KEY" | base64 -d > /tmp/k/key.der; echo "Ondertekend met GARMIN_DEV_KEY"
      - name: .iq bouwen (alle horloges uit manifest.xml)
        run: |
          grep -q 'const AUTO = false;' "$APP/source/Bouw.mc" || { echo "::error::Bouw.AUTO staat aan"; exit 1; }
          mkdir -p /tmp/uit && chmod 777 /tmp/uit
          docker run --rm --network none --entrypoint bash -v "$GITHUB_WORKSPACE/$APP:/app" -w /app -v /tmp/k:/k:ro -v /tmp/uit:/uit "$IMAGE" -c \
            'monkeyc -e -r -w -f monkey.jungle -y /k/key.der -o /uit/GloopHatTower.iq > /uit/bouw.log 2>&1; cat /uit/bouw.log; test -s /uit/GloopHatTower.iq'
          rm -rf /tmp/k
          ls -la /tmp/uit/GloopHatTower.iq
          echo "Waarschuwingen: $(grep -ci warning /tmp/uit/bouw.log || true)"
          cd /tmp/uit && sha256sum GloopHatTower.iq | tee GloopHatTower.iq.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gloop-hat-tower-iq
          path: |
            /tmp/uit/GloopHatTower.iq
            /tmp/uit/GloopHatTower.iq.sha256
            /tmp/uit/bouw.log

  release:
    needs: iq-echt
    concurrency:
      group: gloop-hat-tower-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: producten/garmin-gloop/versie.txt
      - uses: actions/download-artifact@v4
        with:
          name: gloop-hat-tower-iq
          path: iq
      - name: Release op GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIE=$(tr -d ' \n' < producten/garmin-gloop/versie.txt)
          TAG="gloop-hat-tower-v$VERSIE"
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" -t "$TAG" \
            -n "Gloop's Hat Tower $VERSIE voor de Connect IQ-winkel, ondertekend met de ontwikkelaarssleutel van Dortus. Commit $GITHUB_SHA, run $GITHUB_RUN_ID. Grootte: $(stat -c %s iq/GloopHatTower.iq) bytes. sha256: $(cut -d' ' -f1 iq/GloopHatTower.iq.sha256)" iq/GloopHatTower.iq iq/GloopHatTower.iq.sha256
