name: Studio filmpjes (bewijs studio-1)

# 23 nov 2026, opdracht hoofdchat ±11:45 NL ("onze filmpjes zijn saai, de omgeving in Blender moet ook beter").
# Vaste studio voor alle Blender-filmpjes van Click Joints Pro: commercie/filmpjes/studio/ (LEESMIJ daar).
# Job kandidaten: per kandidaat-figuur Figure from rig (Pro 1.2.0) in Blender 5.3.0 zonder beeldscherm, telt de
# gewrichten. Job studio: het gekozen figuur in de studio, 3 schermafbeeldingen van het Blender-scherm met het paneel
# en 3 renders per kleurstelling. Job release: alles in release studio-1. Niets wordt geplaatst.
on:
  push:
    branches: [main]
    paths: ["commercie/filmpjes/studio/**", ".github/workflows/studio.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: studio-1
  PRO_COMMIT: f8dfbd30850afbee2da32219fe735c7b386827bd   # tag click-joints-pro-v1.2.0
  QS: https://raw.githubusercontent.com/trebeljahr/quaternius-showcase/0128ca510d653bb04d6d1e4885bd8890b5050b4f/public/glb

jobs:
  kandidaten:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kandidaat:
          - { naam: makehuman-kleding, bron: "repo:commercie/filmpjes/studio/modellen/makehuman-base.obj", hoogte: 220, armen: 0, weg: "" }
          - { naam: knight, bron: "qs:single_knight_pack/KnightCharacter.glb", hoogte: 240, armen: 0, weg: "" }
          - { naam: adventurer, bron: "qs:modular_men/Adventurer.glb", hoogte: 260, armen: 40, weg: "Backpack" }
          - { naam: medieval, bron: "qs:modular_women/Medieval.glb", hoogte: 260, armen: 40, weg: "" }
          - { naam: king, bron: "qs:modular_men/King.glb", hoogte: 260, armen: 40, weg: "" }
          - { naam: robot-expressive, bron: "url:https://raw.githubusercontent.com/mrdoob/three.js/r170/examples/models/gltf/RobotExpressive/RobotExpressive.glb", hoogte: 240, armen: 0, weg: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Blender 5.3.0 en de Pro-zip 1.2.0
        run: |
          B="release/Blender5.3/blender-5.3.0-linux-x64.tar.xz"
          for u in "https://download.blender.org/$B" "https://ftp.nluug.nl/pub/graphics/blender/$B" "https://mirrors.ocf.berkeley.edu/blender/$B"; do
            curl -fsSL --retry 3 --retry-delay 10 -o /tmp/blender.tar.xz "$u" && break; rm -f /tmp/blender.tar.xz
          done
          [ -s /tmp/blender.tar.xz ] || { echo "FOUT: Blender niet te downloaden"; exit 1; }
          mkdir -p /tmp/blender && tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1 && rm /tmp/blender.tar.xz
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 >/dev/null || true
          git fetch -q --no-tags --depth=1 origin "$PRO_COMMIT"
          mkdir -p /tmp/v12 && git archive "$PRO_COMMIT" producten/blender-gewrichten | tar -x -C /tmp/v12
          (cd /tmp/v12/producten/blender-gewrichten && PRO_VERSIE=1.2.0 bash e2e/maak_zip.sh betaald)
          sha256sum /tmp/click_joints_betaald.zip
      - name: Proef ${{ matrix.kandidaat.naam }}
        env:
          BRON: ${{ matrix.kandidaat.bron }}
          NAAM: ${{ matrix.kandidaat.naam }}
          HOOGTE: ${{ matrix.kandidaat.hoogte }}
          CJ_ARMEN: ${{ matrix.kandidaat.armen }}
          WEG: ${{ matrix.kandidaat.weg }}
          BLENDER_USER_RESOURCES: /tmp/cj
          BLENDER_USER_CONFIG: /tmp/cj/config
          BLENDER_USER_EXTENSIONS: /tmp/cj/extensions
        run: |
          mkdir -p /tmp/k /tmp/uit
          case "$BRON" in
            repo:*) cp "${BRON#repo:}" "/tmp/k/$NAAM.${BRON##*.}" ;;
            qs:*) curl -fsSL --retry 3 -o "/tmp/k/$NAAM.glb" "$QS/${BRON#qs:}" ;;
            url:*) curl -fsSL --retry 3 -o "/tmp/k/$NAAM.glb" "${BRON#url:}" ;;
          esac
          m=$(ls /tmp/k/$NAAM.*)
          timeout 2400 /tmp/blender/blender -b --factory-startup --python commercie/filmpjes/studio/proef_figuur.py -- /tmp/click_joints_betaald.zip "$m" "$HOOGTE" "$WEG" /tmp/uit 2>&1 | tee /tmp/uit/proef-$NAAM.log | grep -E "\[studio\]|PROEF|Traceback" | cut -c1-600
          rm -f /tmp/uit/*.blend
          ls /tmp/uit
      - uses: actions/upload-artifact@v4
        with:
          name: kandidaat-${{ matrix.kandidaat.naam }}
          path: /tmp/uit/
          retention-days: 7

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        stijl: [a, b]
    steps:
      - uses: actions/checkout@v4
      - name: Systeempakketten
        run: |
          timeout 300 sudo apt-get update -q -o Acquire::http::Timeout=20 -o Acquire::Retries=3 >/dev/null || echo "apt update traag, ga door"
          timeout 600 sudo apt-get install -y -q -o Acquire::http::Timeout=20 -o Acquire::Retries=3 xvfb libgl1 libegl1 libgl1-mesa-dri libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 imagemagick xdotool
      - name: Blender 5.3.0 en de Pro-zip 1.2.0
        run: |
          B="release/Blender5.3/blender-5.3.0-linux-x64.tar.xz"
          for u in "https://download.blender.org/$B" "https://ftp.nluug.nl/pub/graphics/blender/$B" "https://mirrors.ocf.berkeley.edu/blender/$B"; do
            curl -fsSL --retry 3 --retry-delay 10 -o /tmp/blender.tar.xz "$u" && break; rm -f /tmp/blender.tar.xz
          done
          [ -s /tmp/blender.tar.xz ] || { echo "FOUT: Blender niet te downloaden"; exit 1; }
          mkdir -p /tmp/blender && tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1 && rm /tmp/blender.tar.xz
          git fetch -q --no-tags --depth=1 origin "$PRO_COMMIT"
          mkdir -p /tmp/v12 && git archive "$PRO_COMMIT" producten/blender-gewrichten | tar -x -C /tmp/v12
          (cd /tmp/v12/producten/blender-gewrichten && PRO_VERSIE=1.2.0 bash e2e/maak_zip.sh betaald)
          sha256sum /tmp/click_joints_betaald.zip
      - name: Studio laden, schermen en renders (stijl ${{ matrix.stijl }})
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          CJ_STIJL: ${{ matrix.stijl }}
          BLENDER_USER_RESOURCES: /tmp/cj
          BLENDER_USER_CONFIG: /tmp/cj/config
          BLENDER_USER_EXTENSIONS: /tmp/cj/extensions
        run: |
          /tmp/blender/blender -b --python-expr "import bpy; bpy.context.preferences.view.show_splash=False; bpy.ops.wm.save_userpref()"
          mkdir -p /tmp/uit
          naam="figuur-${{ matrix.stijl }}"
          timeout 4800 xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            /tmp/blender/blender --gpu-backend opengl -p 0 0 1920 1080 --python commercie/filmpjes/studio/bewijs.py -- \
            /tmp/uit /tmp/click_joints_betaald.zip commercie/filmpjes/studio/modellen/makehuman-base.obj "$naam" 2>&1 | tee /tmp/uit/studio-$naam.log | grep -E "\[studio\]|Traceback|Error" | cut -c1-600 || true
          if grep -q "STUDIO FOUT" /tmp/uit/studio-$naam.log; then echo "FOUT in de studio"; exit 1; fi
          for d in bouw scherm1 scherm2 scherm3 render1 render2 render3 klaar; do grep -q "STUDIO OK $d" /tmp/uit/studio-$naam.log || { echo "FOUT: stap $d"; exit 1; }; done
          for f in /tmp/uit/scherm-*.png; do mv "$f" "/tmp/uit/${naam}-$(basename $f)"; done
          ls -la /tmp/uit
      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.stijl }}
          path: /tmp/uit/
          retention-days: 7

  release:
    needs: [kandidaten, studio]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/a
      - name: In release studio-1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r && find /tmp/a -type f \( -name '*.png' -o -name '*.json' -o -name '*.log' \) -exec cp {} /tmp/r/ \;
          ls -la /tmp/r
          (cd /tmp/r && for j in *-[0-9]*.json; do [ -f "$j" ] && python3 -c "import json,sys; d=json.load(open('$j')); print(d['model'], d['hoogte_mm'], 'mm:', d['gewrichten'], 'gewrichten,', d['delen'], 'delen, stukken', d['stukken'])"; done) | tee /tmp/r/kandidaten.txt
          echo "Studio voor de Blender-filmpjes van Click Joints Pro 1.2.0 (commercie/filmpjes/studio/). Per kleurstelling 3 renders (staand in pose, staand uit elkaar, liggend) en 3 schermafbeeldingen van het Blender-scherm. kandidaten.txt: Figure from rig per kandidaat-figuur. Werkmateriaal, niets geplaatst." > /tmp/notes.md
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Studio 1 (filmpjes Click Joints Pro)" --notes-file /tmp/notes.md
          gh release upload "$TAG" /tmp/r/* --clobber -R "$GITHUB_REPOSITORY"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | .name + " " + (.size|tostring))'
