name: Steam proef (Godot op Windows, doorzichtig venster)

# Technische proef van Olaf (9 nov 2026), geen product: start een Godot-strook boven de taakbalk
# op een echte Windows-runner, met Kladblok erachter, en maakt schermafbeeldingen.
on:
  push:
    branches: [main, "claude/steam-*"]
    paths: ["producten/steam-proef/**", ".github/workflows/steam-proef.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proef:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3 downloaden
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Get-ChildItem godot
      - name: Strook starten met Kladblok erachter, schermafbeeldingen
        shell: pwsh
        run: |
          $uit = "producten/steam-proef/e2e/screenshots"
          New-Item -ItemType Directory -Force $uit | Out-Null
          Start-Process notepad.exe
          Start-Sleep 3
          & producten/steam-proef/e2e/scherm.ps1 "$uit/0-zonder-strook.png"
          # Ronde 3: gewone exe (geen consolevenster), drie standen naast elkaar, CPU van het Godot-proces zelf.
          $drv = "opengl3_angle"
          $h = [int](Get-CimInstance Win32_VideoController | Select-Object -First 1).CurrentVerticalResolution
          Write-Output "schermhoogte $h"
          $samen = @()
          foreach ($stand in @("vol60", "fps30", "zuinig")) {
            $log = ((Resolve-Path $uit).Path -replace '\\','/') + "/godot-$stand.log"
            $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
              -ArgumentList "--path producten/steam-proef/godot --rendering-driver $drv -- stand=$stand duur=40 log=$log" -PassThru
            Start-Sleep 10
            & producten/steam-proef/e2e/scherm.ps1 "$uit/1-strook-$stand.png"
            if ($stand -eq "zuinig") {
              & producten/steam-proef/e2e/klik.ps1 300 ($h - 48 - 220 + 25)
              Start-Sleep 1
              & producten/steam-proef/e2e/klik.ps1 300 ($h - 48 - 40)
            }
            Start-Sleep 2
            $p.Refresh(); $c1 = $p.TotalProcessorTime.TotalSeconds
            Start-Sleep 20
            $p.Refresh(); $c2 = $p.TotalProcessorTime.TotalSeconds
            $mb = [int]($p.WorkingSet64 / 1MB)
            $per10 = [math]::Round(($c2 - $c1) / 2, 2)
            $regel = "CPU $stand : $per10 CPU-seconden per 10 s (gemeten over 20 s), geheugen $mb MB, kernen op de runner $([Environment]::ProcessorCount)"
            Write-Output $regel; $samen += $regel
            Start-Sleep 12
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Write-Output "===== log $stand"; Get-Content $log -ErrorAction SilentlyContinue
          }
          $samen | Set-Content "$uit/cpu.txt"
          Write-Output "===== samen"; $samen

      - name: Schermafbeeldingen openbaar zetten (tak schermen)
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          TAK: ${{ github.ref_name }}
        run: |
          SRC="$GITHUB_WORKSPACE/producten/steam-proef/e2e/screenshots"
          [ -d "$SRC" ] && [ -n "$(ls -A "$SRC")" ] || { echo "geen schermafbeeldingen"; exit 0; }
          NAAM=$(echo "$TAK" | tr '/' '-')
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          T="$RUNNER_TEMP/s"
          for poging in 1 2 3 4 5; do
            rm -rf "$T"
            if git clone -q --depth 1 --branch schermen "$URL" "$T" 2>/dev/null; then :; else
              mkdir -p "$T" && cd "$T" && git init -q -b schermen && git remote add origin "$URL" && cd - >/dev/null
            fi
            D="$T/steam-proef/$NAAM"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd "$T" && git add -A && git commit -q -m "Schermen steam-proef/$NAAM run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then cd - >/dev/null; break; fi
            cd - >/dev/null; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/steam-proef/$NAAM"
          ls "$SRC"
