name: Garmin Ebb (Connect IQ simulator)

# Ebb, de ademapp (Gijs, 10 nov 2026), gekopieerd uit de bouwstraat garmin-proef: compileren, Run No Evil-tests en schermafbeeldingen in de echte
# Connect IQ-simulator. Image ghcr.io/matco/connectiq-tester bevat SDK 9.2.0, apparaten en fonts (2026-08-31).
# De image draait alleen in de bouw-job zonder schrijfrechten; alleen de job "schermen" mag pushen.

on:
  push:
    branches: [main, "claude/garmin-*"]
    paths: ["producten/garmin-adem/**", ".github/workflows/garmin-adem-e2e.yml"]
  workflow_dispatch:

jobs:
  bouw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Vastgezet op de digest van :latest van 10 nov 2026 (ghcr.io), zodat een nieuwe image de toets niet ongemerkt verandert.
      IMAGE: ghcr.io/matco/connectiq-tester@sha256:64958e8fd2925d0c4986d72a9aa9d8e2101297a881354aab0118be2f1dc22105
      APP: producten/garmin-adem
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image ophalen (tot drie pogingen)
        run: |
          for poging in 1 2 3; do docker pull -q "$IMAGE" && exit 0; sleep $((poging * 20)); done; exit 1
      - name: Tests in de simulator (fenix7)
        run: docker run --rm -v "$GITHUB_WORKSPACE/$APP:/app" -w /app "$IMAGE" fenix7
      - name: Schermafbeeldingen per horloge
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$APP/schermen"
          cat > /tmp/schermen.sh <<'SH'
          set -x
          apt-get update -qq >/dev/null && apt-get install -y -qq imagemagick xdotool >/dev/null || apt-get install -y -qq imagemagick >/dev/null
          openssl genrsa -out /tmp/key.pem 4096 2>/dev/null
          openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/key.pem -out /tmp/key.der -nocrypt
          touch /tmp/merk
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x1024x24 &
          sleep 2
          simulator > /tmp/sim.log 2>&1 &
          sleep 8
          for d in fenix7 fr255 vivoactive5 venu2 fr265 epix2pro47mm fenix847mm fr965 venu3; do
            echo "== bouw $d"; monkeyc -f monkey.jungle -d "$d" -o "bin/app-$d.prg" -y /tmp/key.der -l 2 -w > "/tmp/bouw-$d.log" 2>&1; R=$?
            cat "/tmp/bouw-$d.log"; [ $R -eq 0 ] || exit 1
            echo "WAARSCHUWINGEN $d: $(grep -ci warning "/tmp/bouw-$d.log")"
          done
          for d in fenix7 fr255 vivoactive5 venu2 fr265 epix2pro47mm fenix847mm fr965 venu3; do
            echo "== testbouw $d"; monkeyc -f demo.jungle -d "$d" -o "bin/demo-$d.prg" -y /tmp/key.der -l 2 || exit 1
          done
          for d in fenix7 vivoactive5 fr265 fenix847mm; do
            touch /tmp/merk-$d
            monkeydo "bin/app-$d.prg" "$d" > "/tmp/do-$d.log" 2>&1 &
            MD=$!
            sleep 14
            import -window root "schermen/$d-a.png"
            sleep 3
            import -window root "schermen/$d-b.png"
            # Proef: met toetsen naar startmenu (m) en rustig ademen, Box (r). Lukt het niet, dan alleen geen beeld.
            if command -v xdotool >/dev/null; then
              W=$(xdotool search --onlyvisible --name "Simulator" 2>/dev/null | head -1)
              [ -n "$W" ] && xdotool windowactivate "$W" 2>/dev/null
              xdotool key Return; sleep 3
              import -window root "schermen/$d-m.png"
              xdotool key Down; sleep 1; xdotool key Return; sleep 7
              import -window root "schermen/$d-r.png"
            fi
            kill "$MD" 2>/dev/null || true
            sleep 2
            echo "== uitvoer app $d"; cat "/tmp/do-$d.log"
          done
          # Eis 10: testbouw neemt een sessie op (inhoud 3 s en 5 s), slaat op, en gooit een tweede opname weg.
          # Simulator per horloge opnieuw starten: een echt horloge opent elke app vers. Zonder herstart lekte
          # een lege lap van een weggegooide opname in de volgende opname op een ander horloge (run 42772406769).
          herstart() { pkill -f simulator 2>/dev/null; sleep 2; simulator > /tmp/sim.log 2>&1 & sleep 8; }
          for d in fenix7 vivoactive5 fenix847mm; do
            herstart
            touch /tmp/demo-$d
            monkeydo "bin/demo-$d.prg" "$d" > "/tmp/demo-$d.log" 2>&1 &
            MD=$!
            sleep 7
            import -window root "schermen/$d-demo-a.png"
            sleep 4
            import -window root "schermen/$d-demo-b.png"
            sleep 17
            import -window root "schermen/$d-demo-c.png"
            sleep 16
            import -window root "schermen/$d-demo-d.png"
            kill "$MD" 2>/dev/null || true
            sleep 2
            echo "== uitvoer testbouw $d"; cat "/tmp/demo-$d.log"
            mkdir -p "schermen/fit/$d"
            find / -xdev -iname '*.fit' -newer /tmp/demo-$d -not -path '/proc/*' -not -path '/app/*' 2>/dev/null | while read -r f; do
              ls -la "$f"; cp "$f" "schermen/fit/$d/$(basename "$f")"
            done
            # Tweede start van de testbouw: opname weggooien, er mag geen nieuw FIT-bestand komen.
            touch /tmp/weg-$d
            monkeydo "bin/demo-$d.prg" "$d" > "/tmp/weg-$d.log" 2>&1 &
            MD=$!
            sleep 12
            kill "$MD" 2>/dev/null || true
            sleep 2
            echo "== uitvoer tweede start $d"; cat "/tmp/weg-$d.log"
            mkdir -p "schermen/fit-weg/$d"
            find / -xdev -iname '*.fit' -newer /tmp/weg-$d -not -path '/proc/*' -not -path '/app/*' 2>/dev/null | while read -r f; do
              ls -la "$f"; cp "$f" "schermen/fit-weg/$d/$(basename "$f")"
            done
          done
          # Eis 11 en 12: de andere zes horloges één keer door de testbouw, schermen plus meting van getal en geheugen.
          for d in fr255 venu2 fr265 epix2pro47mm fr965 venu3; do
            herstart
            monkeydo "bin/demo-$d.prg" "$d" > "/tmp/demo-$d.log" 2>&1 &
            MD=$!
            sleep 7
            import -window root "schermen/$d-demo-a.png"
            sleep 4
            import -window root "schermen/$d-demo-b.png"
            sleep 17
            import -window root "schermen/$d-demo-c.png"
            sleep 16
            import -window root "schermen/$d-demo-d.png"
            kill "$MD" 2>/dev/null || true
            sleep 2
            echo "== uitvoer testbouw $d"; cat "/tmp/demo-$d.log"
          done
          # Eis 11 en 12 nakijken: groot getal minstens 30% van de breedte, geheugen onder 80%.
          grep -H "GROOT\|GEHEUGEN" /tmp/demo-*.log | sed "s,/tmp/demo-,," | tee /tmp/metingen.txt schermen/metingen.txt
          # Epix2pro47mm: grootste systeemletter 123 van 416 px (29,6%), daarom daar de eigen cijferletter (130 px).
          awk '/GROOT/ { p=$NF; sub("%","",p); if (p+0 < 30) { print "EIS11 TE KLEIN: " $0; f=1 } }
               /GEHEUGEN/ { n++; p=$NF; sub("%","",p); if (p+0 >= 80) { print "EIS12 TE VOL: " $0; f=1 } }
               END { print "EIS12 horloges met meting: " n; if (n < 9) f=1; exit f }' /tmp/metingen.txt || { echo "EIS11/12 FOUT"; touch schermen/eis11-12-fout; }
          # Proef (telt niet mee): derde start op fenix847mm zonder herstart, direct na het weggooien.
          d=fenix847mm; touch /tmp/zonder-$d
          monkeydo "bin/demo-$d.prg" "$d" > "/tmp/zonder-$d.log" 2>&1 &
          MD=$!; sleep 28; kill "$MD" 2>/dev/null || true; sleep 2
          echo "== uitvoer derde start zonder herstart"; cat "/tmp/zonder-$d.log"
          mkdir -p "schermen/fit-proef/$d"
          find / -xdev -iname '*.fit' -newer /tmp/zonder-$d -not -path '/proc/*' -not -path '/app/*' 2>/dev/null | while read -r f; do
            cp "$f" "schermen/fit-proef/$d/$(basename "$f")"
          done
          echo "== alle activiteiten in de simulator"; ls -la --time-style=full-iso /tmp/com.garmin.connectiq/GARMIN/Activities 2>/dev/null || true
          mogrify -fuzz 2% -trim +repage schermen/*.png
          ls -la schermen
          SH
          docker run --rm --entrypoint bash -v "$GITHUB_WORKSPACE/$APP:/app" -w /app -v /tmp/schermen.sh:/tmp/schermen.sh "$IMAGE" /tmp/schermen.sh
      - name: FIT-bestanden lezen met fitdecode
        if: always()
        run: |
          pip install -q fitdecode
          cat > /tmp/leesfit.py <<'PY'
          import glob, sys, fitdecode
          bestanden = sorted(glob.glob(sys.argv[1] + "/**/*.fit", recursive=True))
          print("aantal FIT-bestanden:", len(bestanden))
          for pad in bestanden:
              print("==", pad)
              with fitdecode.FitReader(pad) as fit:
                  for fr in fit:
                      if isinstance(fr, fitdecode.FitDataMessage) and fr.name in ("sport", "session", "lap", "field_description", "developer_data_id"):
                          gewoon = ("sport", "sub_sport", "name", "num_laps", "total_elapsed_time", "field_name", "units", "developer_data_index", "field_definition_number", "inhoud", "beste")
                          velden = {f.name: f.value for f in fr.fields if f.name in gewoon}
                          dev = {f.name: f.value for f in fr.fields if type(f.field_def).__name__ == "DevField"}
                          print(fr.name, velden, "dev:", dev)
          # Eis 10 nakijken: per horloge precies één bestand (het weggegooide geeft er geen), training 10, subsport 62, 2 laps, inhoud 3 en 5, beste 5.
          import os
          fout = []
          mappen = sorted(glob.glob(sys.argv[1] + "/fit/*/"))
          weg = glob.glob(sys.argv[1] + "/fit-weg/**/*.fit", recursive=True)
          print("EIS10 FIT-bestanden na weggooien:", len(weg))
          if weg:
              fout.append("na weggooien toch %d FIT-bestanden" % len(weg))
          if len(mappen) != 3:
              fout.append("verwacht 3 horloges, gevonden %d" % len(mappen))
          for m in mappen:
              fits = sorted(glob.glob(m + "*.fit"))
              naam = os.path.basename(m.rstrip("/"))
              if len(fits) != 1:
                  fout.append("%s: %d FIT-bestanden in plaats van 1" % (naam, len(fits))); continue
              sessie, inhoud, beste = {}, [], None
              with fitdecode.FitReader(fits[0]) as fit:
                  for fr in fit:
                      if not isinstance(fr, fitdecode.FitDataMessage): continue
                      velden = {f.name: f.value for f in fr.fields}
                      if fr.name == "session":
                          sessie = {f.name: f.raw_value for f in fr.fields if f.name in ("sport", "sub_sport", "num_laps")}
                          beste = velden.get("beste")
                      if fr.name == "lap":
                          inhoud.append(velden.get("inhoud"))
              uitslag = (sessie.get("sport"), sessie.get("sub_sport"), sessie.get("num_laps"), inhoud, beste)
              print("EIS10", naam, "sport, subsport, laps, inhoud, beste:", uitslag)
              if uitslag != (10, 62, 2, [3, 5], 5):
                  fout.append("%s: %s" % (naam, uitslag))
          for f in sorted(glob.glob(sys.argv[1] + "/fit-proef/**/*.fit", recursive=True)):
              laps = []
              with fitdecode.FitReader(f) as fit:
                  for fr in fit:
                      if isinstance(fr, fitdecode.FitDataMessage) and fr.name == "lap":
                          laps.append(({x.name: x.value for x in fr.fields}).get("inhoud"))
              print("EIS10-PROEF zonder herstart, inhoud per lap:", laps)
          if os.path.exists(sys.argv[1] + "/metingen.txt"):
              print(open(sys.argv[1] + "/metingen.txt").read())
          if os.path.exists(sys.argv[1] + "/eis11-12-fout"):
              fout.append("eis 11 of 12 niet gehaald, zie metingen in de stap ervoor")
          print("EIS10 UITSLAG:", "goed" if not fout else fout)
          sys.exit(1 if fout else 0)
          PY
          python3 /tmp/leesfit.py "$APP/schermen"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garmin-adem-schermen
          path: producten/garmin-adem/schermen
          if-no-files-found: warn

  schermen:
    needs: bouw
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: garmin-adem-schermen
          path: schermen
      - name: Schermafbeeldingen openbaar zetten (tak schermen)
        env:
          TOKEN: ${{ github.token }}
          TAK: ${{ github.ref_name }}
        run: |
          SRC="$PWD/schermen"
          [ -d "$SRC" ] && [ -n "$(ls -A "$SRC")" ] || { echo "geen schermafbeeldingen"; exit 0; }
          NAAM=$(echo "$TAK" | tr '/' '-')
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            rm -rf /tmp/s
            if git clone -q --depth 1 --branch schermen "$URL" /tmp/s 2>/dev/null; then :; else
              mkdir /tmp/s && cd /tmp/s && git init -q -b schermen && git remote add origin "$URL" && cd - >/dev/null
            fi
            D="/tmp/s/garmin-adem/$NAAM"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd /tmp/s && git add -A && git commit -q -m "Schermen garmin-adem/$NAAM run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then cd - >/dev/null; break; fi
            cd - >/dev/null; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/garmin-adem/$NAAM"
