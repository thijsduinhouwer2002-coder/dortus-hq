name: Regisseur 2 (Shorts in vorm groot, grote ondertitels)

# 23 nov 2026, Regisseur (opdracht Thijs: filmpjes mooier, voice-over synchroon). Nieuwe montage
# commercie/filmpjes/regisseur-2/montage2.py, vorm "groot": beeld bijna schermvullend, hook-render over het hele
# scherm met duidelijke zoom, grote ondertitels die met de stem meelopen. Beeld: de echte opname uit release
# regisseur-1 (Blender 5.3.0, Click Joints Pro 1.2.0), alleen de stukken zonder figuur, en render-2 (alleen de strips).
# Stem: Kokoro (Apache 2.0), of ElevenLabs als dat geheim bestaat. Controle: synchroon2.py (0,3 s), geluid_check.py,
# lengte 40 tot 60 s. Alles in release regisseur-2. Er wordt niets geplaatst.
on:
  push:
    branches: [main]
    paths: ["commercie/filmpjes/regisseur-2/**", ".github/workflows/regisseur-2.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: regisseur-2
  BRON: regisseur-1
  KOKORO_URL: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
  KOKORO_ONNX_SHA: beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a
  KOKORO_VOICES_SHA: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Systeempakketten
        run: |
          timeout 300 sudo apt-get update -q -o Acquire::http::Timeout=20 -o Acquire::Retries=3 >/dev/null || echo "apt update traag, ga door"
          timeout 600 sudo apt-get install -y -q -o Acquire::http::Timeout=20 -o Acquire::Retries=3 ffmpeg fonts-inter
      - name: Bron uit release regisseur-1 (opname en render-2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pro
          gh release download "$BRON" -R "$GITHUB_REPOSITORY" -p opname-pro.mkv -p film-pro.json -p render-2.png -D /tmp/pro
          mv /tmp/pro/opname-pro.mkv /tmp/pro/opname-ruw.mkv; mv /tmp/pro/film-pro.json /tmp/pro/film.json
          sha256sum /tmp/pro/*
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stem-pakketten en Kokoro (sha256 vast)
        run: |
          python -m pip install -q kokoro-onnx==0.6.1 soundfile faster-whisper==1.2.1 numpy pillow
          mkdir -p /tmp/kokoro
          curl -fsSL --retry 3 -o /tmp/kokoro/kokoro-v1.0.onnx "$KOKORO_URL/kokoro-v1.0.onnx"
          curl -fsSL --retry 3 -o /tmp/kokoro/voices-v1.0.bin "$KOKORO_URL/voices-v1.0.bin"
          echo "$KOKORO_ONNX_SHA  /tmp/kokoro/kokoro-v1.0.onnx" | sha256sum -c
          echo "$KOKORO_VOICES_SHA  /tmp/kokoro/voices-v1.0.bin" | sha256sum -c
      - name: Montage (vorm groot)
        env:
          KOKORO_MODEL: /tmp/kokoro/kokoro-v1.0.onnx
          KOKORO_VOICES: /tmp/kokoro/voices-v1.0.bin
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
        run: |
          mkdir -p /tmp/klaar
          for n in fit-groot-a fit-groot-b; do
            python commercie/filmpjes/regisseur-2/vul.py commercie/filmpjes/regisseur-2/$n.json /tmp/pro/film.json /tmp/$n.json
            rm -rf /tmp/klaar/zinnen
            python commercie/filmpjes/regisseur-2/montage2.py /tmp/$n.json /tmp/pro /tmp/klaar groot
            mv /tmp/klaar/$n-groot.mp4 /tmp/klaar/$n.mp4
            mv /tmp/klaar/overzicht-groot.jpg /tmp/klaar/overzicht-$n.jpg
          done
          rm -rf /tmp/klaar/zinnen
      - name: Controle (synchroon, geluid, lengte)
        env:
          WHISPER_MODEL: small.en
        run: |
          cd /tmp/klaar
          ok=0
          for n in fit-groot-a fit-groot-b; do
            mkdir -p meting-$n
            python $GITHUB_WORKSPACE/commercie/filmpjes/regisseur-2/synchroon2.py $n.mp4 $n-groot-script.json meting-$n || ok=1
            for f in meting-$n/*; do mv "$f" "$(basename ${f%.*})-$n.${f##*.}"; done
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $n.mp4)
            echo "$n $d s" | tee -a lengtes.txt
            python -c "import sys; d=float('$d'); sys.exit(0 if 40.0 <= d <= 60.0 else 1)" || { echo "FOUT: $n is $d s"; ok=1; }
          done
          python $GITHUB_WORKSPACE/organisatie/controle/geluid_check.py *.mp4 | tee geluid_check.txt
          grep -q "FOUT" geluid_check.txt && ok=1
          sha256sum *.mp4 | tee SHA256SUMS.txt
          exit $ok
      - name: In de release zetten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d /tmp/klaar ] || exit 1
          cd /tmp/klaar
          echo "Regisseur 2: Shorts in vorm groot (beeld schermvullend, grote ondertitels, voice-over Kokoro Apache 2.0). Beeld uit release regisseur-1 (Blender 5.3.0, Click Joints Pro 1.2.0), zonder figuur. Concepten: marketing/wachtrij/. Niets geplaatst." > /tmp/notes.md
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Regisseur 2 (vorm groot)" --notes-file /tmp/notes.md
          ls -la
          gh release upload "$TAG" $(ls *.mp4 *.json *.srt *.md *.txt *.jpg 2>/dev/null) --clobber -R "$GITHUB_REPOSITORY"
