name: Click Joints Pro uitgave (zip als artefact, winkelplaatjes in de release)

# Zet de Pro-zip uit een groene e2e-run en de winkelplaatjes als release-assets op één plek,
# zodat het uploaden op Superhive alleen downloaden en uploaden is (Bram, 15 nov 2026).
# De zip komt uit de e2e-run zelf (daar getest in 4.2.23, 5.2.3 en 5.3.0), niet opnieuw gebouwd.
# Besluit Thijs 15 nov 19:52: de betaalde zip komt NIET in de openbare release. Hij gaat als
# Actions-artefact met 3 dagen bewaartijd; de hoofdchat haalt hem daar op voor Superhive.
# De release krijgt alleen de plaatjes en SHA256SUMS.txt (met de sha256 van de zip ter controle).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Groene run van blender-gewrichten-e2e.yml op main"
        required: true

permissions:
  contents: write
  actions: read

env:
  TAG: click-joints-pro-v1.2.9
  VERSIE: "1.2.9"
  RUN: ${{ inputs.run_id }}

jobs:
  uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: e2e-run moet groen zijn en van main komen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.path, .head_branch, .head_sha, .conclusion' | tee /tmp/run.txt
          grep -q 'blender-gewrichten-e2e.yml' /tmp/run.txt || { echo "FOUT: geen e2e-run"; exit 1; }
          [ "$(sed -n 2p /tmp/run.txt)" = "main" ] || { echo "FOUT: niet van main"; exit 1; }
          [ "$(sed -n 4p /tmp/run.txt)" = "success" ] || { echo "FOUT: run niet groen"; exit 1; }
      - name: Schermen van de run ophalen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in 4.2.23 5.2.3 5.3.0; do gh run download "$RUN" -n "blender-gewrichten-screenshots-$v" -D /tmp/s; done   # elk artefact heeft zijn eigen map <versie>/
          # Sinds 19 nov staat de betaalde zip in een eigen artefact (niet meer bij de schermen, die gaan openbaar
          # naar de tak schermen). Oudere runs hebben hem nog bij de schermen.
          for v in 4.2.23 5.2.3 5.3.0; do gh run download "$RUN" -n "click-joints-pro-zip-e2e-$v" -D /tmp/s 2>/dev/null || echo "geen eigen zip-artefact voor $v (oudere run)"; done
          ls -la /tmp/s/*/click_joints_pro-*
      - name: Zip nakijken (sha256, versie, gelijk in alle drie de Blenders)
        run: |
          z=/tmp/s/5.3.0/click_joints_pro-$VERSIE.zip
          (cd /tmp/s/5.3.0 && sed "s# .*#  click_joints_pro-$VERSIE.zip#" click_joints_pro-$VERSIE.sha256 | sha256sum -c -)
          unzip -p "$z" blender_manifest.toml | tee /tmp/man.toml
          grep -qx "version = \"$VERSIE\"" /tmp/man.toml || { echo "FOUT: versie"; exit 1; }
          grep -qx 'name = "Click Joints Pro"' /tmp/man.toml || { echo "FOUT: naam"; exit 1; }
          unzip -l "$z" | grep -q 'betaald/__init__.py' || { echo "FOUT: geen betaald/"; exit 1; }
          for v in 4.2.23 5.2.3; do
            mkdir -p /tmp/a /tmp/b && rm -rf /tmp/a/* /tmp/b/*
            unzip -q "$z" -d /tmp/a && unzip -q "/tmp/s/$v/click_joints_pro-$VERSIE.zip" -d /tmp/b
            diff -r /tmp/a /tmp/b && echo "inhoud gelijk aan de zip uit $v"
          done
      - name: Bestanden voor de release klaarzetten
        run: |
          mkdir -p /tmp/uit
          cp "/tmp/s/5.3.0/click_joints_pro-$VERSIE.zip" "/tmp/uit/click_joints_pro-$VERSIE.zip"
          # 1.1 (Ruben, 17 nov run 29): eerst de hele figuur uit de rig (plaatje 19, uit 5.3.0: daar alle negen
          # gewrichten), dan de plaatjes van 1.0. Volgorde wacht op het ja van Daan.
          cp /tmp/s/5.3.0/19-mens-x.png /tmp/uit/1-figuur-uit-rig.png
          cp ontwerp/click-joints/pro/poster-3.png /tmp/uit/2-poster-3.png
          cp /tmp/s/5.2.3/13-pro-knie-x.png /tmp/uit/3-knie-met-boog.png
          cp /tmp/s/5.2.3/14-pro-knie-rood-x.png /tmp/uit/4-rood-voorbij-de-stop.png
          cp /tmp/s/5.2.3/8-winkel-x.png /tmp/uit/5-kogel-passing.png
          cp /tmp/s/5.2.3/9-winkel-rood-x.png /tmp/uit/6-kogel-rood.png
          python3 - <<'EOF'
          import glob, os, struct
          for f in sorted(glob.glob("/tmp/uit/*.png")):
              w, h = struct.unpack(">II", open(f, "rb").read()[16:24])
              mb = os.path.getsize(f) / 1e6
              print(f, w, h, f"{mb:.2f} MB")
              assert (w, h) == (1920, 1080), "maat moet 1920 x 1080 zijn"
              assert mb < 2, "plaatje moet onder 2 MB"
          EOF
          (cd /tmp/uit && sha256sum * | tee SHA256SUMS.txt)
          mkdir -p /tmp/zip && mv "/tmp/uit/click_joints_pro-$VERSIE.zip" /tmp/zip/
          ls /tmp/uit | grep -q '\.zip$' && { echo "FOUT: zip hoort niet in de release"; exit 1; } || true
      - name: Betaalde zip als artefact (3 dagen, niet openbaar als download)
        uses: actions/upload-artifact@v4
        with:
          name: click-joints-pro-zip-${{ env.VERSIE }}
          path: /tmp/zip
          retention-days: 3
      - name: Release maken of bijwerken (alleen plaatjes en SHA256SUMS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum "/tmp/zip/click_joints_pro-$VERSIE.zip" | cut -d' ' -f1)
          cat > /tmp/notes.md <<EOF
          Click Joints Pro $VERSIE, betaalde versie voor Superhive (winkel Dortus).

          - De zip \`click_joints_pro-$VERSIE.zip\` staat hier bewust niet: dat is de betaalde build (alleen via Superhive). Hij komt uit e2e-run $RUN op main, getest in de echte Blender 4.2.23, 5.2.3 en 5.3.0. sha256 \`$sha\`.
          - Plaatjes in uploadvolgorde, elk 1920 x 1080 PNG onder 2 MB: \`1-figuur-uit-rig.png\`, \`2-poster-3.png\`, \`3-knie-met-boog.png\`, \`4-rood-voorbij-de-stop.png\`, \`5-kogel-passing.png\`, \`6-kogel-rood.png\`.
          - \`SHA256SUMS.txt\`: sha256 van alles.

          Tekst, prijs en stappen: \`platformen/blender/superhive-pagina.md\`.
          EOF
          sed -i 's/^          //' /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/uit/* --clobber
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" /tmp/uit/* --target "$GITHUB_SHA" --title "Click Joints Pro $VERSIE" --notes-file /tmp/notes.md
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | .name + " " + (.size|tostring))'
