name: Click Joints uitgave (release met zip en winkelplaatjes)

# Zet de gekeurde gratis zip en de winkelplaatjes als release-assets op één plek,
# zodat het indienen op extensions.blender.org alleen downloaden en uploaden is.
# Controleert eerst de sha256 van de zip (gelijk aan platformen/blender/indienen.md)
# en laat de echte Blender de zip valideren, zoals extensions.blender.org dat doet.
# Uitbrengen met één knop (18 nov 2026, Bram, afgekeken bij CAD Sketcher):
# de notes komen uit producten/blender-gewrichten/CHANGELOG.md (sectie van VERSIE, max 1024 tekens).
# Een tag click-joints-v* pushen, of handmatig starten met "uploaden" aan, stuurt de zip met het
# token (secret BLENDER_EXTENSIONS_TOKEN, maakt Thijs) naar extensions.blender.org. Een moderator keurt nog.
# Elke andere run is een proefdraai: alles behalve de echte upload, plus een test zonder token (verwacht 401).
on:
  push:
    branches: [main]
    paths: [".github/workflows/click-joints-uitgave.yml", "producten/blender-gewrichten/CHANGELOG.md"]
    tags: ["click-joints-v*"]
  workflow_dispatch:
    inputs:
      uploaden:
        description: "Echt uploaden naar extensions.blender.org (alleen een nieuwe versie)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # 0.1.1 (16 nov 2026, Bram): kniefout, Akkoord ja Daan 04:30 UTC; zip gebouwd met e2e/maak_zip.sh op main 3ec22b7,
  # e2e-run 43804760150 op die commit groen in 4.2.23, 5.2.3 en 5.3.0. Plaatjes op de site blijven gelijk.
  # 0.1.2 (26 nov 2026, Olaf, issue 115): meldknop, reviewregel, voetfix, tag Sculpt; geen regel naar Pro (regel 6.1/6.3).
  # Akkoord ja Daan in #127; e2e-run 45728117479 op e6c73f4 groen in 4.2.23, 5.2.3 en 5.3.0.
  VERSIE: "0.1.2"
  TAG: click-joints-v0.1.2
  ZIP: producten/blender-gewrichten/uitgave/click_joints-0.1.2.zip
  SHA: f1c77eb8dccc55d7d1908e17629cb9eecec213ad01787c8ce6abf5d6a13ffd12
  EXTENSIE: click_joints
  CHANGELOG: producten/blender-gewrichten/CHANGELOG.md

jobs:
  uitgave:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tag en tak nakijken (vóór er iets gebeurt)
        env:
          HANDMATIG_ECHT: ${{ inputs.uploaden == true }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "FOUT: tag $GITHUB_REF_NAME hoort bij een andere versie dan TAG=$TAG in deze workflow"; exit 1
          fi
          if [ "$HANDMATIG_ECHT" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "FOUT: echt uploaden alleen vanaf main"; exit 1
          fi
      - name: sha256 van de zip controleren
        run: |
          echo "$SHA  $ZIP" | sha256sum -c -
          unzip -l "$ZIP"
          if unzip -l "$ZIP" | grep -q 'betaald/'; then echo "FOUT: betaalde code in de gratis zip"; exit 1; fi
          if unzip -l "$ZIP" | grep -q 'direct.py'; then echo "FOUT: dit is de direct-zip (Pro op slot), die mag niet naar extensions.blender.org"; exit 1; fi
      - name: Blender 4.2.23 ophalen
        run: |
          # download.blender.org geeft vanuit Actions soms 403 (16 nov); dan een spiegel, zoals in de e2e.
          B="release/Blender4.2/blender-4.2.23-linux-x64.tar.xz"
          for u in "https://download.blender.org/$B" "https://ftp.nluug.nl/pub/graphics/blender/$B" "https://mirrors.ocf.berkeley.edu/blender/$B"; do
            curl -fsSL --retry 3 --retry-delay 10 -o /tmp/blender.tar.xz "$u" && break
            echo "niet gelukt: $u"; rm -f /tmp/blender.tar.xz
          done
          [ -s /tmp/blender.tar.xz ] || { echo "FOUT: Blender niet te downloaden"; exit 1; }
          mkdir -p /tmp/blender && tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | head -1
      - name: Zip valideren in de echte Blender
        run: /tmp/blender/blender --command extension validate "$ZIP"
      - name: Versie in de zip nakijken
        run: |
          unzip -p "$ZIP" blender_manifest.toml | grep -qx "version = \"$VERSIE\"" || { echo "FOUT: versie"; exit 1; }
      - name: Notes uit CHANGELOG.md halen
        run: |
          awk -v v="$VERSIE" '$0 ~ "^## "v" " {aan=1; next} /^## / {aan=0} aan' "$CHANGELOG" \
            | sed -e '/./,$!d' > /tmp/winkel.md
          [ -s /tmp/winkel.md ] || { echo "FOUT: geen sectie '## $VERSIE' in $CHANGELOG"; exit 1; }
          python3 - <<'PY'
          t = open("/tmp/winkel.md").read().strip()
          if len(t) > 1024:
              k = t.rfind("\n", 0, 1021)
              t = t[:k if k > 0 else 1020] + "\n..."
          open("/tmp/winkel.md", "w").write(t + "\n")
          print(f"notes: {len(t)} tekens (max 1024)")
          PY
          cat /tmp/winkel.md
      - name: Bestanden voor de release klaarzetten
        run: |
          mkdir -p /tmp/uit
          cp "$ZIP" "/tmp/uit/click_joints-$VERSIE.zip"
          (cd /tmp/uit && sha256sum * | tee SHA256SUMS.txt)
      - name: Release maken of bijwerken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Click Joints $VERSIE, free version for extensions.blender.org."; echo
            cat /tmp/winkel.md; echo
            echo "\`click_joints-$VERSIE.zip\` is validated with \`blender --command extension validate\`. Icon and images: release click-joints-v0.1.0."
          } > /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/uit/* --clobber
          else
            gh release create "$TAG" /tmp/uit/* --target "$GITHUB_SHA" --title "Click Joints $VERSIE" --notes-file /tmp/notes.md
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | .name + " " + (.size|tostring))'
      - name: Uploaden naar extensions.blender.org (of proefdraaien)
        env:
          TOKEN: ${{ secrets.BLENDER_EXTENSIONS_TOKEN }}
          ECHT: ${{ startsWith(github.ref, 'refs/tags/click-joints-v') || inputs.uploaden == true }}
        run: |
          URL="https://extensions.blender.org/api/v1/extensions/$EXTENSIE/versions/upload/"
          if [ "$ECHT" != "true" ]; then
            echo "PROEFDRAAI: geen upload. Test zonder token, verwacht 401 (API bereikbaar, sleutel ontbreekt; een fout id geeft ook 401)."
            code=$(curl -sS -o /tmp/antwoord.txt -w '%{http_code}' -X POST "$URL")
            echo "HTTP $code"; head -c 300 /tmp/antwoord.txt; echo
            [ "$code" = "401" ] || { echo "FOUT: verwacht 401, adres of API veranderd?"; exit 1; }
            [ -n "$TOKEN" ] && echo "Token staat klaar als secret." || echo "Nog geen secret BLENDER_EXTENSIONS_TOKEN (maakt Thijs)."
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "FOUT: tag $GITHUB_REF_NAME hoort bij een andere versie dan TAG=$TAG in deze workflow"; exit 1
          fi
          [ -n "$TOKEN" ] || { echo "FOUT: secret BLENDER_EXTENSIONS_TOKEN ontbreekt (Thijs maakt hem op extensions.blender.org/settings/tokens/)"; exit 1; }
          code=$(curl -sS -o /tmp/antwoord.txt -w '%{http_code}' -X POST "$URL" \
            -H "Authorization:bearer $TOKEN" \
            -F "version_file=@/tmp/uit/click_joints-$VERSIE.zip" \
            --form-string "release_notes=$(cat /tmp/winkel.md)")
          echo "HTTP $code"; cat /tmp/antwoord.txt; echo
          case "$code" in 2??) echo "Geüpload: $VERSIE wacht nu op de moderator.";; *) echo "FOUT bij uploaden"; exit 1;; esac
