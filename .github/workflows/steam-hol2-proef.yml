name: Hol 2.0 proef (tak hol2-proef, Windows)

# Olaf, 28 nov 2026 (issue #388; #401 voegt de stap besturen en focus toe). Alleen voor de proeftak: toetsen, een echte .exe voor Thijs (artifact), de .exe
# starten op 120 en 240 px met Kladblok erachter, en CPU van de .exe: Hol 2.0 op 120 tegen het hol van nu op 96
# (zelfde .exe, scène-argument res://main.tscn), om en om, met een placebo (twee keer het hol van nu).
# Uitslag op tak schermen, map steam-hol2-proef/.
on:
  push:
    branches: [hol2-proef]
    paths: ["producten/steam-hol/**", ".github/workflows/steam-hol2-proef.yml"]
  workflow_dispatch:

concurrency:
  group: steam-hol2-proef-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  proef:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3 en de Windows-sjablonen downloaden
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -OutFile sjablonen.zip
          $doel = Join-Path $env:APPDATA "Godot/export_templates/4.3.stable"
          New-Item -ItemType Directory -Force $doel | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path sjablonen.zip).Path)
          foreach ($e in $zip.Entries) {
            if ($e.FullName -match '^templates/(windows_.*|version\.txt)$') {
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($e, (Join-Path $doel $e.Name), $true)
            }
          }
          $zip.Dispose()
          $rc = Join-Path $env:RUNNER_TEMP "rcedit"; New-Item -ItemType Directory -Force $rc | Out-Null
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile (Join-Path $rc "rcedit.exe")
          Add-Content $env:GITHUB_PATH $rc
      - name: Importeren
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64_console.exe" -ArgumentList "--headless --path producten/steam-hol/godot --import" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force }
      - name: Toetsen (de 11 van main en toets_hol2, moeten 0 FOUT geven)
        shell: pwsh
        run: |
          $uit = "producten/steam-hol/e2e/screenshots/hol2"
          New-Item -ItemType Directory -Force $uit | Out-Null
          $fout = 0; $r = @()
          foreach ($t in @("toets_systemen", "toets_namen", "toets_held", "toets_vleermuis", "toets_berg_wand", "toets_klap", "toets_aanloop", "toets_licht", "toets_opslag", "toets_tekens", "toets_rand", "toets_hol2")) {
            $o = & "godot/Godot_v4.3-stable_win64_console.exe" --headless --path producten/steam-hol/godot -s "systemen/toetsen/$t.gd" 2>&1 | Out-String
            Write-Output $o
            if ($LASTEXITCODE -ne 0 -or $o -match "FOUT [^0]|SCRIPT ERROR|Parse Error") { $r += "$t ROOD"; $fout++ } else { $r += "$t groen" }
          }
          $r += "toetsen: $fout ROOD"
          $r | Set-Content "$uit/toetsen.txt"; $r | ForEach-Object { Write-Output $_ }
          if ($fout -gt 0) { exit 1 }
      - name: Bouwen (.exe van de proef)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force producten/steam-hol/bouw-hol2 | Out-Null
          $o = & "godot/Godot_v4.3-stable_win64_console.exe" --headless --path producten/steam-hol/godot --export-release "Windows" "../bouw-hol2/HetHol.exe" 2>&1 | Out-String
          Write-Output $o
          if (-not (Test-Path "producten/steam-hol/bouw-hol2/HetHol.exe")) { Write-Output "FOUT: geen exe"; exit 1 }
          Copy-Item producten/steam-hol/bewijs-hol2-proef/LEES-MIJ-EERST.txt producten/steam-hol/bouw-hol2/
          "Hol 2.0 proef, commit $env:GITHUB_SHA, run $env:GITHUB_RUN_ID" | Set-Content producten/steam-hol/bouw-hol2/VERSIE.txt
          Get-ChildItem producten/steam-hol/bouw-hol2 -File | ForEach-Object { Write-Output "$($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }
      - name: De .exe bewaren (artifact, 14 dagen)
        uses: actions/upload-artifact@v4
        with:
          name: hol2-proef-windows
          path: producten/steam-hol/bouw-hol2/
          retention-days: 14
      - name: De .exe starten op 120 en 240 px, met Kladblok erachter
        shell: pwsh
        run: |
          $uit = (Resolve-Path "producten/steam-hol/e2e/screenshots/hol2").Path -replace '\\','/'
          $exe = (Resolve-Path "producten/steam-hol/bouw-hol2/HetHol.exe").Path
          $glog = Join-Path $env:APPDATA "Dortus/Het Hol/logs/godot.log"
          Start-Process notepad.exe; Start-Sleep 3
          $fout = 0; $r = @()
          foreach ($h in @(120, 240)) {
            Remove-Item $glog -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList "-- hoogte=$h film=1 zaad=7 duur=40 log=$uit/hol2-$h.log" -PassThru
            Start-Sleep 30
            $null = & producten/steam-hol/e2e/scherm.ps1 "$uit/hol2-$h.png"
            if (-not $p.WaitForExit(40000)) { Stop-Process -Id $p.Id -Force; $r += "FOUT: $h stopte niet zelf"; $fout++ }
            $g = Get-Content $glog -ErrorAction SilentlyContinue | Out-String
            Copy-Item $glog "$uit/godot-$h.log" -ErrorAction SilentlyContinue
            if ($g -match "SCRIPT ERROR|Parse Error") { $r += "FOUT: SCRIPT ERROR op $h"; $fout++ }
            $l = Get-Content "$uit/hol2-$h.log" -ErrorAction SilentlyContinue | Out-String
            if ($l -notmatch "HOL2 einde") { $r += "FOUT: geen HOL2 einde op $h"; $fout++ }
            if ($l -notmatch "gloop loopt naar") { $r += "FOUT: Gloop liep niet na de klik op $h"; $fout++ }
            $r += "hoogte $h : " + (($l -split "`n" | Select-String "HOL2 start").Line)
          }
          $r += "starten: $fout FOUT"
          $r | Set-Content "$uit/starten.txt"; $r | ForEach-Object { Write-Output $_ }
          if ($fout -gt 0) { exit 1 }
      - name: Besturen krijgt echte toetsen en de focus gaat terug naar Kladblok (#401, Daan #394 moet 2 en 3)
        shell: pwsh
        run: |
          $uit = (Resolve-Path "producten/steam-hol/e2e/screenshots/hol2").Path -replace '\\','/'
          $exe = (Resolve-Path "producten/steam-hol/bouw-hol2/HetHol.exe").Path
          & producten/steam-hol/e2e/hol2_focus.ps1 $exe $uit
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: CPU van de .exe, om en om, met placebo (alleen ter info naast de Linux-meting)
        shell: pwsh
        run: |
          $uit = (Resolve-Path "producten/steam-hol/e2e/screenshots/hol2").Path
          $exe = (Resolve-Path "producten/steam-hol/bouw-hol2/HetHol.exe").Path
          $standen = [ordered]@{ "nu96" = "res://main.tscn -- hoogte=96 vers=1 fps=12 balk=0 zaad=5"; "nu96b" = "res://main.tscn -- hoogte=96 vers=1 fps=12 balk=0 zaad=5"; "hol2_120" = "-- hoogte=120 fps=12 zaad=5" }
          $m = @{}; foreach ($k in $standen.Keys) { $m[$k] = @() }
          foreach ($ronde in 1..3) {
            foreach ($k in $standen.Keys) {
              $p = Start-Process -FilePath $exe -ArgumentList $standen[$k] -PassThru
              Start-Sleep 12
              $p.Refresh(); $c1 = $p.TotalProcessorTime.TotalSeconds; $t1 = Get-Date
              Start-Sleep 20
              $p.Refresh(); $c2 = $p.TotalProcessorTime.TotalSeconds; $dt = ((Get-Date) - $t1).TotalSeconds
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              $m[$k] += [math]::Round(($c2 - $c1) * 10 / $dt, 3)
              Write-Output "ronde $ronde $k $($m[$k][-1])"
            }
          }
          $r = @()
          foreach ($k in $standen.Keys) { $r += "$k : $($m[$k] -join ' / ') CPU-s per 10 s, gemiddeld $([math]::Round(($m[$k] | Measure-Object -Average).Average, 3))" }
          $r | Set-Content "$uit/cpu.txt"; $r | ForEach-Object { Write-Output $_ }
      - name: Uitslag openbaar zetten (tak schermen)
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          SRC="$GITHUB_WORKSPACE/producten/steam-hol/e2e/screenshots/hol2"
          [ -d "$SRC" ] || { echo "geen uitslag"; exit 0; }
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          T="$RUNNER_TEMP/s"
          for poging in 1 2 3 4 5; do
            rm -rf "$T"
            if git clone -q --depth 1 --filter=blob:none --sparse --branch schermen "$URL" "$T" 2>/dev/null; then
              git -C "$T" sparse-checkout set "steam-hol2-proef"
            else
              mkdir -p "$T" && cd "$T" && git init -q -b schermen && git remote add origin "$URL" && cd - >/dev/null
            fi
            D="$T/steam-hol2-proef"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd "$T" && git add -A && git commit -q -m "Hol 2.0 proef run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then cd - >/dev/null; break; fi
            cd - >/dev/null; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/steam-hol2-proef"
