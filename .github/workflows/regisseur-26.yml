name: "Regisseur 26 (sale-Shorts #75: echte schermopname in Blender met x11grab)"

# 25 nov 2026, Regisseur run 29, issue #75. Wens Thijs 25 nov 11:25: echt Blender-scherm alsof iemand het op zijn eigen
# pc opnam. Anders dan regisseur-14: ffmpeg x11grab neemt het hele scherm op (30 beelden per seconde, echte muispijl),
# de muis glijdt in een eigen proces, de Bend-schuif wordt echt versleept. Click Joints Pro 1.2.8 (wat kopers in de
# sale krijgen: de code van vóór de eerste 1.2.9-commit a3c1ea1). Stap 1 van deze workflow: alleen de ruwe opname en de
# controle op vloeiend; de montage met stem Max draait zodra de mp3's van de hoofdchat in de map staan. Niets geplaatst.
on:
  push:
    branches: [main]
    paths: ["commercie/filmpjes/regisseur-26/**", ".github/workflows/regisseur-26.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: regisseur-26
  PRO_COMMIT_VOOR: a3c1ea1   # eerste commit van 1.2.9; de zip komt van de commit ervoor (1.2.8)

jobs:
  opname:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Systeempakketten (apt-snel)
        uses: ./.github/actions/apt-snel
        with:
          pakketten: xvfb libgl1 libegl1 libgl1-mesa-dri libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 zip imagemagick xdotool ffmpeg fonts-inter tesseract-ocr x11-xserver-utils dmz-cursor-theme
      - name: Blender 5.3.0 en de Pro-zip 1.2.8
        run: |
          V="5.3.0"; KORT="5.3"
          B="release/Blender${KORT}/blender-${V}-linux-x64.tar.xz"
          for u in "https://download.blender.org/$B" "https://ftp.nluug.nl/pub/graphics/blender/$B" "https://mirrors.ocf.berkeley.edu/blender/$B"; do
            curl -fsSL --retry 3 --retry-delay 10 -o /tmp/blender.tar.xz "$u" && break
            echo "niet gelukt: $u"; rm -f /tmp/blender.tar.xz
          done
          [ -s /tmp/blender.tar.xz ] || { echo "FOUT: Blender $V niet te downloaden"; exit 1; }
          mkdir -p /tmp/blender && tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1 && rm /tmp/blender.tar.xz
          mkdir -p /tmp/v128 && git archive "${PRO_COMMIT_VOOR}~1" producten/blender-gewrichten | tar -x -C /tmp/v128
          (cd /tmp/v128/producten/blender-gewrichten && PRO_VERSIE=1.2.8 bash e2e/maak_zip.sh betaald)
          sha256sum /tmp/click_joints_betaald.zip
      - name: Opnemen (echt scherm 2160x1920, x11grab 30 fps)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          BLENDER_USER_RESOURCES: /tmp/cj_pro
          BLENDER_USER_CONFIG: /tmp/cj_pro/config
          BLENDER_USER_EXTENSIONS: /tmp/cj_pro/extensions
        run: |
          /tmp/blender/blender -b --python-expr "import bpy; bpy.context.preferences.view.show_splash=False; bpy.ops.wm.save_userpref(); bpy.ops.wm.save_as_mainfile(filepath='/tmp/start_s.blend')"
          mkdir -p /tmp/klaar
          timeout 2400 xvfb-run --auto-servernum --server-args="-screen 0 2160x1920x24 -noreset" \
            bash commercie/filmpjes/regisseur-26/neem_op.sh /tmp/blender/blender /tmp/start_s.blend /tmp/opn /tmp/click_joints_betaald.zip 2160x1920 2>&1 | tee /tmp/klaar/opname.log || true
          grep -E "KORT|Traceback|Error|opname klaar" /tmp/klaar/opname.log | cut -c1-400 || true
          [ -s /tmp/opn/scherm-ruw.ts ] || { echo "FOUT: geen opname"; exit 1; }
          cp /tmp/opn/film.json /tmp/opn/start.txt /tmp/opn/muis.txt /tmp/klaar/
          ffmpeg -v error -i /tmp/opn/scherm-ruw.ts -r 30 -c:v libx264 -preset veryfast -crf 17 -pix_fmt yuv420p /tmp/klaar/scherm.mkv
          ls -la /tmp/klaar
      - name: Controle vloeiend
        run: |
          python3 commercie/filmpjes/regisseur-26/vloeiend.py /tmp/opn/scherm-ruw.ts | tee /tmp/klaar/vloeiend.txt || true
          d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/klaar/scherm.mkv)
          for s in 0.1 0.3 0.5 0.7 0.9; do
            t=$(python3 -c "print(round($d*$s,2))")
            ffmpeg -v error -ss $t -i /tmp/klaar/scherm.mkv -frames:v 1 -vf scale=1080:-1 /tmp/klaar/blik-$s.jpg
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Montage met stem Max (alleen als de mp3 van de hoofdchat er is; nooit Kokoro voor keuring)
        run: |
          python -m pip install -q soundfile faster-whisper==1.2.1 numpy pillow
          cp /tmp/opn/muis.txt /tmp/opn/start.txt /tmp/opn/film.json /tmp/klaar/ 2>/dev/null || true
          mkdir -p /tmp/mont && cp /tmp/klaar/scherm.mkv /tmp/opn/film.json /tmp/opn/start.txt /tmp/opn/muis.txt /tmp/mont/
          for n in sale-een-knop sale-eindstop; do
            mp3=commercie/filmpjes/regisseur-26/$n-elevenlabs.mp3
            [ -f "$mp3" ] || { echo "nog geen $mp3: montage $n overgeslagen"; continue; }
            STEM_MP3=$PWD/$mp3 STEM_BRON=elevenlabs python commercie/filmpjes/regisseur-26/montage3.py commercie/filmpjes/regisseur-26/$n.json /tmp/mont /tmp/klaar
            rm -rf /tmp/klaar/zinnen
            mkdir -p /tmp/klaar/meting-$n
            WHISPER_MODEL=small.en python commercie/filmpjes/regisseur-26/synchroon3.py /tmp/klaar/$n-geluid.mp4 /tmp/klaar/$n-script.json /tmp/klaar/meting-$n || true
            python3 commercie/filmpjes/regisseur-26/vloeiend.py /tmp/klaar/$n-geluid.mp4 | tee /tmp/klaar/vloeiend-$n.txt || true
            ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/klaar/$n-geluid.mp4 | tee -a /tmp/klaar/lengtes.txt
          done
          ls /tmp/klaar/*-geluid.mp4 >/dev/null 2>&1 && python organisatie/controle/geluid_check.py /tmp/klaar/*-geluid.mp4 | tee /tmp/klaar/geluid_check.txt || true
      - name: In de release zetten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d /tmp/klaar ] || exit 1
          echo "Regisseur 26 (issue #75): echte schermopname van Blender 5.3.0 met Click Joints Pro 1.2.8 en de eigen robot (ffmpeg x11grab, 30 beelden per seconde, echte muis). Werkmateriaal voor twee sale-Shorts. Niets geplaatst." > /tmp/notes.md
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Regisseur 26 (sale-Shorts, echte schermopname)" --notes-file /tmp/notes.md
          gh release upload "$TAG" /tmp/klaar/* --clobber -R "$GITHUB_REPOSITORY"
