name: Pro galerij strip v3 (kogel en scharnier)

# 26 nov 2026, Beeldmaker (issue #205): galerijbeeld "Find the fit for your printer" met beide proefsets uit de echte
# add-on (Pro 1.2.8): Fit test: ball en Fit test: hinge. De rechters van de blinde test zeiden bij strip v2 elke ronde
# "lijkt alleen voor kogels". Drie camera-varianten in één run; alleen kale renders en json gaan naar release
# pro-galerij-strip-3 (v3) en pro-galerij-strip-4 (strakke goudrand, 26 nov ±20:45). De tekst komt er in de repo op (ontwerp/pro-galerij/bron/tekst.py). Niets geplaatst, niets kost geld.
on:
  push:
    branches: [main]
    paths: [".github/workflows/pro-galerij-strip3.yml"]
  workflow_dispatch:
    inputs:
      samples:
        description: "Samples per render (standaard 48)"
        default: "48"

permissions:
  contents: write

env:
  TAG: pro-galerij-strip-4

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Blender 5.3.0 en de Pro-zip
        run: |
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 >/dev/null || true
          B="release/Blender5.3/blender-5.3.0-linux-x64.tar.xz"
          for u in "https://download.blender.org/$B" "https://ftp.nluug.nl/pub/graphics/blender/$B" "https://mirrors.ocf.berkeley.edu/blender/$B"; do
            curl -fsSL --retry 3 --retry-delay 10 -o /tmp/blender.tar.xz "$u" && break; rm -f /tmp/blender.tar.xz
          done
          [ -s /tmp/blender.tar.xz ] || { echo "FOUT: Blender niet te downloaden"; exit 1; }
          mkdir -p /tmp/blender && tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1 && rm /tmp/blender.tar.xz
          (cd producten/blender-gewrichten && PRO_VERSIE=1.2.8 bash e2e/maak_zip.sh betaald)
          sha256sum /tmp/click_joints_betaald.zip
      - name: Drie varianten renderen
        env:
          SAMPLES: ${{ github.event.inputs.samples || '48' }}
          BLENDER_USER_RESOURCES: /tmp/cj
          BLENDER_USER_CONFIG: /tmp/cj/config
          BLENDER_USER_EXTENSIONS: /tmp/cj/extensions
        run: |
          mkdir -p /tmp/uit
          case "$SAMPLES" in ''|*[!0-9]*) SAMPLES=48 ;; esac
          r() {  # naam, dan env-paren
            naam=$1; shift
            rm -rf /tmp/cj
            env GB_MODUS=strip GB_SOORT=KOGEL GB_SOORT2=SCHARNIER GB_GOUDZONE=12 HB_LICHT=2.6 GB_NAAM="$naam" "$@" \
              timeout 1500 /tmp/blender/blender -b --factory-startup --python ontwerp/pro-galerij/bron/galerij.py -- /tmp/click_joints_betaald.zip /tmp/uit "$SAMPLES" 100 2>&1 \
              | tee /tmp/uit/$naam.log | grep -E "\[|Traceback|Error" | cut -c1-300
            [ -s /tmp/uit/render-$naam.png ] && echo "OK $naam" || echo "GEEN RENDER $naam"
          }
          # strip v4 (Daan #215 kan-punt): zelfde camera als v3 'naast', alleen een strakke goudrand op de kogelstaven
          r naast GB_STRAKKE_RAND=1 GB_NAAST=40 GB_TIL=10 GB_KANTEL_TOP=-35 GB_ZIJ=-0.45 GB_OP=0.42 GB_AFSTAND=820 GB_SHIFT=-0.17
          ls -la /tmp/uit
          ls /tmp/uit/render-*.png >/dev/null 2>&1 || { echo "FOUT: geen enkele render"; exit 1; }
      - name: In release pro-galerij-strip-3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "Renders voor galerijbeeld strip v3 van Click Joints Pro, 26 nov 2026, Beeldmaker Dortus (issue #205)." "Blender 5.3.0, Cycles, in deze workflow. Geen AI-beeld, geen foto van een echte print." "Beide sets maakte de echte knoppen Fit test: ball en Fit test: hinge van Click Joints Pro (zip van commit $GITHUB_SHA); kleur, plaats en camera zijn van ons. Werkmateriaal, niets geplaatst." > /tmp/notes.md
          F=$(ls /tmp/uit/render-*.png /tmp/uit/*.json /tmp/uit/*.log)
          for i in 1 2 3; do
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" $F --clobber -R "$GITHUB_REPOSITORY" && break
            else
              gh release create "$TAG" $F -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Pro galerij strip 4" --notes-file /tmp/notes.md && break
            fi
            sleep 20
          done
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | .name + " " + (.size|tostring))'
