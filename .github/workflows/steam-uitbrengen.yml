name: Het Hol naar Steam (met de hand of met een tag, niet-openbare tak)

# Olaf, 18 nov 2026 (opdracht hoofdchat 20:20 NL, afgekeken bij Material Maker, platformen/ideeen/afkijken-2026-11-18/D-steam-indie.md punt 1).
# Bouwt het volle spel en de demo zoals steam-hol-exe.yml en zet ze met game-ci/steam-deploy op een NIET-openbare Steam-tak.
# Thijs zet een build daarna zelf live in Steamworks.
#
# Twee manieren om te starten (opdracht hoofdchat 18 nov 21:25 NL, de ploeg kan "Run workflow" niet, zie organisatie/toegang.md):
#   1. tag pushen:  hats-steam-v0.2.0        echte upload naar tak "intern" (de tag geldt als bevestiging)
#                   hats-steam-v0.2.0-proef1 proefdraai: alle controles, geen upload (om te testen)
#      of, omdat een tag pushen vanuit onze sessies 403 geeft, dezelfde naam als tak: uitgave/hats-steam-v0.2.0
#      (git push origin HEAD:refs/heads/uitgave/hats-steam-v0.2.0). Werkt precies hetzelfde.
#   2. met de hand (workflow_dispatch), proefdraaien staat standaard aan.
# Controles in job "toetsen", vóór er iets gebouwd of geüpload wordt (bij een tag en bij een echte upload stopt elke fout de run):
#   a. geldige tag (alleen bij een tag), versie = application/product_version in export_presets.cfg (beide presets)
#   b. nieuwe versie: hoger dan elke eerdere echte tag hats-steam-v*
#   c. tests groen: een geslaagde run van steam-hol.yml op main met precies dezelfde spelcode (map producten/steam-hol)
#   d. akkoord Daan: regel "| <versie> | ja | <keuringsbestand> |" in platformen/steam/uitgaven.md, en dat bestand bestaat
#      (bij een proeftag alleen een waarschuwing; bij handmatig proefdraaien zijn alle controles waarschuwingen)
#
# Proefdraaien: alles behalve de upload. Maakt de depotmappen, toetst ze en schrijft de app-build-bestanden
# die steamcmd zou krijgen naar de samenvatting (scripts in platformen/steam/upload/, ook bruikbaar met upload.sh vanaf een eigen pc). Geen sleutel nodig, niets gaat naar Steam.
#
# Echt uploaden kan pas als Thijs één keer heeft gezet (zie berichten/hoofdchat.md, 18 nov, en organisatie/toegang.md):
#   variabelen (Settings, Variables):  STEAM_APPID, STEAM_DEMO_APPID   (appids zijn openbaar, daarom geen geheim)
#   geheimen  (Settings, Secrets):     STEAM_USERNAME, STEAM_CONFIG_VDF (apart bouwaccount met alleen uploadrechten)
# Ontbreekt er iets, dan stopt de echte upload met een duidelijke melding.
on:
  push:
    tags: ["hats-steam-v*"]
    # een tag pushen geeft vanuit onze sessies 403 (GEZIEN 18 nov, Olaf); een tak pushen lukt wel. Daarom ook deze taknaam.
    branches: ["uitgave/hats-steam-v*"]
  workflow_dispatch:
    inputs:
      proefdraaien:
        description: "Proefdraaien: alles behalve de upload (laat aan tot de sleutels er zijn)"
        type: boolean
        default: true
      steamtak:
        description: "Steam-tak (beta) waar de build op komt. Nooit default of public; de tak moet in Steamworks bestaan."
        type: string
        default: "intern"
      welke:
        description: "Welke build"
        type: choice
        options: [beide, vol, demo]
        default: beide

permissions:
  contents: read
  actions: read

jobs:
  toetsen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proef: ${{ steps.c.outputs.proef }}
      tak: ${{ steps.c.outputs.tak }}
      welke: ${{ steps.c.outputs.welke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none   # tags en commits voor de controles, oude bestanden niet (repo is 1,2 GB)
      - name: Controles (tag, versie, tests groen, akkoord Daan)
        id: c
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IN_PROEF: ${{ inputs.proefdraaien }}
          IN_TAK: ${{ inputs.steamtak }}
          IN_WELKE: ${{ inputs.welke }}
        run: |
          S="$GITHUB_STEP_SUMMARY"; fout=0; waarsch=0
          naam="${GITHUB_REF_NAME#uitgave/}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$naam" != "$GITHUB_REF_NAME" ]; then
            bron="$GITHUB_REF_TYPE $GITHUB_REF_NAME"
            if [[ "$naam" =~ ^hats-steam-v([0-9]+)\.([0-9]+)\.([0-9]+)(-proef[a-z0-9]*)?$ ]]; then
              versie="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              if [ -n "${BASH_REMATCH[4]}" ]; then proef=true; else proef=false; fi
            else
              echo "::error::Geen geldige naam: '$GITHUB_REF_NAME'. Vorm: hats-steam-v1.2.3 (echt) of hats-steam-v1.2.3-proef1 (proefdraai), als tag of als tak uitgave/..."; exit 1
            fi
            tak=intern; welke=beide; streng=true
          else
            bron="handmatig"; proef="$IN_PROEF"; tak="$IN_TAK"; welke="$IN_WELKE"
            versie=""; [ "$proef" = "true" ] && streng=false || streng=true
          fi
          # een fout telt als echte fout als we streng zijn, anders als waarschuwing
          meld() { if [ "$1" = "hard" ]; then echo "::error::$2"; echo "- FOUT: $2" >> "$S"; fout=$((fout+1));
                   else echo "::warning::$2"; echo "- waarschuwing: $2" >> "$S"; waarsch=$((waarsch+1)); fi; }
          ernst=$([ "$streng" = "true" ] && echo hard || echo zacht)
          echo "## Controles vóór bouwen ($bron, $( [ "$proef" = "true" ] && echo proefdraai || echo ECHTE UPLOAD ))" >> "$S"

          # a. versie uit export_presets.cfg (beide presets gelijk)
          pv=$(grep -o 'application/product_version="[^"]*"' producten/steam-hol/godot/export_presets.cfg | cut -d'"' -f2 | sort -u || true)
          if [ "$(echo "$pv" | wc -l)" -ne 1 ]; then meld hard "product_version verschilt tussen de presets: $(echo $pv)"; fi
          pv3=$(echo "$pv" | head -1 | cut -d. -f1-3)
          [ -n "$versie" ] || versie="$pv3"
          if [ "$versie" != "$pv3" ]; then meld hard "tag zegt $versie, export_presets.cfg zegt $pv3 (zet product_version en file_version op $versie.0)"; fi
          echo "- versie: $versie (export_presets.cfg $pv)" >> "$S"

          # b. nieuwe versie: hoger dan elke eerdere echte tag
          hoogste=$(git for-each-ref --format='%(refname)' refs/tags/ refs/remotes/origin/uitgave/ | sed -E 's#^refs/(tags|remotes/origin/uitgave)/##' | grep -E '^hats-steam-v' | grep -Ev -- '-proef' | grep -vx "$naam" | sed 's/^hats-steam-v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$hoogste" ]; then
            top=$(printf '%s\n%s\n' "$hoogste" "$versie" | sort -V | tail -1)
            if [ "$hoogste" = "$versie" ] || [ "$top" != "$versie" ]; then
              meld "$ernst" "versie $versie is niet nieuw: er is al een echte uitgave hats-steam-v$hoogste (tag of tak uitgave/)"
            fi
          fi
          echo "- hoogste eerdere echte uitgave: ${hoogste:-geen}" >> "$S"

          # c. tests groen: geslaagde steam-hol.yml-run op main met dezelfde spelcode
          boom=$(git rev-parse "$GITHUB_SHA:producten/steam-hol")
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/steam-hol.yml/runs?branch=main&status=success&per_page=50" \
            -o runs.json || { meld hard "runs van steam-hol.yml niet op te vragen"; echo '{"workflow_runs":[]}' > runs.json; }
          groen=""
          for r in $(jq -r '.workflow_runs[] | "\(.head_sha),\(.id)"' runs.json); do
            sha=${r%,*}; id=${r#*,}
            git cat-file -e "$sha^{commit}" 2>/dev/null || continue
            if [ "$(git rev-parse "$sha:producten/steam-hol" 2>/dev/null)" = "$boom" ]; then groen="$id op ${sha:0:7}"; break; fi
          done
          if [ -n "$groen" ]; then echo "- tests groen: steam-hol.yml run $groen (zelfde spelcode, boom ${boom:0:7})" >> "$S"
          else meld "$ernst" "geen geslaagde steam-hol.yml-run op main met deze spelcode (boom ${boom:0:7}); eerst de tests groen op main"; fi

          # d. akkoord Daan
          rij=$(grep -E "^\| *$versie *\|" platformen/steam/uitgaven.md 2>/dev/null | head -1 || true)
          keuring=$(echo "$rij" | awk -F'|' '{gsub(/[ `]/,"",$4); print $4}')
          oordeel=$(echo "$rij" | awk -F'|' '{gsub(/ /,"",$3); print tolower($3)}')
          if [ "$oordeel" = "ja" ] && [ -n "$keuring" ] && [ -f "$keuring" ]; then echo "- akkoord Daan: ja ($keuring)" >> "$S"
          else
            d_ernst="$ernst"; [ "$proef" = "true" ] && d_ernst=zacht
            meld "$d_ernst" "geen akkoord van Daan voor $versie in platformen/steam/uitgaven.md (regel '| $versie | ja | <keuringsbestand> |', bestand moet bestaan)"
          fi

          echo "proef=$proef" >> "$GITHUB_OUTPUT"; echo "tak=$tak" >> "$GITHUB_OUTPUT"; echo "welke=$welke" >> "$GITHUB_OUTPUT"
          echo "uitslag controles: $fout FOUT, $waarsch waarschuwing(en); tak $tak, build $welke" | tee -a "$S"
          [ "$fout" -eq 0 ] || exit 1

  bouwen:
    needs: toetsen
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Tak toetsen (nooit de openbare tak)
        shell: bash
        env:
          TAK: ${{ needs.toetsen.outputs.tak }}
        run: |
          t=$(echo "$TAK" | tr 'A-Z' 'a-z' | xargs)
          if [ -z "$t" ] || [ "$t" = "default" ] || [ "$t" = "public" ]; then
            echo "::error::Steam-tak '$TAK' mag niet: een build gaat alleen naar een niet-openbare tak. Live zetten doet Thijs in Steamworks."; exit 1
          fi
          if ! echo "$t" | grep -Eq '^[a-z0-9_-]{1,32}$'; then
            echo "::error::Steam-tak '$TAK': alleen kleine letters, cijfers, - en _ (max 32)."; exit 1
          fi
          echo "Steam-tak: $t"
      - uses: actions/checkout@v4
      - name: Godot 4.3 en de Windows-sjablonen downloaden
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -OutFile sjablonen.zip
          $doel = Join-Path $env:APPDATA "Godot/export_templates/4.3.stable"
          New-Item -ItemType Directory -Force $doel | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path sjablonen.zip).Path)
          foreach ($e in $zip.Entries) {
            if ($e.FullName -match '^templates/(windows_.*|version\.txt)$') {
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($e, (Join-Path $doel $e.Name), $true)
            }
          }
          $zip.Dispose()
          $rc = Join-Path $env:RUNNER_TEMP "rcedit"; New-Item -ItemType Directory -Force $rc | Out-Null
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile (Join-Path $rc "rcedit.exe")
          Add-Content $env:GITHUB_PATH $rc
      - name: Importeren
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64_console.exe" -ArgumentList "--headless --path producten/steam-hol/godot --import" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force }
      - name: Bouwen
        shell: pwsh
        env:
          WELKE: ${{ needs.toetsen.outputs.welke }}
          PROEF: ${{ needs.toetsen.outputs.proef }}
        run: |
          $lijst = @()
          if ($env:WELKE -ne "demo") { $lijst += ,@("Windows", "vol") }
          if ($env:WELKE -ne "vol") { $lijst += ,@("Windows demo", "demo") }
          $fout = 0
          foreach ($v in $lijst) {
            New-Item -ItemType Directory -Force "producten/steam-hol/steam/$($v[1])" | Out-Null
            $uit = & "godot/Godot_v4.3-stable_win64_console.exe" --headless --path producten/steam-hol/godot --export-release $v[0] "../steam/$($v[1])/HetHol.exe" 2>&1 | Out-String
            Write-Output "===== $($v[0])"; Write-Output $uit
            if (-not (Test-Path "producten/steam-hol/steam/$($v[1])/HetHol.exe")) { Write-Output "FOUT: geen exe voor $($v[0])"; $fout++ }
            if ($uit -match "Resources Modification|completed with warnings") { Write-Output "FOUT: icoon of versie niet gezet voor $($v[0])"; $fout++ }
          }
          $soort = if ($env:PROEF -eq "true") { "PROEFDRAAI (niet uploaden)" } else { "echte uitgave" }
          "Gebouwd uit commit $env:GITHUB_SHA, run $env:GITHUB_RUN_ID, $(Get-Date -AsUTC -Format 'yyyy-MM-dd HH:mm') UTC, $soort" | Set-Content "producten/steam-hol/steam/VERSIE.txt"
          if ($fout -gt 0) { exit 1 }
      - name: Korte rooktoets (start de volle exe 20 s, geen SCRIPT ERROR)
        if: needs.toetsen.outputs.welke != 'demo'
        shell: pwsh
        run: |
          $glog = Join-Path $env:APPDATA "Dortus/Het Hol/logs/godot.log"
          Remove-Item $glog -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "producten/steam-hol/steam/vol/HetHol.exe" -PassThru
          Start-Sleep 20
          $leeft = -not $p.HasExited
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          $log = if (Test-Path $glog) { Get-Content $glog -Raw } else { "" }
          Write-Output "draaide na 20 s nog: $leeft; godot.log $($log.Length) tekens"
          if (-not $leeft) { Write-Output "FOUT: de exe stopte binnen 20 s"; exit 1 }
          if ($log -match "SCRIPT ERROR") { Write-Output $log; Write-Output "FOUT: SCRIPT ERROR in godot.log"; exit 1 }
          # de log is van deze run en mag niet in de depot terechtkomen
          Get-ChildItem -Recurse producten/steam-hol/steam -Include *.log | Remove-Item -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: steam-depots
          path: producten/steam-hol/steam/
          retention-days: 7

  uploaden:
    needs: [toetsen, bouwen]
    runs-on: ubuntu-latest
    # alleen de uploads na elkaar (een tweede wachtende run vervangt de eerste wachtende; bouwen en toetsen lopen vrij)
    concurrency:
      group: steam-uitbrengen
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: platformen/steam/upload
          path: repo
      - uses: actions/download-artifact@v4
        with:
          name: steam-depots
          path: steam
      - name: Depots toetsen en app-build-bestanden schrijven (zelfde scripts als upload.sh)
        shell: bash
        env:
          TAK: ${{ needs.toetsen.outputs.tak }}
          WELKE: ${{ needs.toetsen.outputs.welke }}
          PROEF: ${{ needs.toetsen.outputs.proef }}
          APPID: ${{ vars.STEAM_APPID }}
          DEMO_APPID: ${{ vars.STEAM_DEMO_APPID }}
        run: |
          fout=0
          S="$GITHUB_STEP_SUMMARY"
          U=repo/platformen/steam/upload
          echo "## Het Hol naar Steam: $( [ "$PROEF" = "true" ] && echo PROEFDRAAIEN || echo ECHTE UPLOAD )" >> "$S"
          echo "Commit \`$GITHUB_SHA\`, Steam-tak \`$TAK\`, build: $WELKE" >> "$S"
          for d in vol demo; do
            [ "$WELKE" = "beide" ] || [ "$WELKE" = "$d" ] || continue
            id=$([ "$d" = "vol" ] && echo "$APPID" || echo "$DEMO_APPID")
            # bij proefdraaien zonder appid een nepnummer, zodat het bestand toch te zien is
            [[ "$id" =~ ^[0-9]+$ ]] || id=$([ "$d" = "vol" ] && echo 1000 || echo 2000)
            echo "### $d" >> "$S"; echo '```' >> "$S"
            bash $U/controleer-exportmap.sh "steam/$d" "$d" > uit.txt 2>&1 || fout=$((fout+1))
            bash $U/maak-appbuild.sh "$id" "steam/$d" "$TAK" "Het Hol $d ${GITHUB_SHA:0:7} run $GITHUB_RUN_ID" "app_build_$d.vdf" >> uit.txt 2>&1 || fout=$((fout+1))
            cat uit.txt; cat uit.txt >> "$S"; [ -f "app_build_$d.vdf" ] && cat "app_build_$d.vdf" >> "$S"
            echo '```' >> "$S"
          done
          echo "uitslag: $fout FOUT" | tee -a "$S"
          [ "$fout" -eq 0 ] || exit 1
      - name: Sleutels aanwezig? (alleen bij een echte upload)
        if: needs.toetsen.outputs.proef == 'false'
        shell: bash
        env:
          GEBRUIKER: ${{ secrets.STEAM_USERNAME }}
          VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          APPID: ${{ vars.STEAM_APPID }}
          DEMO_APPID: ${{ vars.STEAM_DEMO_APPID }}
          WELKE: ${{ needs.toetsen.outputs.welke }}
        run: |
          mis=""
          [ -n "$GEBRUIKER" ] || mis="$mis STEAM_USERNAME(geheim)"
          [ -n "$VDF" ] || mis="$mis STEAM_CONFIG_VDF(geheim)"
          if [ "$WELKE" != "demo" ]; then [[ "$APPID" =~ ^[0-9]+$ ]] || mis="$mis STEAM_APPID(variabele)"; fi
          if [ "$WELKE" != "vol" ]; then [[ "$DEMO_APPID" =~ ^[0-9]+$ ]] || mis="$mis STEAM_DEMO_APPID(variabele)"; fi
          if [ -n "$mis" ]; then echo "::error::Echte upload kan niet, dit ontbreekt:$mis. Draai met proefdraaien aan, of laat Thijs het zetten (berichten/hoofdchat.md)."; exit 1; fi
          echo "sleutels en appids aanwezig"
      - name: Volle spel naar Steam
        if: needs.toetsen.outputs.proef == 'false' && needs.toetsen.outputs.welke != 'demo'
        uses: game-ci/steam-deploy@1c487ecde10efac6b6630e38978187c09497c427 # v3.3.0
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ vars.STEAM_APPID }}
          buildDescription: Het Hol vol ${{ github.sha }} run ${{ github.run_id }}
          rootPath: steam
          depot1Path: vol
          releaseBranch: ${{ needs.toetsen.outputs.tak }}
          cliVersion: v0.1.76
      - name: Demo naar Steam
        if: needs.toetsen.outputs.proef == 'false' && needs.toetsen.outputs.welke != 'vol'
        uses: game-ci/steam-deploy@1c487ecde10efac6b6630e38978187c09497c427 # v3.3.0
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ vars.STEAM_DEMO_APPID }}
          buildDescription: Het Hol demo ${{ github.sha }} run ${{ github.run_id }}
          rootPath: steam
          depot1Path: demo
          releaseBranch: ${{ needs.toetsen.outputs.tak }}
          cliVersion: v0.1.76
