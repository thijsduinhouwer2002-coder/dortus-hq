name: Loket-meldingen (nieuwe issues naar berichten/hoofdchat.md)

# Roestronde R5: klachten bij ons in plaats van in reviews. Hoogstens elke 6 uur (klok van R7) leest deze workflow de open
# meldingen van de loketrepo's bison-flex, click-joints en rollwright via de openbare GitHub-API (geen eigen
# sleutel, alleen de gewone workflow-sleutel) en zet nieuwe onderaan berichten/hoofdchat.md: product, nummer,
# titel (opgeschoond) en link, nooit naam of mailadres van de melder. Wat al gemeld is staat in
# organisatie/loket/gemeld.txt. Script en toets: organisatie/loket/ophalen.py en toets_ophalen.py.

on:
  schedule:
    - cron: "41 5,11,17,22 * * *"
  workflow_dispatch:
  # Roestronde R7: GitHub laat geplande runs in deze repo vallen, daarom ook bij elke push naar main. De job klok
  # (organisatie/controle/klok.py) geeft hoogstens elke 6 uur een beurt, en altijd als de push de workflow of
  # organisatie/loket/ raakt, of bij een handmatige start (keuring R5, moet 1).
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  klok:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      beurt: ${{ steps.klok.outputs.beurt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: organisatie/controle
      - id: klok
        run: python3 -I organisatie/controle/klok.py loket-meldingen 6h --paden ".github/workflows/loket-meldingen.yml,organisatie/loket/**"

  ophalen:
    needs: klok
    if: needs.klok.outputs.beurt == 'ja'
    concurrency:
      group: loket-meldingen
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            organisatie/loket
            organisatie/controle
            berichten/hoofdchat.md
          sparse-checkout-cone-mode: false
      - name: Toets (zonder netwerk)
        run: python3 -I organisatie/loket/toets_ophalen.py
      - name: Ophalen en opslaan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "dortus-loket"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q --depth=1 origin main
            git reset -q --hard origin/main
            # Een repo die niet te lezen is maakt de run rood, maar wat wel binnenkwam wordt eerst opgeslagen.
            fout=0; python3 -I organisatie/loket/ophalen.py || fout=1
            git add organisatie/loket/gemeld.txt berichten/hoofdchat.md 2>/dev/null || true
            if git diff --cached --quiet; then echo "Geen nieuwe meldingen."; exit $fout; fi
            git commit -q -m "Loket: nieuwe meldingen naar berichten/hoofdchat.md"
            python3 organisatie/controle/check.py origin/main HEAD || exit 1
            if git push -q origin HEAD:main; then echo "Meldingen staan in berichten/hoofdchat.md."; exit $fout; fi
            sleep $((i * 5))
          done
          echo "Opslaan lukte niet na 6 pogingen."; exit 1
