name: Loket-meldingen (nieuwe issues naar berichten/hoofdchat.md)

# Roestronde R5: klachten bij ons in plaats van in reviews. Vier keer per dag leest deze workflow de open
# meldingen van de loketrepo's bison-flex, click-joints en rollwright via de openbare GitHub-API (geen eigen
# sleutel, alleen de gewone workflow-sleutel) en zet nieuwe onderaan berichten/hoofdchat.md: product, nummer,
# titel (opgeschoond) en link, nooit naam of mailadres van de melder. Wat al gemeld is staat in
# organisatie/loket/gemeld.txt. Script en toets: organisatie/loket/ophalen.py en toets_ophalen.py.

on:
  schedule:
    - cron: "41 5,11,17,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loket-meldingen
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            organisatie/loket
            organisatie/controle
            berichten/hoofdchat.md
          sparse-checkout-cone-mode: false
      - name: Toets (zonder netwerk)
        run: python3 -I organisatie/loket/toets_ophalen.py
      - name: Ophalen en opslaan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "dortus-loket"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q --depth=1 origin main
            git reset -q --hard origin/main
            python3 -I organisatie/loket/ophalen.py
            git add organisatie/loket/gemeld.txt berichten/hoofdchat.md 2>/dev/null || true
            if git diff --cached --quiet; then echo "Geen nieuwe meldingen."; exit 0; fi
            git commit -q -m "Loket: nieuwe meldingen naar berichten/hoofdchat.md"
            python3 organisatie/controle/check.py origin/main HEAD || exit 1
            if git push -q origin HEAD:main; then echo "Meldingen staan in berichten/hoofdchat.md."; exit 0; fi
            sleep $((i * 5))
          done
          echo "Opslaan lukte niet na 6 pogingen."; exit 1
