name: Garmin reeks kern proef (Connect IQ simulator)

# Bouwstraat voor de kale proef van de reeks datawijzerplaten (Gijs, 16 nov 2026), kopie van
# garmin-wijzerplaat-gloop.yml: compileren, Run No Evil-tests en schermafbeeldingen in de echte Connect IQ-simulator.
# De proef schrijft regels "KERN ..." in het log: wat het horloge geeft aan geschiedenis van Body Battery en
# stress, weer per uur, geheugen en tekentijd. Die regels komen in uitslag.txt naast de beelden.
# De image draait alleen in de bouw-job zonder schrijfrechten; alleen de job "schermen" mag pushen.

on:
  push:
    branches: ["claude/garmin-reeks*"]
    paths: ["producten/garmin-reeks-kern/**", ".github/workflows/garmin-reeks-kern.yml"]
  workflow_dispatch:

# Eén run per tak tegelijk; een nieuwere push breekt de oudere run af. In run 131 schreef een oudere run zijn
# beelden over die van een nieuwere heen, omdat hij later klaar was.
concurrency:
  group: garmin-reeks-kern-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bouw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/matco/connectiq-tester:latest
      APP: producten/garmin-reeks-kern
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Maten passen bij het blad van Mila
        run: cd "$GITHUB_WORKSPACE/$APP" && python3 maak_maten.py --toets
      - name: Elk horloge heeft het startpictogram in zijn eigen maat
        run: |
          cd "$GITHUB_WORKSPACE/$APP"
          python3 -c "import PIL" 2>/dev/null || pip install -q pillow
          python3 maak_iconen.py --toets
      - name: Image ophalen (tot drie pogingen)
        run: |
          for poging in 1 2 3; do docker pull -q "$IMAGE" && exit 0; sleep $((poging * 20)); done; exit 1
      - name: Tests in de simulator (fenix7)
        run: docker run --rm -v "$GITHUB_WORKSPACE/$APP:/app" -w /app "$IMAGE" fenix7
      - name: Schermafbeeldingen en uitslag per horloge
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$APP/schermen"
          cat > /tmp/schermen.sh <<'SH'
          set -x
          apt-get update -qq >/dev/null && apt-get install -y -qq imagemagick >/dev/null
          openssl genrsa -out /tmp/key.pem 4096 2>/dev/null
          openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/key.pem -out /tmp/key.der -nocrypt
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x1024x24 &
          sleep 2
          simulator > /tmp/sim.log 2>&1 &
          sleep 8
          U=schermen/uitslag.txt
          : > "$U"
          # Hoeveel geheugen geeft elk horloge uit het manifest aan een wijzerplaat, en welke Connect IQ-versie?
          for d in $(grep -o 'product id="[^"]*"' manifest.xml | cut -d'"' -f2); do
            f=$(find / -path "*Devices/$d/compiler.json" 2>/dev/null | head -1)
            echo "LIMIET $d $(tr -d ' \n' < "$f" 2>/dev/null | grep -o '{[^{}]*"watchFace"[^{}]*}') $(tr -d ' \n' < "$f" 2>/dev/null | grep -o '"connectIQVersion":"[^"]*"' | sort -u | tail -1) $(tr -d ' \n' < "$f" 2>/dev/null | grep -o '"bitsPerPixel":[0-9]*' | head -1) $(tr -d ' \n' < "$f" 2>/dev/null | grep -o '"launcherIcon":{[^{}]*}' | head -1)" >> "$U" || true
          done
          # Bouwt het pakket voor alle horloges uit het manifest? (wegwerpsleutel, niet voor de winkel)
          mkdir -p /tmp/prg
          if monkeyc -e -r -w -f monkey.jungle -y /tmp/key.der -o /tmp/prg/proef.iq > /tmp/iq-proef.log 2>&1; then
            echo "IQ_PROEF ja, horloges in manifest: $(grep -c 'iq:product id' manifest.xml), $(stat -c %s /tmp/prg/proef.iq) bytes, waarschuwingen: $(grep -ci warning /tmp/iq-proef.log || true)" >> "$U"
          else
            echo "IQ_PROEF nee" >> "$U"; tail -40 /tmp/iq-proef.log
          fi
          # De waarschuwingen van het pakket, per soort geteld (zonder de naam van het horloge), zodat ze te lezen zijn.
          echo "WAARSCHUWINGEN per soort:" >> "$U"
          grep -a -i warning /tmp/iq-proef.log | sed -E 's/^WARNING: [^:]+: //' | sort | uniq -c | sort -rn | head -40 | cut -c1-300 >> "$U" || true
          for d in fr255 fenix847mm venu3s vivoactive5 fr55 fr245 instinct2 venusq2 fr265s; do
            monkeyc -f proef.jungle -d "$d" -o "bin/app-$d.prg" -y /tmp/key.der -l 1 || { echo "BOUW $d nee" >> "$U"; continue; }
            echo "BOUW $d ja, $(stat -c %s "bin/app-$d.prg") bytes" >> "$U"
            monkeydo "bin/app-$d.prg" "$d" > "/tmp/do-$d.log" 2>&1 &
            MD=$!
            # Het proefpakket (proef.jungle) toont 8 s wit, 10 s wakker en dan het slaapbeeld. De app tekent zijn
            # eerste beeld 5 tot 9 s na de start: beeld 0 (wit) op 11 s, beeld 1 (wakker) op 20 s, beeld 2 en 3 (slaap) op 33 en 37 s.
            sleep 11
            import -window root "schermen/$d-0.png"
            sleep 9
            import -window root "schermen/$d-1.png"
            # 13 s (was 9): in run 44015762562 startte de Venu Sq 2 zo laat dat beeld 2 nog het wakkere beeld was.
            sleep 13
            import -window root "schermen/$d-2.png"
            sleep 4
            import -window root "schermen/$d-3.png"
            kill "$MD" 2>/dev/null || true
            grep -a "^KERN" "/tmp/do-$d.log" | head -30 | sed "s/^/$d /" >> "$U" || true
            grep -a -i "error\|exception" "/tmp/do-$d.log" | head -5 | sed "s/^/$d LOG /" >> "$U" || true
            tail -5 "/tmp/do-$d.log"
            sleep 2
          done
          # Elk horloge moet de maten van zijn eigen scherm laden (tijd in px uit het blad van Mila).
          MIS=0
          for paar in fr255:78 fenix847mm:136 venu3s:117 vivoactive5:117 fr55:62 fr245:72 fr265s:108 venusq2:90; do
            grep -q "^${paar%%:*} KERN MATEN n=29 tijdPx=${paar##*:} " "$U" || { echo "MATEN FOUT ${paar%%:*}, verwacht tijdPx=${paar##*:}" >> "$U"; MIS=1; }
          done
          echo "MATEN_PER_HORLOGE $([ $MIS = 0 ] && echo goed || echo FOUT)" >> "$U"
          # Elk horloge kiest de kleuren van zijn scherm: 0 vol (AMOLED), 1 64 kleuren, 2 8 kleuren (Forerunner 55).
          MIS=0
          for paar in fr255:1 fenix847mm:0 venu3s:0 vivoactive5:0 fr55:2 fr245:1 fr265s:0 venusq2:0; do
            grep -q "^${paar%%:*} KERN SCHERM .* diepte=${paar##*:}\b" "$U" || { echo "KLEUREN FOUT ${paar%%:*}, verwacht diepte=${paar##*:}" >> "$U"; MIS=1; }
          done
          echo "KLEUREN_PER_HORLOGE $([ $MIS = 0 ] && echo goed || echo FOUT)" >> "$U"
          mogrify -fuzz 2% -trim +repage schermen/*.png
          cat "$U"
          ls -la schermen
          SH
          docker run --rm --entrypoint bash -v "$GITHUB_WORKSPACE/$APP:/app" -w /app -v /tmp/schermen.sh:/tmp/schermen.sh "$IMAGE" /tmp/schermen.sh
      - name: Slaapbeeld tellen (pixels aan en verschuiving)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/$APP"
          python3 -c "import numpy, PIL" 2>/dev/null || pip install -q numpy pillow
          # --streng: de job wordt rood als een inbrandscherm boven de 8% zit of niet te meten is.
          CODE=0
          python3 tel_slaap.py --streng schermen fr255 fenix847mm venu3s vivoactive5 fr55 fr245 instinct2 venusq2 fr265s > /tmp/slaap.txt || CODE=$?
          sudo tee -a schermen/uitslag.txt < /tmp/slaap.txt
          exit $CODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garmin-reeks-kern-schermen
          path: producten/garmin-reeks-kern/schermen
          if-no-files-found: warn

  schermen:
    needs: bouw
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: garmin-reeks-kern-schermen
          path: schermen
      - name: Schermafbeeldingen openbaar zetten (tak schermen)
        env:
          TOKEN: ${{ github.token }}
          TAK: ${{ github.ref_name }}
        run: |
          SRC="$PWD/schermen"
          [ -d "$SRC" ] && [ -n "$(ls -A "$SRC")" ] || { echo "geen schermafbeeldingen"; exit 0; }
          NAAM=$(echo "$TAK" | tr '/' '-')
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            rm -rf /tmp/s
            # Alleen onze eigen map ophalen (de tak schermen is groot: in run 44017179674 duurde elke poging minuten en
            # kwam er geen enkele push door, terwijl de job groen bleef).
            if git clone -q --depth 1 --filter=blob:none --sparse --branch schermen "$URL" /tmp/s 2>/dev/null \
              && git -C /tmp/s sparse-checkout set "garmin-reeks-kern/$NAAM" >/dev/null; then :
            elif git ls-remote --exit-code "$URL" refs/heads/schermen >/dev/null 2>&1; then
              # De tak bestaat, maar ophalen lukte niet: opnieuw proberen in plaats van een lege tak te beginnen.
              sleep $((poging * 5)); continue
            else
              mkdir /tmp/s && cd /tmp/s && git init -q -b schermen && git remote add origin "$URL" && cd - >/dev/null
            fi
            D="/tmp/s/garmin-reeks-kern/$NAAM"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd /tmp/s && git add -A && git commit -q -m "Schermen garmin-reeks-kern/$NAAM run ${GITHUB_RUN_ID}" || { cd - >/dev/null; continue; }
            if git push -q origin schermen; then cd - >/dev/null; GELUKT=1; break; fi
            cd - >/dev/null; sleep $((poging * 3))
          done
          # Niet gelukt: de job rood, zodat niemand oude beelden voor nieuwe aanziet.
          [ "${GELUKT:-0}" = 1 ] || { echo "FOUT: de beelden staan niet op tak schermen"; exit 1; }
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/garmin-reeks-kern/$NAAM"
