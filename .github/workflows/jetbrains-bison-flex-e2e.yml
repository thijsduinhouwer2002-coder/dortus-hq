name: Bison & Flex e2e (echte IDE)

on:
  push:
    branches: [main, "claude/jetbrains-*"]
    paths: ["producten/jetbrains-bison-flex/**", ".github/workflows/jetbrains-bison-flex-e2e.yml"]
  workflow_dispatch:
  # Week-test (roestronde R4): week-test.yml roept deze workflow aan met de nieuwste IntelliJ- en CLion-EAP.
  workflow_call:
    inputs:
      idea_build:
        description: 'build van de nieuwste IntelliJ IDEA EAP (leeg: IDEA Community 2025.2 zoals bij een push)'
        type: string
        default: ''
      clion_build:
        description: 'build van de nieuwste CLion EAP (leeg: de vaste build uit ClionTest.kt)'
        type: string
        default: ''
      week:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: producten/jetbrains-bison-flex
    steps:
      - name: Schijfruimte voor CLion (±2 GB download, uitgepakt meer)
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Scherm (Xvfb), vensterbeheer en ImageMagick
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb fluxbox x11-utils imagemagick xdotool
          # Factor 2: 2880x1800 pixels, de IDE schaalt zelf naar 1440x900 (uiScale 2 in de test).
          Xvfb :99 -screen 0 2880x1800x24 &
          sleep 2
          # Geen balk van fluxbox in beeld, en de IDE altijd schermvullend (Daan, beoordeling 3).
          mkdir -p ~/.fluxbox
          printf 'session.screen0.toolbar.visible: false\n' > ~/.fluxbox/init
          printf '[app] (class=jetbrains-.*)\n  [Maximized] {yes}\n  [Deco] {NONE}\n[end]\n' > ~/.fluxbox/apps
          DISPLAY=:99 fluxbox >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Unittests
        run: ./gradlew --no-daemon test
      - name: Test in de echte IDE (${{ inputs.idea_build && format('IntelliJ IDEA EAP {0}', inputs.idea_build) || 'IDEA Community 2025.2' }})
        run: ./gradlew --no-daemon integrationTest ${{ inputs.idea_build && format('-PideBuild={0}', inputs.idea_build) || '' }}
      - name: Test in de echte CLion (${{ inputs.clion_build && format('EAP {0}', inputs.clion_build) || 'EAP 2026.3, vaste build' }})
        if: success() || failure()
        run: ./gradlew --no-daemon clionTest ${{ inputs.clion_build && format('-PclionBuild={0}', inputs.clion_build) || '' }}
      # Beeldvergelijking (roestronde R4): elk plaatje naast dat van de vorige geslaagde run. Nooit rood.
      # Grens 0,3 procent: de IDE geeft tussen runs tot 0,11 procent ruis bij deze drempel (GEZIEN, clion-donker-calc-y.png).
      - name: Beeldvergelijking met de vorige geslaagde run
        id: bv
        if: always()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          NAAM: ${{ inputs.week && 'week' || github.ref_name }}
        run: |
          B=organisatie/controle/beelden.sh
          if [ ! -f "$B" ]; then mkdir -p /tmp/bvs; for f in beelden.sh beeldvergelijk.py; do curl -fsSL --retry 3 -o "/tmp/bvs/$f" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/organisatie/controle/$f"; done; B=/tmp/bvs/beelden.sh; fi
          echo "B=$B" >> "$GITHUB_ENV"
          N=$(echo "$NAAM" | tr '/' '-')
          bash "$B" vergelijk producten/jetbrains-bison-flex/e2e/screenshots "referentie/jetbrains-bison-flex/$N" \
            /tmp/beeldverschil 0.3 "Bison & Flex ($N)" "jetbrains-bison-flex/$N"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beeldverschil-jetbrains-bison-flex
          path: /tmp/beeldverschil
          if-no-files-found: ignore
      - name: Referentiebeelden bijwerken (alleen als alles groen is)
        if: success()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          NAAM: ${{ inputs.week && 'week' || github.ref_name }}
        run: |
          N=$(echo "$NAAM" | tr '/' '-')
          bash "$B" bewaar producten/jetbrains-bison-flex/e2e/screenshots "referentie/jetbrains-bison-flex/$N" "jetbrains-bison-flex $N"
      - name: Groot beeldverschil melden aan Chris (alleen main, geen rood)
        if: always() && steps.bv.outputs.groot != '' && steps.bv.outputs.groot != '0' && steps.bv.outputs.terugval != '1' && github.ref_name == 'main' && !inputs.week
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          {
            echo "## $(bash "$B" datum) NL, van de beeldvergelijking (automatisch): Bison & Flex"
            echo "${{ steps.bv.outputs.groot }} plaatje(s) wijken sterk af van de vorige geslaagde run (commit ${GITHUB_SHA::8}). Geen rode test: kijk of het zo bedoeld is."
            echo "Verschilbeelden (rood is anders): artefact beeldverschil-jetbrains-bison-flex in https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            grep "| GROOT |" /tmp/beeldverschil/verslag.md | head -10 | sed 's/^/- /'
          } > /tmp/bericht.md
          bash "$B" bericht chris /tmp/bericht.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bison-flex-e2e
          path: |
            producten/jetbrains-bison-flex/e2e/screenshots
            producten/jetbrains-bison-flex/build/reports
            producten/jetbrains-bison-flex/build/test-results
            producten/jetbrains-bison-flex/out/ide-tests/tests/**/log
          if-no-files-found: warn
      - name: Schermafbeeldingen openbaar zetten (tak schermen)
        if: always()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          TAK: ${{ inputs.week && 'week' || github.ref_name }}
        run: |
          SRC="$GITHUB_WORKSPACE/producten/jetbrains-bison-flex/e2e/screenshots"
          [ -d "$SRC" ] && [ -n "$(ls -A "$SRC")" ] || { echo "geen schermafbeeldingen"; exit 0; }
          NAAM=$(echo "$TAK" | tr '/' '-')
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            rm -rf /tmp/s
            if git clone -q --depth 1 --branch schermen "$URL" /tmp/s 2>/dev/null; then :; else
              mkdir /tmp/s && cd /tmp/s && git init -q -b schermen && git remote add origin "$URL" && cd - >/dev/null
            fi
            D="/tmp/s/jetbrains-bison-flex/$NAAM"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd /tmp/s && git add -A && git commit -q -m "Schermen jetbrains-bison-flex/$NAAM run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then cd - >/dev/null; break; fi
            cd - >/dev/null; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/jetbrains-bison-flex/$NAAM"
          ls "$SRC"
