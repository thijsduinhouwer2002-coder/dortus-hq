name: Bison & Flex e2e (echte IDE)

on:
  push:
    branches: [main, "claude/jetbrains-*"]
    paths: ["producten/jetbrains-bison-flex/**", ".github/workflows/jetbrains-bison-flex-e2e.yml"]
  workflow_dispatch:
  # Week-test (roestronde R4): week-test.yml roept deze workflow aan met de nieuwste IntelliJ- en CLion-EAP.
  workflow_call:
    inputs:
      idea_build:
        description: 'build van de nieuwste IntelliJ IDEA EAP (leeg: IDEA Community 2025.2 zoals bij een push)'
        type: string
        default: ''
      clion_build:
        description: 'build van de nieuwste CLion EAP (leeg: de vaste build uit ClionTest.kt)'
        type: string
        default: ''
      week:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: producten/jetbrains-bison-flex
    steps:
      - name: Schijfruimte voor CLion (±2 GB download, uitgepakt meer)
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Scherm (Xvfb), vensterbeheer en ImageMagick
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb fluxbox x11-utils imagemagick xdotool
          # Factor 2: 2880x1800 pixels, de IDE schaalt zelf naar 1440x900 (uiScale 2 in de test).
          Xvfb :99 -screen 0 2880x1800x24 &
          sleep 2
          # Geen balk van fluxbox in beeld, en de IDE altijd schermvullend (Daan, beoordeling 3).
          mkdir -p ~/.fluxbox
          printf 'session.screen0.toolbar.visible: false\n' > ~/.fluxbox/init
          printf '[app] (class=jetbrains-.*)\n  [Maximized] {yes}\n  [Deco] {NONE}\n[end]\n' > ~/.fluxbox/apps
          DISPLAY=:99 fluxbox >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Unittests
        run: ./gradlew --no-daemon test
      - name: Test in de echte IDE (${{ inputs.idea_build && format('IntelliJ IDEA EAP {0}', inputs.idea_build) || 'IDEA Community 2025.2' }})
        env:
          IDEA_BUILD: ${{ inputs.idea_build }}   # invoer via env, nooit rechtstreeks in de shell (roestronde R2)
        run: ./gradlew --no-daemon integrationTest ${IDEA_BUILD:+"-PideBuild=$IDEA_BUILD"}
      - name: Test in de echte CLion (${{ inputs.clion_build && format('EAP {0}', inputs.clion_build) || 'EAP 2026.3, vaste build' }})
        if: success() || failure()
        env:
          CLION_BUILD: ${{ inputs.clion_build }}
        run: ./gradlew --no-daemon clionTest ${CLION_BUILD:+"-PclionBuild=$CLION_BUILD"}
      # Beeldvergelijking (roestronde R4): elk plaatje naast dat van de vorige geslaagde run. Nooit rood.
      # Ruis tussen runs zonder maskers: 0,34 tot 1,56 procent (keuring R4, 19 nov), door de willekeurige tijdelijke
      # projectmap (in de projectboom en als kleur van de projectknop bovenaan) en de voortgangsbalk van het indexeren.
      # Daarom: vaste projectmap (Gedeeld.kt), de strook linksboven (projectknop) en de voortgangsbalk onder de
      # projectboom tellen niet mee, alleen op schermen van het hele IDE-venster (2880x1800, niet op dialogen).
      # De twee dialogen die van maat sprongen zet de test vast (vastVenster in Gedeeld.kt); een klein maatverschil
      # wordt anders met verschuiving vergeleken (beeldvergelijk.py), en
      # de twee hernoem-plaatjes met een melding of tooltip neemt de test pas op als het beeld stilstaat (schermStil).
      # Twee bomen klappen in de ene run wel en in de andere niet open, ook als het beeld stilstaat (runs 44436778211
      # en 44436781019, GEZIEN): de boom in het conflictvenster bij hernoemen en het Find-paneel op winkel-alleplekken.
      # Die vakken tellen niet mee; de rest van die plaatjes wel. Op de kleurenpagina schuift de scheiding tussen boom
      # en paneel van run tot run (±55 px, run 44481997077, ook met vaste venstermaat): daar telt alleen het paneel
      # rechts, vergeleken met de best passende horizontale verschuiving. Grens 0,3 procent.
      - name: Beeldvergelijking met de vorige geslaagde run
        id: bv
        if: always()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          NAAM: ${{ inputs.week && 'week' || github.ref_name }}
        run: |
          B=organisatie/controle/beelden.sh
          if [ ! -f "$B" ]; then mkdir -p /tmp/bvs; for f in beelden.sh beeldvergelijk.py; do curl -fsSL --retry 3 -o "/tmp/bvs/$f" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/organisatie/controle/$f"; done; B=/tmp/bvs/beelden.sh; fi
          echo "B=$B" >> "$GITHUB_ENV"
          N=$(echo "$NAAM" | tr '/' '-')
          bash "$B" vergelijk producten/jetbrains-bison-flex/e2e/screenshots "referentie/jetbrains-bison-flex/$N" \
            /tmp/beeldverschil 0.3 "Bison & Flex ($N)" "jetbrains-bison-flex/$N" "*@2880x1800:0,0,1000,80;*-calc-y.png@2880x1800:80,1700,1040,1760;*-hernoem-conflict.png:0,60,1600,330;winkel-alleplekken.png:180,1225,2800,1745;*-kleurenpagina.png%560,0,1920,1300,80"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beeldverschil-jetbrains-bison-flex
          path: /tmp/beeldverschil
          if-no-files-found: ignore
      - name: Referentiebeelden bijwerken (alleen als alles groen is)
        if: success()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          NAAM: ${{ inputs.week && 'week' || github.ref_name }}
        run: |
          N=$(echo "$NAAM" | tr '/' '-')
          bash "$B" bewaar producten/jetbrains-bison-flex/e2e/screenshots "referentie/jetbrains-bison-flex/$N" "jetbrains-bison-flex $N"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bison-flex-e2e
          path: |
            producten/jetbrains-bison-flex/e2e/screenshots
            producten/jetbrains-bison-flex/build/reports
            producten/jetbrains-bison-flex/build/test-results
            producten/jetbrains-bison-flex/out/ide-tests/tests/**/log
          if-no-files-found: warn
      - name: Schermafbeeldingen openbaar zetten (tak schermen)
        if: always()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          TAK: ${{ inputs.week && 'week' || github.ref_name }}
        run: |
          SRC="$GITHUB_WORKSPACE/producten/jetbrains-bison-flex/e2e/screenshots"
          [ -d "$SRC" ] && [ -n "$(ls -A "$SRC")" ] || { echo "geen schermafbeeldingen"; exit 0; }
          NAAM=$(echo "$TAK" | tr '/' '-')
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            rm -rf /tmp/s
            # Alleen onze eigen map (zoals Click Joints): de hele tak schermen is 6,7 GB en kostte 12 tot 15 minuten.
            if git clone -q --depth 1 --filter=blob:none --sparse --branch schermen "$URL" /tmp/s 2>/dev/null; then
              git -C /tmp/s sparse-checkout set "jetbrains-bison-flex/$NAAM"
            else
              mkdir /tmp/s && cd /tmp/s && git init -q -b schermen && git remote add origin "$URL" && cd - >/dev/null
            fi
            D="/tmp/s/jetbrains-bison-flex/$NAAM"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd /tmp/s && git add -A && git commit -q -m "Schermen jetbrains-bison-flex/$NAAM run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then cd - >/dev/null; break; fi
            cd - >/dev/null; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/jetbrains-bison-flex/$NAAM"
          ls "$SRC"

  # Eén beeldbericht per run voor alle jobs samen, en niet opnieuw als hetzelfde verschil al gemeld is
  # (keuring R4: eerst kwam er een bericht per job en per run). Alleen main, niet in de week-test.
  beeldbericht:
    needs: e2e
    # Weer uit (herkeuring 2): run 44481997077 gaf vals alarm op donker-kleurenpagina (scheiding schoof ±55 px).
    # Pas weer aan na drie runs van dezelfde code met 0 groot.
    if: false && always() && github.ref_name == 'main' && !inputs.week
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: organisatie/controle
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: beeldverschil-jetbrains-bison-flex*
          path: /tmp/bv
      - name: Beeldbericht aan Chris (alleen bij een groot of leeg plaatje dat nog niet gemeld is)
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bv
          bash organisatie/controle/beelden.sh meld jetbrains-bison-flex chris /tmp/bv main
