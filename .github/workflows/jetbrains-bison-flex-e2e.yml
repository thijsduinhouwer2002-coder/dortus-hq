name: Bison & Flex e2e (echte IDE)

on:
  push:
    branches: [main, "claude/jetbrains-*"]
    paths: ["producten/jetbrains-bison-flex/**", ".github/workflows/jetbrains-bison-flex-e2e.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: producten/jetbrains-bison-flex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Scherm (Xvfb), vensterbeheer en ImageMagick
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb fluxbox x11-utils imagemagick
          Xvfb :99 -screen 0 1600x1000x24 &
          sleep 2
          DISPLAY=:99 fluxbox >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Unittests
        run: ./gradlew --no-daemon test
      - name: Test in de echte IDE (IDEA Community 2025.2)
        run: ./gradlew --no-daemon integrationTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bison-flex-e2e
          path: |
            producten/jetbrains-bison-flex/e2e/screenshots
            producten/jetbrains-bison-flex/build/reports
            producten/jetbrains-bison-flex/build/test-results
            producten/jetbrains-bison-flex/out/ide-tests/tests/**/log
          if-no-files-found: warn
      - name: Schermafbeeldingen openbaar zetten (tak schermen)
        if: always()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          TAK: ${{ github.ref_name }}
        run: |
          SRC="$GITHUB_WORKSPACE/producten/jetbrains-bison-flex/e2e/screenshots"
          [ -d "$SRC" ] && [ -n "$(ls -A "$SRC")" ] || { echo "geen schermafbeeldingen"; exit 0; }
          NAAM=$(echo "$TAK" | tr '/' '-')
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            rm -rf /tmp/s
            if git clone -q --depth 1 --branch schermen "$URL" /tmp/s 2>/dev/null; then :; else
              mkdir /tmp/s && cd /tmp/s && git init -q -b schermen && git remote add origin "$URL" && cd - >/dev/null
            fi
            D="/tmp/s/jetbrains-bison-flex/$NAAM"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd /tmp/s && git add -A && git commit -q -m "Schermen jetbrains-bison-flex/$NAAM run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then cd - >/dev/null; break; fi
            cd - >/dev/null; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/jetbrains-bison-flex/$NAAM"
          ls "$SRC"
