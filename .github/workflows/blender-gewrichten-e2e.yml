name: Blender gewrichten e2e (Click Joints, echte Blender)

on:
  push:
    branches: [main, "claude/blender-*"]
    paths: ["producten/blender-gewrichten/**", ".github/workflows/blender-gewrichten-e2e.yml"]
  workflow_dispatch:
  # Week-test (roestronde R4): week-test.yml roept deze workflow aan met de nieuwste Blender alpha en dailies.
  workflow_call:
    inputs:
      blender:
        description: 'JSON-lijst van versies, bijvoorbeeld ["5.3.0", "5.4.0-alpha", "5.2.4-stable"] (met -alpha, -beta, -rc of -stable: daily van builder.blender.org)'
        type: string
        required: false
      week:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Vaste versies bij een push; week-test.yml leest deze lijst en geeft zijn eigen lijst mee.
        blender: ${{ fromJSON(inputs.blender || '["4.2.23", "5.2.3", "5.3.0"]') }}
    env:
      PRO_VERSIE: "1.1.0"
    defaults:
      run:
        working-directory: producten/blender-gewrichten
    steps:
      - uses: actions/checkout@v4
      - name: Systeempakketten (Xvfb en software-OpenGL)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1 libegl1 libgl1-mesa-dri libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 zip imagemagick xdotool
      - name: Blender ${{ matrix.blender }} ophalen
        run: |
          V="${{ matrix.blender }}"; KORT="${V%.*}"
          # Week-test: versie met -alpha, -beta, -rc of -stable komt als daily van builder.blender.org.
          case "$V" in *-alpha|*-beta|*-rc|*-stable)
            NUM="${V%-*}"; CYC="${V##*-}"
            U=$(curl -fsSL --retry 3 "https://builder.blender.org/download/daily/?format=json&v=1" | python3 -c "
          import json, sys
          r = [b for b in json.load(sys.stdin) if b['version'] == '$NUM' and b['release_cycle'] == '$CYC' and b['platform'] == 'linux'
               and b['architecture'] == 'x86_64' and b['file_extension'] == 'xz']
          print(r[0]['url'] if r else '')")
            [ -n "$U" ] || { echo "FOUT: daily $V niet in de lijst van builder.blender.org"; exit 1; }
            echo "daily: $U"
            curl -fsSL --retry 3 --retry-delay 10 -o /tmp/blender.tar.xz "$U" || { echo "FOUT: daily $V niet te downloaden"; exit 1; }
            mkdir -p /tmp/blender && tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
            /tmp/blender/blender --version | head -1
            exit 0 ;;
          esac
          # download.blender.org geeft vanuit Actions soms 403 (16 nov, run 43792521740); --retry probeert 403 niet
          # opnieuw, dus dan een spiegel (zelfde bestand, GEZIEN 200 en 407 MB voor 5.3.0).
          B="release/Blender${KORT}/blender-${V}-linux-x64.tar.xz"
          for u in "https://download.blender.org/$B" "https://ftp.nluug.nl/pub/graphics/blender/$B" "https://mirrors.ocf.berkeley.edu/blender/$B"; do
            curl -fsSL --retry 3 --retry-delay 10 -o /tmp/blender.tar.xz "$u" && break
            echo "niet gelukt: $u"; rm -f /tmp/blender.tar.xz
          done
          [ -s /tmp/blender.tar.xz ] || { echo "FOUT: Blender $V niet te downloaden"; exit 1; }
          mkdir -p /tmp/blender && tar -xf /tmp/blender.tar.xz -C /tmp/blender --strip-components=1
          /tmp/blender/blender --version | head -1
      - name: Add-on inpakken
        run: bash e2e/maak_zip.sh
      - name: Extensie-zip valideren (zoals extensions.blender.org)
        run: /tmp/blender/blender --command extension validate /tmp/click_joints.zip
      - name: Test zonder scherm (gewricht, speling, passing, gesloten, STL)
        run: /tmp/blender/blender -b --factory-startup --python e2e/test_achtergrond.py -- /tmp/click_joints.zip
      - name: Schermafbeeldingen met de echte interface
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Eigen lege voorkeurenmap: zo kunnen we vooraf voorkeuren opslaan zonder splash.
          BLENDER_USER_RESOURCES: /tmp/bu
          BLENDER_USER_CONFIG: /tmp/bu/config
        run: |
          # Quick Setup verschijnt alleen als er nog geen voorkeuren zijn. Sla ze daarom eerst op,
          # met het opstartscherm uit, en start de interface zonder --factory-startup.
          /tmp/blender/blender -b --python-expr "import bpy; bpy.context.preferences.view.show_splash=False; bpy.ops.wm.save_userpref(); bpy.ops.wm.save_as_mainfile(filepath='/tmp/start.blend')"
          ls -la /tmp/bu/config || true
          timeout 300 xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            /tmp/blender/blender --gpu-backend opengl /tmp/start.blend --python e2e/schermen.py -- "$PWD/e2e/screenshots/${{ matrix.blender }}" /tmp/click_joints.zip 2>&1 | tee /tmp/schermen.log || true
          ls -la e2e/screenshots/${{ matrix.blender }} || true
          # Rood als het tabblad niet lukte of de plaatjes ontbreken, zodat Daan nooit verkeerde plaatjes krijgt.
          grep -q "TABBLAD OK" /tmp/schermen.log || { echo "FOUT: tabblad Click Joints niet actief"; exit 1; }
          # As langs de kijkrichting vanuit de zijbalk: gewricht geplaatst, as gelijk aan de kijkrichting, delen gesloten.
          grep -q "KIJK OK" /tmp/schermen.log || { echo "FOUT: as langs de kijkrichting niet goed"; exit 1; }
          # Plaatje 7 moet echt een gewricht op het platte lid tonen (controleur ronde l).
          grep -q "PLAT plaats: .*, 2 delen" /tmp/schermen.log || { echo "FOUT: geen gewricht op het platte lid"; exit 1; }
          # Gradenboog (Daan, beoordeling 3): getal gelijk aan het paneel, streepjes, rood voorbij de grens.
          grep -q "BOOG OK waaier" /tmp/schermen.log || { echo "FOUT: gradenboog binnen de grens niet goed"; exit 1; }
          grep -q "BOOG OK rood" /tmp/schermen.log || { echo "FOUT: gradenboog voorbij de grens niet goed"; exit 1; }
          # Winkelschermen (lanceerlijst Daan): gradenboog binnen en voorbij de grens, hele venster.
          grep -q "BOOG OK winkel " /tmp/schermen.log || { echo "FOUT: winkelscherm 8 niet goed"; exit 1; }
          grep -q "BOOG OK winkel-rood" /tmp/schermen.log || { echo "FOUT: winkelscherm 9 niet goed"; exit 1; }
          grep -q "BOOG OK winkel-paneel" /tmp/schermen.log || { echo "FOUT: winkelscherm 10 boog niet goed"; exit 1; }
          grep -q "PANEEL OK winkel" /tmp/schermen.log || { echo "FOUT: winkelscherm 10 paneel niet goed"; exit 1; }
          for f in 1-paneel-x.png 2-gewricht-x.png 5-waaier-x.png 6-rood-x.png 7-plat-x.png 8-winkel-x.png 9-winkel-rood-x.png 10-winkel-paneel-x.png; do [ -s "e2e/screenshots/${{ matrix.blender }}/$f" ] || { echo "FOUT: $f ontbreekt"; exit 1; }; done
      - name: Betaalde build (twee zips uit één bron, weigering naast de gratis)
        # Ontwerp betaald v1.1: na de gratis toetsen, met eigen lege mappen zodat niets de gratis stappen raakt.
        env:
          BLENDER_USER_RESOURCES: /tmp/cj_betaald
          BLENDER_USER_CONFIG: /tmp/cj_betaald/config
          BLENDER_USER_EXTENSIONS: /tmp/cj_betaald/extensions
        run: |
          bash e2e/maak_zip.sh betaald
          python3 -I e2e/toets_zips.py /tmp/click_joints.zip /tmp/click_joints_betaald.zip
          /tmp/blender/blender --command extension validate /tmp/click_joints_betaald.zip
          /tmp/blender/blender -b --factory-startup --python e2e/test_betaald.py -- /tmp/click_joints_betaald.zip /tmp/click_joints.zip
          mkdir -p "e2e/screenshots/${{ matrix.blender }}"
          cp /tmp/click_joints_betaald.zip "e2e/screenshots/${{ matrix.blender }}/click_joints_pro-${PRO_VERSIE}.zip"
          sha256sum /tmp/click_joints_betaald.zip | tee "e2e/screenshots/${{ matrix.blender }}/click_joints_pro-${PRO_VERSIE}.sha256"
      - name: Geen terugval (alle toetsen van de gratis versie op de Pro-zip, les Retopoflow)
        # Lars 17 nov (verhaal 27): Pro 1.1 gaat pas uit als alles wat 1.0 kon nog werkt (kogel, speling, passing,
        # beweegproef, boog, STL en 3MF), met de Pro-zip zelf geïnstalleerd. Scharnier 90/115/135 toetst test_betaald.
        env:
          BLENDER_USER_RESOURCES: /tmp/cj_terug
          BLENDER_USER_CONFIG: /tmp/cj_terug/config
          BLENDER_USER_EXTENSIONS: /tmp/cj_terug/extensions
        run: |
          [ -s /tmp/click_joints_betaald.zip ] || bash e2e/maak_zip.sh betaald
          /tmp/blender/blender -b --factory-startup --python e2e/test_achtergrond.py -- /tmp/click_joints_betaald.zip 2>&1 | tee /tmp/terug.log
          grep -q "klaar, fouten: \[\]" /tmp/terug.log
      - name: Eén lid snijden (0.1.1 en 1.0.2, figuur met twee benen uit één stuk)
        # Fout uit de proef met Meshy-figuren (15 nov): een gewricht in één knie sneed beide benen door.
        run: |
          for z in click_joints click_joints_betaald; do
            d="/tmp/cj_lid_$z"
            BLENDER_USER_RESOURCES="$d" BLENDER_USER_CONFIG="$d/config" BLENDER_USER_EXTENSIONS="$d/extensions" \
              /tmp/blender/blender -b --factory-startup --python e2e/toetsen_een_lid.py -- "/tmp/$z.zip" 2>&1 | tee "/tmp/lid_$z.log"
            grep -q "KLAAR 0 FOUT" "/tmp/lid_$z.log" || { echo "FOUT: een lid ($z)"; exit 1; }
          done
      - name: Figuurpresets (Pro 1.1 stap 1, zes gewrichten zonder rig en de lijst per figuur)
        run: |
          [ -s /tmp/click_joints_betaald.zip ] || bash e2e/maak_zip.sh betaald
          d=/tmp/cj_figuur
          BLENDER_USER_RESOURCES="$d" BLENDER_USER_CONFIG="$d/config" BLENDER_USER_EXTENSIONS="$d/extensions" \
            /tmp/blender/blender -b --factory-startup --python e2e/toetsen_figuur.py -- /tmp/click_joints_betaald.zip 2>&1 | tee /tmp/figuur.log
          grep -q "KLAAR 0 FOUT" /tmp/figuur.log || { echo "FOUT: figuurpresets"; exit 1; }
          # Stap 2a: vrije eindstop 30 tot 150 graden (voor Rig to Figure), zelfde lege mappen.
          BLENDER_USER_RESOURCES="$d" BLENDER_USER_CONFIG="$d/config" BLENDER_USER_EXTENSIONS="$d/extensions" \
            /tmp/blender/blender -b --factory-startup --python e2e/toetsen_vrije_stop.py -- /tmp/click_joints_betaald.zip 2>&1 | tee /tmp/vrij.log
          grep -q "KLAAR 0 FOUT" /tmp/vrij.log || { echo "FOUT: vrije eindstop"; exit 1; }
          # Stap 2b: Figure from rig (knieën uit een kleine rig, eindstop uit Limit Rotation, ander been telt niet).
          BLENDER_USER_RESOURCES="$d" BLENDER_USER_CONFIG="$d/config" BLENDER_USER_EXTENSIONS="$d/extensions" \
            /tmp/blender/blender -b --factory-startup --python e2e/toetsen_rig.py -- /tmp/click_joints_betaald.zip 2>&1 | tee /tmp/rig.log
          grep -q "KLAAR 0 FOUT" /tmp/rig.log || { echo "FOUT: figure from rig"; exit 1; }
          # Hele figuur met armen: acht gewrichten, kogels uit de romp, kogel aan de komkant alleen de kom (16 nov run 5).
          BLENDER_USER_RESOURCES="$d" BLENDER_USER_CONFIG="$d/config" BLENDER_USER_EXTENSIONS="$d/extensions" \
            /tmp/blender/blender -b --factory-startup --python e2e/toetsen_rig_armen.py -- /tmp/click_joints_betaald.zip 2>&1 | tee /tmp/armen.log
          grep -q "KLAAR 0 FOUT" /tmp/armen.log || { echo "FOUT: figure from rig met armen"; exit 1; }
          # Echte Rigify-metarig (16 nov run 11): heupen bewegen naast de knieën, nooit een gewricht op blocked.
          BLENDER_USER_RESOURCES="$d" BLENDER_USER_CONFIG="$d/config" BLENDER_USER_EXTENSIONS="$d/extensions" \
            /tmp/blender/blender -b --factory-startup --python e2e/toetsen_rigify.py -- /tmp/click_joints_betaald.zip 2>&1 | tee /tmp/rigify.log
          grep -q "KLAAR 0 FOUT" /tmp/rigify.log || { echo "FOUT: figure from rig op de Rigify-metarig"; exit 1; }
          # Echte Meshy-figuur army_man (Chris 16 nov 20:00): een knie laat de zool niet als los stuk in B achter.
          pip install -q remotezip
          mkdir -p /tmp/meshy && (cd /tmp/meshy && python3 -c "from remotezip import RemoteZip; RemoteZip('https://huggingface.co/datasets/tfnn/MESHY.AI_800_GLB_3D-Assets_Categorised_and_Labelled/resolve/main/MESHY_GLB.zip').extract('MESHY_GLB/people/army_man.glb', '.')")
          BLENDER_USER_RESOURCES="$d" BLENDER_USER_CONFIG="$d/config" BLENDER_USER_EXTENSIONS="$d/extensions" \
            /tmp/blender/blender -b --factory-startup --python e2e/toetsen_meshy_voet.py -- /tmp/click_joints_betaald.zip /tmp/meshy/MESHY_GLB/people/army_man.glb 2>&1 | tee /tmp/voet.log
          grep -q "KLAAR 0 FOUT" /tmp/voet.log || { echo "FOUT: knie in army_man laat de voet achter"; exit 1; }
          # Echte Meshy-figuren met Mixamo-namen (16 nov run 16): knieën from rig en mirrored, elk deel één stuk,
          # heup die niet past met leesbare reden.
          (cd /tmp/meshy && python3 -c "from remotezip import RemoteZip; z=RemoteZip('https://huggingface.co/datasets/tfnn/MESHY.AI_800_GLB_3D-Assets_Categorised_and_Labelled/resolve/main/MESHY_GLB.zip'); [z.extract(f'MESHY_GLB/people/{n}.glb', '.') for n in ('man_backpack', 'knight_yellow')]")
          BLENDER_USER_RESOURCES="$d" BLENDER_USER_CONFIG="$d/config" BLENDER_USER_EXTENSIONS="$d/extensions" \
            /tmp/blender/blender -b --factory-startup --python e2e/toetsen_meshy_rig.py -- /tmp/click_joints_betaald.zip /tmp/meshy/MESHY_GLB/people/man_backpack.glb /tmp/meshy/MESHY_GLB/people/knight_yellow.glb 2>&1 | tee /tmp/mrig.log
          grep -q "KLAAR 0 FOUT" /tmp/mrig.log || { echo "FOUT: figure from rig op Meshy-figuren"; exit 1; }
          # Echte mensfiguur (17 nov run 20): MakeHuman base.obj (CC0 1.0) met Mixamo-rig op de eigen gewrichtspunten,
          # 220 mm: knieën en ellebogen from rig en mirrored met het gemeten bereik, niets kwijt, alle delen één stuk.
          curl -fsSL --retry 3 -o /tmp/mh_base.obj https://raw.githubusercontent.com/makehumancommunity/makehuman/master/makehuman/data/3dobjs/base.obj
          BLENDER_USER_RESOURCES="$d" BLENDER_USER_CONFIG="$d/config" BLENDER_USER_EXTENSIONS="$d/extensions" \
            /tmp/blender/blender -b --factory-startup --python e2e/toetsen_mens.py -- /tmp/click_joints_betaald.zip /tmp/mh_base.obj 2>&1 | tee /tmp/mens.log
          grep -q "KLAAR 0 FOUT" /tmp/mens.log || { echo "FOUT: figure from rig op de MakeHuman-figuur"; exit 1; }
          # Auto-Rig Pro-namen (17 nov run 25, Lars verhaal 26): zelfde mens en rig, botten als forearm_stretch.l, neck.x.
          CJ_RIG_NAMEN=arp BLENDER_USER_RESOURCES="$d" BLENDER_USER_CONFIG="$d/config" BLENDER_USER_EXTENSIONS="$d/extensions" \
            /tmp/blender/blender -b --factory-startup --python e2e/toetsen_mens.py -- /tmp/click_joints_betaald.zip /tmp/mh_base.obj 2>&1 | tee /tmp/mens_arp.log
          grep -q "KLAAR 0 FOUT" /tmp/mens_arp.log || { echo "FOUT: figure from rig met Auto-Rig Pro-namen"; exit 1; }
          # Zwaairuimte (17 nov run 25): elleboog met rig-stop 115 en 90 haalt 115 en 90 (zonder uitsnede 82 en 55).
          BLENDER_USER_RESOURCES="$d" BLENDER_USER_CONFIG="$d/config" BLENDER_USER_EXTENSIONS="$d/extensions" \
            /tmp/blender/blender -b --factory-startup --python e2e/toetsen_zwaai.py -- /tmp/click_joints_betaald.zip /tmp/mh_base.obj 2>&1 | tee /tmp/zwaai.log
          grep -q "KLAAR 0 FOUT" /tmp/zwaai.log || { echo "FOUT: zwaairuimte van de elleboog"; exit 1; }
      - name: Schermafbeelding figuurpresets (Pro 1.1, plaatje 15 voor Daan)
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          BLENDER_USER_RESOURCES: /tmp/cj_fig_s
          BLENDER_USER_CONFIG: /tmp/cj_fig_s/config
          BLENDER_USER_EXTENSIONS: /tmp/cj_fig_s/extensions
        run: |
          [ -s /tmp/click_joints_betaald.zip ] || bash e2e/maak_zip.sh betaald
          /tmp/blender/blender -b --python-expr "import bpy; bpy.context.preferences.view.show_splash=False; bpy.ops.wm.save_userpref(); bpy.ops.wm.save_as_mainfile(filepath='/tmp/start_f.blend')"
          timeout 300 xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            /tmp/blender/blender --gpu-backend opengl /tmp/start_f.blend --python e2e/scherm_figuur.py -- "$PWD/e2e/screenshots/${{ matrix.blender }}" /tmp/click_joints_betaald.zip 2>&1 | tee /tmp/figuur_s.log || true
          grep -q "FIGUUR OK" /tmp/figuur_s.log || { echo "FOUT: plaatje 15 figuurpresets"; exit 1; }
          for f in 15-figuur-x.png 15-figuur-paneel.png; do [ -s "e2e/screenshots/${{ matrix.blender }}/$f" ] || { echo "FOUT: $f ontbreekt"; exit 1; }; done
      - name: Schermafbeelding Figure from rig (Pro 1.1, plaatje 16 voor Daan, bogen per gewricht en from rig)
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          BLENDER_USER_RESOURCES: /tmp/cj_rig_s
          BLENDER_USER_CONFIG: /tmp/cj_rig_s/config
          BLENDER_USER_EXTENSIONS: /tmp/cj_rig_s/extensions
        run: |
          [ -s /tmp/click_joints_betaald.zip ] || bash e2e/maak_zip.sh betaald
          mkdir -p "e2e/screenshots/${{ matrix.blender }}"
          /tmp/blender/blender -b --python-expr "import bpy; bpy.context.preferences.view.show_splash=False; bpy.ops.wm.save_userpref(); bpy.ops.wm.save_as_mainfile(filepath='/tmp/start_r.blend')"
          timeout 300 xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            /tmp/blender/blender --gpu-backend opengl /tmp/start_r.blend --python e2e/scherm_rig.py -- "$PWD/e2e/screenshots/${{ matrix.blender }}" /tmp/click_joints_betaald.zip 2>&1 | tee /tmp/rig_s.log || true
          grep -q "RIG BEELD OK" /tmp/rig_s.log || { echo "FOUT: plaatje 16 Figure from rig"; exit 1; }
          for f in 16-figuur-rig-x.png 16-figuur-rig-paneel.png; do [ -s "e2e/screenshots/${{ matrix.blender }}/$f" ] || { echo "FOUT: $f ontbreekt"; exit 1; }; done
      - name: Schermafbeelding hele figuur (Pro 1.1, plaatje 17 voor Daan, acht gewrichten met bereik)
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          BLENDER_USER_RESOURCES: /tmp/cj_armen_s
          BLENDER_USER_CONFIG: /tmp/cj_armen_s/config
          BLENDER_USER_EXTENSIONS: /tmp/cj_armen_s/extensions
        run: |
          [ -s /tmp/click_joints_betaald.zip ] || bash e2e/maak_zip.sh betaald
          mkdir -p "e2e/screenshots/${{ matrix.blender }}"
          /tmp/blender/blender -b --python-expr "import bpy; bpy.context.preferences.view.show_splash=False; bpy.ops.wm.save_userpref(); bpy.ops.wm.save_as_mainfile(filepath='/tmp/start_a.blend')"
          timeout 300 xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            /tmp/blender/blender --gpu-backend opengl /tmp/start_a.blend --python e2e/scherm_rig_armen.py -- "$PWD/e2e/screenshots/${{ matrix.blender }}" /tmp/click_joints_betaald.zip 2>&1 | tee /tmp/armen_s.log || true
          grep -q "ARMEN BEELD OK" /tmp/armen_s.log || { echo "FOUT: plaatje 17 hele figuur"; exit 1; }
          for f in 17-figuur-heel-x.png 17-figuur-heel-paneel.png; do [ -s "e2e/screenshots/${{ matrix.blender }}/$f" ] || { echo "FOUT: $f ontbreekt"; exit 1; }; done
      - name: Schermafbeelding echte mensfiguur (Pro 1.1, plaatje 19, eindbeeld voor Daan)
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          BLENDER_USER_RESOURCES: /tmp/cj_mens_s
          BLENDER_USER_CONFIG: /tmp/cj_mens_s/config
          BLENDER_USER_EXTENSIONS: /tmp/cj_mens_s/extensions
        run: |
          [ -s /tmp/click_joints_betaald.zip ] || bash e2e/maak_zip.sh betaald
          [ -s /tmp/mh_base.obj ] || curl -fsSL --retry 3 -o /tmp/mh_base.obj https://raw.githubusercontent.com/makehumancommunity/makehuman/master/makehuman/data/3dobjs/base.obj
          mkdir -p "e2e/screenshots/${{ matrix.blender }}"
          /tmp/blender/blender -b --python-expr "import bpy; bpy.context.preferences.view.show_splash=False; bpy.ops.wm.save_userpref(); bpy.ops.wm.save_as_mainfile(filepath='/tmp/start_m.blend')"
          CJ_MENS_OBJ=/tmp/mh_base.obj timeout 400 xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            /tmp/blender/blender --gpu-backend opengl /tmp/start_m.blend --python e2e/scherm_mens.py -- "$PWD/e2e/screenshots/${{ matrix.blender }}" /tmp/click_joints_betaald.zip 2>&1 | tee /tmp/mens_s.log || true
          grep -q "MENS BEELD OK" /tmp/mens_s.log || { echo "FOUT: plaatje 19 mensfiguur"; exit 1; }
          for f in 19-mens-x.png 19-mens-paneel.png; do [ -s "e2e/screenshots/${{ matrix.blender }}/$f" ] || { echo "FOUT: $f ontbreekt"; exit 1; }; done
      - name: Schermafbeeldingen van het scharnier (betaalde zip, plaatjes 11 en 12)
        # Eis 8 van het scharnier: eigen stap en eigen lege mappen, zodat de gratis schermtest gelijk blijft.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          BLENDER_USER_RESOURCES: /tmp/cj_scherm
          BLENDER_USER_CONFIG: /tmp/cj_scherm/config
          BLENDER_USER_EXTENSIONS: /tmp/cj_scherm/extensions
        run: |
          [ -s /tmp/click_joints_betaald.zip ] || bash e2e/maak_zip.sh betaald
          /tmp/blender/blender -b --python-expr "import bpy; bpy.context.preferences.view.show_splash=False; bpy.ops.wm.save_userpref(); bpy.ops.wm.save_as_mainfile(filepath='/tmp/start_b.blend')"
          timeout 300 xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            /tmp/blender/blender --gpu-backend opengl /tmp/start_b.blend --python e2e/scherm_scharnier.py -- "$PWD/e2e/screenshots/${{ matrix.blender }}" /tmp/click_joints_betaald.zip 2>&1 | tee /tmp/scharnier.log || true
          grep -q "SCHARNIER OK pose" /tmp/scharnier.log || { echo "FOUT: plaatje 11 niet goed"; exit 1; }
          grep -q "SCHARNIER OK rood" /tmp/scharnier.log || { echo "FOUT: plaatje 12 niet goed"; exit 1; }
          for f in 11-scharnier-x.png 12-scharnier-rood-x.png; do [ -s "e2e/screenshots/${{ matrix.blender }}/$f" ] || { echo "FOUT: $f ontbreekt"; exit 1; }; done
      - name: Winkelplaatjes Pro (betaalde zip, houten knie, plaatjes 13 en 14)
        # Daan 10 nov 04:45: echt ding, groene band, eigen achtergrond, geen selectie, rood als vlak. Eigen stap en mappen.
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          BLENDER_USER_RESOURCES: /tmp/cj_pro
          BLENDER_USER_CONFIG: /tmp/cj_pro/config
          BLENDER_USER_EXTENSIONS: /tmp/cj_pro/extensions
        run: |
          [ -s /tmp/click_joints_betaald.zip ] || bash e2e/maak_zip.sh betaald
          /tmp/blender/blender -b --python-expr "import bpy; bpy.context.preferences.view.show_splash=False; bpy.ops.wm.save_userpref(); bpy.ops.wm.save_as_mainfile(filepath='/tmp/start_p.blend')"
          timeout 300 xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            /tmp/blender/blender --gpu-backend opengl /tmp/start_p.blend --python e2e/scherm_pro.py -- "$PWD/e2e/screenshots/${{ matrix.blender }}" /tmp/click_joints_betaald.zip 2>&1 | tee /tmp/pro.log || true
          grep "\[cj-scherm\] PRO" /tmp/pro.log || true
          grep -q "PRO OK schoon" /tmp/pro.log || { echo "FOUT: plaatje 13 schoon niet goed"; exit 1; }
          grep -q "PRO OK dicht" /tmp/pro.log || { echo "FOUT: plaatje 13d dichtbij niet goed"; exit 1; }
          grep -q "PRO OK pose" /tmp/pro.log || { echo "FOUT: plaatje 13 niet goed"; exit 1; }
          grep -q "PRO OK rood" /tmp/pro.log || { echo "FOUT: plaatje 14 niet goed"; exit 1; }
          for f in 13-pro-knie-schoon-x.png 13-pro-knie-x.png 14-pro-knie-rood-x.png pro-knie.json; do [ -s "e2e/screenshots/${{ matrix.blender }}/$f" ] || { echo "FOUT: $f ontbreekt"; exit 1; }; done
      # Beeldvergelijking (roestronde R4): elk plaatje naast dat van de vorige geslaagde run. Nooit rood.
      # Blender tekent zonder ruis (0 px verschil over 6 runs, zoeker E), dus een lage grens.
      - name: Beeldvergelijking met de vorige geslaagde run
        id: bv
        if: always()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          NAAM: ${{ inputs.week && 'week' || github.ref_name }}
        run: |
          B=organisatie/controle/beelden.sh
          if [ ! -f "$B" ]; then mkdir -p /tmp/bvs; for f in beelden.sh beeldvergelijk.py; do curl -fsSL --retry 3 -o "/tmp/bvs/$f" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/organisatie/controle/$f"; done; B=/tmp/bvs/beelden.sh; fi
          echo "B=$B" >> "$GITHUB_ENV"
          N=$(echo "$NAAM" | tr '/' '-')
          bash "$B" vergelijk "producten/blender-gewrichten/e2e/screenshots/${{ matrix.blender }}" "referentie/blender-gewrichten/$N/${{ matrix.blender }}" \
            /tmp/beeldverschil 0.02 "Click Joints, Blender ${{ matrix.blender }} ($N)" "blender-gewrichten/$N/${{ matrix.blender }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beeldverschil-blender-gewrichten-${{ matrix.blender }}
          path: /tmp/beeldverschil
          if-no-files-found: ignore
      - name: Referentiebeelden bijwerken (alleen als alles groen is)
        if: success()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          NAAM: ${{ inputs.week && 'week' || github.ref_name }}
        run: |
          N=$(echo "$NAAM" | tr '/' '-')
          bash "$B" bewaar "producten/blender-gewrichten/e2e/screenshots/${{ matrix.blender }}" "referentie/blender-gewrichten/$N/${{ matrix.blender }}" "blender-gewrichten $N ${{ matrix.blender }}"
      - name: Groot beeldverschil melden aan Bram (alleen main, geen rood)
        if: always() && steps.bv.outputs.groot != '' && steps.bv.outputs.groot != '0' && steps.bv.outputs.terugval != '1' && github.ref_name == 'main' && !inputs.week
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          {
            echo "## $(bash "$B" datum) NL, van de beeldvergelijking (automatisch): Click Joints, Blender ${{ matrix.blender }}"
            echo "${{ steps.bv.outputs.groot }} plaatje(s) wijken sterk af van de vorige geslaagde run (commit ${GITHUB_SHA::8}). Geen rode test: kijk of het zo bedoeld is."
            echo "Verschilbeelden (rood is anders): artefact beeldverschil-blender-gewrichten-${{ matrix.blender }} in https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            grep "| GROOT |" /tmp/beeldverschil/verslag.md | head -10 | sed 's/^/- /'
          } > /tmp/bericht.md
          bash "$B" bericht bram /tmp/bericht.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-gewrichten-screenshots-${{ matrix.blender }}
          path: producten/blender-gewrichten/e2e/screenshots
          if-no-files-found: warn
      - name: Schermafbeeldingen openbaar zetten (tak schermen)
        if: always()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          TAK: ${{ inputs.week && 'week' || github.ref_name }}
        run: |
          SRC="$GITHUB_WORKSPACE/producten/blender-gewrichten/e2e/screenshots"
          [ -d "$SRC" ] && [ -n "$(ls -A "$SRC")" ] || { echo "geen schermafbeeldingen"; exit 0; }
          NAAM=$(echo "$TAK" | tr '/' '-')
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            rm -rf /tmp/s
            # Alleen onze eigen map uitpakken: de tak schermen is groot (alle Steam-beelden), heel klonen duurde minuten.
            if git clone -q --depth 1 --filter=blob:none --sparse --branch schermen "$URL" /tmp/s 2>/dev/null; then
              git -C /tmp/s sparse-checkout set "blender-gewrichten/$NAAM/${{ matrix.blender }}"
            else
              mkdir /tmp/s && cd /tmp/s && git init -q -b schermen && git remote add origin "$URL" && cd - >/dev/null
            fi
            D="/tmp/s/blender-gewrichten/$NAAM/${{ matrix.blender }}"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC/${{ matrix.blender }}"/. "$D"/ 2>/dev/null || true
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd /tmp/s && git add -A && git commit -q -m "Schermen blender-gewrichten/$NAAM/${{ matrix.blender }} run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then cd - >/dev/null; break; fi
            cd - >/dev/null; git -C /tmp/s fetch -q origin schermen 2>/dev/null; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/blender-gewrichten/$NAAM"
