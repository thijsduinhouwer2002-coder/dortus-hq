name: Rollwright e2e (echte Obsidian)

on:
  push:
    branches: [main, "claude/obsidian-*"]
    paths: ["producten/obsidian-rollwright/**", ".github/workflows/rollwright-e2e.yml"]
  workflow_dispatch:
  # Week-test (roestronde R4): week-test.yml roept deze workflow aan met de nieuwste Obsidian en de nieuwste installer.
  workflow_call:
    inputs:
      obsidian:
        description: 'JSON-lijst van {"app": ..., "installer": ...}, bijvoorbeeld [{"app": "latest", "installer": "latest"}]'
        type: string
        required: false
      week:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Bij een push: app latest, installer earliest (zoals wdio.conf.mjs). De week-test geeft er meer mee.
        obsidian: ${{ fromJSON(inputs.obsidian || '[{"app":"latest","installer":"earliest"}]') }}
    env:
      OBSIDIAN_APP: ${{ matrix.obsidian.app }}
      OBSIDIAN_INSTALLER: ${{ matrix.obsidian.installer }}
      SUB: ${{ inputs.week && format('week/{0}-{1}', matrix.obsidian.app, matrix.obsidian.installer) || github.ref_name }}
    defaults:
      run:
        working-directory: producten/obsidian-rollwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm install
        working-directory: producten/obsidian-rollwright/e2e
      # Obsidian en chromedriver komen van github.com releases; die gaven 8 nov meerdere keren 504.
      # Cache: na één geslaagde download hoeft het niet meer. Opnieuw proberen alleen bij een mislukte download,
      # nooit bij een rode test.
      - uses: actions/cache/restore@v4
        with:
          path: producten/obsidian-rollwright/e2e/.obsidian-cache
          key: obsidian-${{ hashFiles('producten/obsidian-rollwright/e2e/wdio.conf.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.obsidian.installer }}
          restore-keys: obsidian-${{ hashFiles('producten/obsidian-rollwright/e2e/wdio.conf.mjs') }}-
      # Obsidian (installer en app) en chromedriver vooraf in de cache zetten, met tot acht pogingen en steeds langer wachten.
      # Op 8 nov gaf github.com voor obsidian-1.15.0.asar.gz drie keer op rij 504 binnen drie minuten; Daan kreeg
      # het binnen met acht pogingen (run 42468233258). Zelfde versies als wdio.conf.mjs: app latest, installer earliest.
      # Lukt het niet, dan gaat de stap toch door (de test zelf probeert het nog en meldt het dan duidelijk).
      - name: Obsidian en chromedriver vooraf downloaden (tot acht pogingen)
        working-directory: producten/obsidian-rollwright/e2e
        run: |
          cat > /tmp/vooraf.mjs <<'JS'
          import ObsidianLauncher from "obsidian-launcher";
          const l = new ObsidianLauncher({ cacheDir: process.cwd() + "/.obsidian-cache" });
          const [app, installer] = await l.resolveVersion(process.env.OBSIDIAN_APP || "latest", process.env.OBSIDIAN_INSTALLER || "earliest");
          console.log("OBSIDIAN VERSIE app", app, "installer", installer);
          console.log("installer", await l.downloadInstaller(installer));
          console.log("app", await l.downloadApp(app));
          console.log("chromedriver", await l.downloadChromedriver(installer));
          JS
          cp /tmp/vooraf.mjs ./vooraf.tmp.mjs
          for poging in 1 2 3 4 5 6 7 8; do
            if timeout 600 node ./vooraf.tmp.mjs; then
              echo "OBSIDIAN EN CHROMEDRIVER IN CACHE (poging $poging)"; rm -f ./vooraf.tmp.mjs; exit 0
            fi
            [ "$poging" -lt 8 ] && { echo "DOWNLOAD MISLUKT (poging $poging), over $((poging * 20)) s opnieuw"; sleep $((poging * 20)); }
          done
          rm -f ./vooraf.tmp.mjs
          echo "OBSIDIAN OF CHROMEDRIVER NIET BINNEN NA ACHT POGINGEN"
      - name: e2e (opnieuw alleen bij een mislukte download)
        working-directory: producten/obsidian-rollwright/e2e
        run: |
          for poging in 1 2 3; do
            set +e
            xvfb-run --auto-servernum npm run e2e 2>&1 | tee /tmp/e2e.log
            code=${PIPESTATUS[0]}
            set -e
            [ "$code" -eq 0 ] && exit 0
            if grep -q "Failed to download and setup Obsidian" /tmp/e2e.log; then
              echo "DOWNLOAD MISLUKT (poging $poging), over 60 s opnieuw"; sleep 60
            else
              exit "$code"
            fi
          done
          exit 1
      # Ook bewaren als de run rood is: wat wel binnenkwam (bijvoorbeeld Obsidian zonder chromedriver) hoeft de volgende keer niet opnieuw.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: producten/obsidian-rollwright/e2e/.obsidian-cache
          key: obsidian-${{ hashFiles('producten/obsidian-rollwright/e2e/wdio.conf.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.obsidian.installer }}
      # Beeldvergelijking (roestronde R4): elk plaatje naast dat van de vorige geslaagde run. Nooit rood.
      # De dobbelstenen hebben een vast zaad (wdio.conf.mjs). Wat elke run anders blijft: de willekeurige kluisnaam
      # (linksonder en in de titelbalk), animaties die half in beeld zijn (tot 0,36 procent) en de melding op m10
      # die nog binnenschuift (GEZIEN 19 nov, main tegen week in dezelfde commit), en de kloktijden in het logboek
      # op l1 (vals alarm 19 nov, run 44427731943; alleen de drie tijden, niet het hele paneel). Die tellen niet mee,
      # de grens is 0,4 procent.
      - name: Beeldvergelijking met de vorige geslaagde run
        id: bv
        if: always()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          B=organisatie/controle/beelden.sh
          if [ ! -f "$B" ]; then mkdir -p /tmp/bvs; for f in beelden.sh beeldvergelijk.py; do curl -fsSL --retry 3 -o "/tmp/bvs/$f" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/organisatie/controle/$f"; done; B=/tmp/bvs/beelden.sh; fi
          echo "B=$B" >> "$GITHUB_ENV"
          N=$(echo "$SUB" | tr '/' '-')
          echo "N=$N" >> "$GITHUB_ENV"
          bash "$B" vergelijk producten/obsidian-rollwright/e2e/screenshots "referentie/rollwright/$N" \
            /tmp/beeldverschil 0.4 "Rollwright, Obsidian $OBSIDIAN_APP met installer $OBSIDIAN_INSTALLER ($N)" "rollwright/$N" \
            "*:50,755,345,800;*:290,0,610,28;m10-*:880,28,1024,105;l1-*:845,126,930,150;l1-logboek.png:765,186,845,210;l1-logboek.png:765,270,845,294;l1-logboek-tekst.png:765,218,845,236;l1-logboek-tekst.png:765,288,845,306;l1-logboek-tekst.png:765,372,845,390"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beeldverschil-rollwright-${{ matrix.obsidian.app }}-${{ matrix.obsidian.installer }}
          path: /tmp/beeldverschil
          if-no-files-found: ignore
      - name: Referentiebeelden bijwerken (alleen als alles groen is)
        if: success()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: bash "$B" bewaar producten/obsidian-rollwright/e2e/screenshots "referentie/rollwright/$N" "rollwright $N"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollwright-screenshots${{ inputs.week && format('-{0}-{1}', matrix.obsidian.app, matrix.obsidian.installer) || '' }}
          path: producten/obsidian-rollwright/e2e/screenshots
          if-no-files-found: warn
      - name: Schermafbeeldingen openbaar zetten (tak schermen)
        if: always()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          TAK: ${{ github.ref_name }}
        run: |
          SRC="$GITHUB_WORKSPACE/producten/obsidian-rollwright/e2e/screenshots"
          # Week-test: eigen map, zodat de beelden van main blijven staan.
          [ "${SUB#week/}" != "$SUB" ] && TAK="$SUB"
          [ -d "$SRC" ] && [ -n "$(ls -A "$SRC")" ] || { echo "geen schermafbeeldingen"; exit 0; }
          NAAM=$(echo "$TAK" | tr '/' '-')
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            rm -rf /tmp/s
            # Alleen onze eigen map (zoals Click Joints): de hele tak schermen is 6,7 GB en kostte 12 tot 15 minuten.
            if git clone -q --depth 1 --filter=blob:none --sparse --branch schermen "$URL" /tmp/s 2>/dev/null; then
              git -C /tmp/s sparse-checkout set "rollwright/$NAAM"
            else
              mkdir /tmp/s && cd /tmp/s && git init -q -b schermen && git remote add origin "$URL" && cd - >/dev/null
            fi
            D="/tmp/s/rollwright/$NAAM"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd /tmp/s && git add -A && git commit -q -m "Schermen rollwright/$NAAM run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then cd - >/dev/null; break; fi
            cd - >/dev/null; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/rollwright/$NAAM"
          ls "$SRC"

  # Eén beeldbericht per run voor alle jobs samen, en niet opnieuw als hetzelfde verschil al gemeld is
  # (keuring R4: eerst kwam er een bericht per job en per run). Alleen main, niet in de week-test.
  beeldbericht:
    needs: e2e
    if: always() && github.ref_name == 'main' && !inputs.week
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: organisatie/controle
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: beeldverschil-rollwright*
          path: /tmp/bv
      - name: Beeldbericht aan Olaf (alleen bij een groot of leeg plaatje dat nog niet gemeld is)
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bv
          bash organisatie/controle/beelden.sh meld rollwright olaf /tmp/bv main
