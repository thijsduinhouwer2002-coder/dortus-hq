name: "Regisseur 22 (Spaanse tip: ball joint, opname regisseur-18)"

# Gemaakt met commercie/filmpjes/opname/nieuwe_tip.py uit regisseur-12.yml. Opname commercie/filmpjes/regisseur-22/tip_opname.py op de gedeelde hulpcode
# (opname/blender_opname.py). ElevenLabs-mp3 (tip-speling-elevenlabs.mp3) wordt vanzelf gebruikt, anders Kokoro. Niets geplaatst.

on:
  push:
    branches: [main]
    paths: ["commercie/filmpjes/regisseur-22/**", ".github/workflows/regisseur-22.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: regisseur-22
  KOKORO_STEM: em_alex
  KOKORO_TAAL: es
  KOKORO_SNELHEID: "1.0"
  WHISPER_TAAL: es
  KOKORO_URL: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1
  KOKORO_ONNX_SHA: beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a
  KOKORO_VOICES_SHA: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d

jobs:
  tips:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Systeempakketten (apt-snel van Olaf, gekeurd door Daan)
        uses: ./.github/actions/apt-snel
        with:
          pakketten: zip xvfb libgl1 libegl1 libgl1-mesa-dri libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 imagemagick xdotool ffmpeg fonts-inter tesseract-ocr
      - name: Ruwe opname van regisseur-18 (tip-speling) ophalen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/oud /tmp/pro
          gh release download regisseur-18 -R "$GITHUB_REPOSITORY" -p opname-tip.mkv -p film-tip.json -D /tmp/oud
          cp /tmp/oud/opname-tip.mkv /tmp/pro/opname-ruw.mkv; cp /tmp/oud/film-tip.json /tmp/pro/film.json
      - name: Eindbeeld uit de opname (tekst)
        run: |
          python3 - <<'PY'
          import json, subprocess
          f = json.load(open("/tmp/pro/film.json"))
          d = f["delen"]
          for naam, n in (("render-label.png", d["eind"] - 2),):
              subprocess.run(["ffmpeg", "-v", "error", "-y", "-i", "/tmp/pro/opname-ruw.mkv", "-vf",
                              f"select=eq(n\\,{n - 1}),crop=1100:1300:300:330", "-frames:v", "1", f"/tmp/pro/{naam}"], check=True)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stem-pakketten en Kokoro (sha256 vast)
        run: |
          python -m pip install -q kokoro-onnx==0.6.1 soundfile faster-whisper==1.2.1 numpy pillow
          mkdir -p /tmp/kokoro
          curl -fsSL --retry 3 -o /tmp/kokoro/kokoro-v1.0.onnx "$KOKORO_URL/kokoro-v1.0.onnx"
          curl -fsSL --retry 3 -o /tmp/kokoro/voices-v1.0.bin "$KOKORO_URL/voices-v1.0.bin"
          echo "$KOKORO_ONNX_SHA  /tmp/kokoro/kokoro-v1.0.onnx" | sha256sum -c
          echo "$KOKORO_VOICES_SHA  /tmp/kokoro/voices-v1.0.bin" | sha256sum -c
      - name: Montage (vorm groot)
        env:
          KOKORO_MODEL: /tmp/kokoro/kokoro-v1.0.onnx
          KOKORO_VOICES: /tmp/kokoro/voices-v1.0.bin
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
        run: |
          mkdir -p /tmp/klaar
          for n in tip-es-kogel; do
            if [ -f commercie/filmpjes/regisseur-22/$n-elevenlabs.mp3 ]; then export STEM_MP3=$PWD/commercie/filmpjes/regisseur-22/$n-elevenlabs.mp3 STEM_BRON=elevenlabs; else unset STEM_MP3 STEM_BRON; fi
            python commercie/filmpjes/regisseur-2/vul.py commercie/filmpjes/regisseur-22/$n.json /tmp/pro/film.json /tmp/$n.json
            rm -rf /tmp/klaar/zinnen
            python commercie/filmpjes/regisseur-2/montage2.py /tmp/$n.json /tmp/pro /tmp/klaar groot
            mv /tmp/klaar/$n-groot.mp4 /tmp/klaar/$n-geluid.mp4
            mv /tmp/klaar/overzicht-groot.jpg /tmp/klaar/overzicht-$n.jpg
          done
          rm -rf /tmp/klaar/zinnen
      - name: Controle (synchroon, geluid, lengte)
        env:
          WHISPER_MODEL: small
        run: |
          cd /tmp/klaar
          ok=0
          for n in tip-es-kogel; do
            mkdir -p meting-$n
            python $GITHUB_WORKSPACE/commercie/filmpjes/regisseur-2/synchroon2.py $n-geluid.mp4 $n-groot-script.json meting-$n || ok=1
            for f in meting-$n/*; do mv "$f" "$(basename ${f%.*})-$n.${f##*.}"; done
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $n-geluid.mp4)
            echo "$n $d s" | tee -a lengtes.txt
            python -c "import sys; d=float('$d'); sys.exit(0 if 40.0 <= d <= 60.0 else 1)" || { echo "FOUT: $n is $d s"; ok=1; }
          done
          python $GITHUB_WORKSPACE/organisatie/controle/geluid_check.py *.mp4 | tee geluid_check.txt
          grep -q "FOUT" geluid_check.txt && ok=1
          sha256sum *.mp4 | tee SHA256SUMS.txt
          exit $ok
      - name: In de release zetten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d /tmp/klaar ] || exit 1
          cd /tmp/klaar
          cp /tmp/pro/render-label.png . 2>/dev/null || true
          if [ "${{ steps.ruw.outputs.opnieuw }}" = "ja" ] && [ -s /tmp/pro/opname-ruw.mkv ]; then
            cp /tmp/pro/opname-ruw.mkv opname-tip.mkv; cp /tmp/pro/film.json film-tip.json
            echo "${{ steps.ruw.outputs.sha }}" > opname-sha.txt
          fi
          echo "Regisseur 22: Spaanse tip ball joint (opname regisseur-18). Concepten: marketing/wachtrij/. Niets geplaatst." > /tmp/notes.md
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Regisseur 22 (Spaanse tip ball joint)" --notes-file /tmp/notes.md
          ls -la
          gh release upload "$TAG" $(ls *.mp4 *.mkv *.json *.srt *.md *.txt *.jpg *.png 2>/dev/null) --clobber -R "$GITHUB_REPOSITORY"
