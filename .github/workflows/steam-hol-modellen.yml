name: Het Hol 3D-modellen (Blender naar Godot)

# Bram, 13 nov 2026 (besluit Thijs 13:35, ontwerp/steam/3d-stijl.md).
# Elk model in producten/steam-hol/modellen/ dat in producten/steam-hol/pijplijn/sprites.json staat wordt met
# Blender (pakket bpy 5.2.4, Cycles op de CPU) gerenderd tot beelden met doorzichtige achtergrond, strak bijgesneden,
# verkleind en als blad met import-instellingen (lineair, mipmaps) in producten/steam-hol/godot/kunst/3d/ gezet.
# Veranderd blad: commit terug op dezelfde tak en start daarna de Windows-run (steam-hol.yml), want een push
# met GITHUB_TOKEN start zelf geen nieuwe runs. Zo komt een nieuw model vanzelf in de echte Windows-build.
# Bram 15 nov: in delen. Een plan-job kiest wat opnieuw moet (vingerafdruk `bron`), elke sprite rendert in een eigen
# job tegelijk (ronde a), daarna de sprites die de maat van een ander nemen (ronde b, schaal_van), en de job `samen`
# zet alle bladen in een map en sprites.json, maakt het graafblad en commit. Was ±28 min na elkaar voor alles.
on:
  push:
    branches: [main, "claude/steam-*"]
    paths: ["producten/steam-hol/modellen/**", "producten/steam-hol/pijplijn/*.py", "producten/steam-hol/pijplijn/sprites.json", ".github/workflows/steam-hol-modellen.yml"]
  workflow_dispatch:
    inputs:
      sprites:
        description: "Welke sprites (leeg = alle uit sprites.json)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: steam-hol-modellen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      a: ${{ steps.plan.outputs.a }}
      b: ${{ steps.plan.outputs.b }}
      iets: ${{ steps.plan.outputs.iets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Wat moet opnieuw (render.py --plan)
        id: plan
        env:
          SPRITES: ${{ github.event.inputs.sprites }}   # invoer via env, nooit rechtstreeks in de shell (roestronde R2)
        run: |
          python -m pip install --quiet pillow
          cd producten/steam-hol/pijplijn
          read -ra S <<< "$SPRITES"
          python render.py --plan "${S[@]}"

  a:
    needs: plan
    if: needs.plan.outputs.a != '[]' && needs.plan.outputs.a != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        naam: ${{ fromJSON(needs.plan.outputs.a) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Blender als Python-pakket (bpy 5.2.4)
        run: python -m pip install --quiet bpy==5.2.4 pillow numpy
      - name: Renderen ${{ matrix.naam }}
        run: |
          cd producten/steam-hol/pijplijn
          BPY_PYTHON=python python render.py ${{ matrix.naam }}
          python samen.py pak ${{ matrix.naam }} /tmp/deel
      - uses: actions/upload-artifact@v4
        with:
          name: deel-${{ matrix.naam }}
          path: /tmp/deel/
          retention-days: 3

  b:
    needs: [plan, a]
    if: always() && needs.plan.outputs.b != '[]' && needs.plan.outputs.b != '' && (needs.a.result == 'success' || needs.a.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        naam: ${{ fromJSON(needs.plan.outputs.b) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bladen van ronde a
        uses: actions/download-artifact@v4
        with:
          pattern: deel-*
          path: /tmp/a
      - name: Moet ${{ matrix.naam }} opnieuw? (zonder Blender)
        id: nodig
        run: |
          python -m pip install --quiet pillow numpy
          cd producten/steam-hol/pijplijn
          # de nieuwe maten van ronde a (bv. eenheid_px van de ridder) eerst in sprites.json, dan pas de vingerafdruk
          if ls /tmp/a/*/ >/dev/null 2>&1; then python samen.py zet /tmp/a/*/; fi
          python samen.py nodig ${{ matrix.naam }}
      - name: Blender als Python-pakket (bpy 5.2.4)
        if: steps.nodig.outputs.nodig == 'ja'
        run: python -m pip install --quiet bpy==5.2.4
      - name: Renderen ${{ matrix.naam }} (alleen als de bron veranderde)
        if: steps.nodig.outputs.nodig == 'ja'
        run: |
          cd producten/steam-hol/pijplijn
          BPY_PYTHON=python python render.py --kan ${{ matrix.naam }}
      - name: Pakken ${{ matrix.naam }}
        run: |
          cd producten/steam-hol/pijplijn
          python samen.py pak ${{ matrix.naam }} /tmp/deel
      - uses: actions/upload-artifact@v4
        with:
          name: deelb-${{ matrix.naam }}
          path: /tmp/deel/
          retention-days: 3

  samen:
    needs: [plan, a, b]
    if: always() && needs.plan.outputs.iets == 'ja' && (needs.a.result == 'success' || needs.a.result == 'skipped') && (needs.b.result == 'success' || needs.b.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Alle delen
        uses: actions/download-artifact@v4
        with:
          pattern: deel*
          path: /tmp/delen
      - name: Bladen en sprites.json bij elkaar
        run: |
          python -m pip install --quiet pillow numpy
          cd producten/steam-hol/pijplijn
          # eerst ronde a, dan b (b kan dezelfde naam niet hebben, maar zo is de volgorde vast)
          A=$(ls -d /tmp/delen/deel-*/ 2>/dev/null || true); B=$(ls -d /tmp/delen/deelb-*/ 2>/dev/null || true)
          python samen.py zet $A $B
          cat ../godot/kunst/3d/sprites.json | head -c 4000
      - name: Graafmoment uit het nieuwe hol (Daan 14 nov, maak_graaf.py)
        run: |
          # Bram 14 nov: kunst/3d/graaf_3d.png komt uit het 3D-stuk aarde van hol_proef.png, dus na elke hol-render opnieuw
          python ontwerp/steam/graaf-3d/maak_graaf.py producten/steam-hol/godot/kunst/3d/hol_proef.png producten/steam-hol/godot/kunst/3d
      - name: Graafstippels als kiezeltjes (Bram 14 nov, maak_graafstip.py)
        run: |
          # Bram 14 nov 15:20: graafstip_3d.png leent bol() en klein() uit maak_graaf.py, dus mee na elke render
          python ontwerp/steam/graaf-3d/maak_graafstip.py producten/steam-hol/godot/kunst/3d
      - name: Om naar te kijken (vergroting en ware grootte)
        uses: actions/upload-artifact@v4
        with:
          name: steam-hol-3d
          path: |
            producten/steam-hol/pijplijn/uit/*-kijk.png
            producten/steam-hol/godot/kunst/3d/
      - name: Terug op de tak en de Windows-run starten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bram 13 nov 18:35: twee renders kort na elkaar op dezelfde tak botsten bij pull --rebase (zelfde bladen),
          # de push faalde stil. Nu: eigen bladen apart zetten, tak opnieuw ophalen, bladen erover, en falen als het niet lukt.
          D=producten/steam-hol/godot/kunst/3d
          rm -rf /tmp/bladen && cp -r "$D" /tmp/bladen
          git config user.name "dortus-pijplijn"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAK="${GITHUB_REF_NAME}"
          GELUKT=0
          for i in 1 2 3 4 5; do
            git fetch -q origin "$TAK" && git reset -q --hard FETCH_HEAD
            # Bram 14 nov 10:30: niet meer eerst wissen. Een render vanaf een oudere commit (zonder de stap van maak_graaf)
            # wiste zo graaf_3d.png op main (a7568e9). Nu alleen overschrijven en toevoegen; weghalen doe je met de hand.
            cp -r /tmp/bladen/. "$D"/
            git add "$D"
            if git diff --cached --quiet; then echo "Bladen gelijk aan de tak, niets te doen."; exit 0; fi
            git commit -q -m "Pijplijn: 3D-bladen opnieuw gerenderd (${GITHUB_SHA::7})"
            if git push -q origin "HEAD:$TAK"; then GELUKT=1; break; fi
            sleep $((i * 5))
          done
          git ls-remote origin "$TAK"
          if [ "$GELUKT" != 1 ]; then echo "FOUT: bladen niet op de tak gekregen"; exit 1; fi
          gh workflow run steam-hol.yml --ref "$TAK" && echo "Windows-run gestart op $TAK"
