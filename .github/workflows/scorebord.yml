name: Scorebord (elke dag 06:41 UTC)

# Vera, 16 nov 2026, opdracht hoofdchat 16 nov 17:05. Meet per product de openbare cijfers met
# organisatie/controle/scorebord.py, schrijft organisatie/scorebord.md en scorebord-data.csv,
# draait de controle voor de openbare repo en commit naar main. Openbare bronnen, niet inloggen;
# sinds 16 nov ook bezoekers van dortus.com uit Amami met de leessleutel AMAMI_API_KEY; sinds 18 nov (R6)
# ook Gumroad, Kit, Discord en YouTube (organisatie/controle/scorebord_bronnen.py); sinds 23 nov (Meter) ook
# TikTok-weergaven, herkomst per Gumroad-verkoop (/v2/sales) en organisatie/meten/dag.csv.
# Sinds 24 nov (Bram): kortingscodes per Gumroad-product (/v2/products/:id/offer_codes, alleen lezen).
on:
  schedule:
    - cron: "41 6 * * *"  # 06:41 UTC: GitHub stelt runs op :00 vaak uit of slaat ze over (17 nov 07:00 kwam niet)
  workflow_dispatch:
  # Roestronde R7 (19 nov): GitHub laat geplande runs hier vallen (1 geplande run ooit), daarom ook bij elke push
  # naar main. De job klok (organisatie/controle/klok.py) laat hem één keer per dag na 06:30 UTC meten, en altijd
  # als de push de scorebordbestanden raakt (het oude paths-filter) of bij een handmatige start.
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  klok:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      beurt: ${{ steps.klok.outputs.beurt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: organisatie/controle
      - id: klok
        run: python3 -I organisatie/controle/klok.py scorebord 1d-na-06:30UTC --paden ".github/workflows/scorebord.yml,organisatie/controle/scorebord*.py"

  meet:
    needs: klok
    if: needs.klok.outputs.beurt == 'ja'
    concurrency:
      group: scorebord
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none   # geschiedenis zonder alle oude bestanden (repo is 1,2 GB)
      - name: Meten, controleren en naar main
        env:
          # alleen deze stap ziet de sleutel; het script print hem nooit (16 nov 20:35, hoofdchat)
          AMAMI_API_KEY: ${{ secrets.AMAMI_API_KEY }}
          # roestronde R6 (18 nov): Gumroad en Kit alleen lezen, alleen aantallen. Discord alleen via de
          # openbare uitnodigingscode; de webhook hoort hier niet (keuring R6, 19 nov).
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          HATS_DISCORD_INVITE: ${{ vars.HATS_DISCORD_INVITE }}
        # Elke poging begint op de nieuwste main en meet opnieuw, zodat er nooit een rebase-conflict
        # op scorebord.md of de csv kan ontstaan (controleur 16 nov, punt M2).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 organisatie/controle/scorebord.py
            # Meter 23 nov: herkomst per Gumroad-verkoop (zonder persoonsgegevens) en één regel per bron per dag
            git add organisatie/scorebord.md organisatie/scorebord-data.csv organisatie/meten
            if git diff --cached --quiet; then echo "niets nieuw"; exit 0; fi
            git commit -q -m "Scorebord $(date -u +%F) (workflow Scorebord, run ${GITHUB_RUN_ID})"
            python3 organisatie/controle/check.py HEAD~1 HEAD
            if git push -q origin HEAD:main; then echo "gepusht"; exit 0; fi
            sleep $((poging * 5))
          done
          echo "push niet gelukt"; exit 1
