name: Het Hol winkelbeelden (1920 breed, Mila)

# Mila, 10 nov 2026. Opnames voor de schermafbeeldingen en de trailer op de winkelpagina (Daan keuring 6, moet 1):
# de strook over de hele breedte van een scherm van 1920 x 1080, zoals een koper hem krijgt.
# Raakt de gewone test van Olaf (steam-hol.yml) niet. Losse PNG's (met doorzichtige lucht) op de tak schermen,
# map steam-hol/winkel-1920-<soort>-<hoogte>/ (demo of week); met een zaad -zaad<zaad>-run<run-id> erachter.
on:
  workflow_dispatch:
    inputs:
      soort:
        description: "demo (de film van een minuut) of week (een hol na ±een week spelen, uit een save)"
        default: "week"
      hoogte:
        description: "hoogte van de strook in px (96 tot 160)"
        default: "120"
      zaad:
        description: "vast zaad voor de volgorde van heldsoorten in het echte bureaublad (leeg = de klok); Olaf 15 nov"
        default: ""
      drukte:
        description: "1 = bij week elke 5 tot 8 s een held, zodat er vaak drie tegelijk in beeld zijn (Mila 16 nov, punt 3); 0 = het gewone ritme"
        default: "1"
      moment:
        description: "leeg, hap, val of munt: het spel staat stil op het winkelmoment (Brams moment=, scherm 2 en 3; Olaf 15 nov). Werkt pas als claude/steam-hol-moment op main staat"
        default: ""
      werkvenster:
        description: "1 = een groot Kladblok-venster met nepwerk boven de strook in plaats van het kleine briefje (scherm 5, Sanne 21 nov); 0 = het kleine briefje"
        default: "0"
      schermmaat:
        description: "1280 = het echte bureaublad op 1280 x 720 (zoals tot nu); 1920 = op 1920 x 1080, niet opgeschaald (Valve: schermen minstens 1920 x 1080; Sanne en Iris 21 nov)"
        default: "1280"
      kladblok:
        description: "vol = het werkvenster tot 40 px van de rechterrand (zoals tot nu); smal = 760 breed (maal 1,5 bij 1920) en grotere letters, zodat rechts het bureaublad te zien is (kan 1 Daan 21 nov 23:55)"
        default: "vol"
  push:
    branches: [main]
    paths: [".github/workflows/steam-hol-winkel.yml"]

permissions:
  contents: write

jobs:
  winkel:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SOORT: ${{ inputs.soort || 'week' }}
      HOOGTE: ${{ inputs.hoogte || '160' }}
      ZAAD: ${{ inputs.zaad || '' }}
      MOMENT: ${{ inputs.moment || '' }}
      DRUKTE: ${{ inputs.drukte || '1' }}
      WERKVENSTER: ${{ inputs.werkvenster || '0' }}
      SCHERMMAAT: ${{ inputs.schermmaat || '1280' }}
      KLADBLOK: ${{ inputs.kladblok || 'vol' }}
    steps:
      - uses: actions/checkout@v4
      # Olaf 15 nov (kan 1 Daan 04:45): virtuele geluidskaart, zodat de luidspreker in het systeemvak geen kruisje
      # heeft zoals bij een gewone speler. Mag mislukken: dan blijft het kruisje en gaat de opname gewoon door.
      - name: Virtuele geluidskaart (Scream)
        continue-on-error: true
        uses: LABSN/sound-ci-helpers@v1
      - name: Scherm op 1920 x 1080
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Output "Set-DisplayResolution: $_" }
          Start-Sleep 3
          Add-Type -AssemblyName System.Windows.Forms
          Write-Output "SCHERM $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
      - name: Godot 4.3 downloaden
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
      - name: Importeren
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64_console.exe" -ArgumentList "--headless --path producten/steam-hol/godot --import" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force }
      - name: Bureaublad met de strook (echt, ter vergelijking)
        if: env.SOORT == 'demo'
        shell: pwsh
        run: |
          $uit = "producten/steam-hol/e2e/winkel"
          New-Item -ItemType Directory -Force $uit | Out-Null
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
            -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle -- hoogte=120 demo=1 vers=1 duur=40" -PassThru
          Start-Sleep 30
          & producten/steam-hol/e2e/scherm.ps1 "$uit/bureaublad-echt.png"
          $p.WaitForExit(30000) | Out-Null
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
      - name: Save van een hol na een week (alleen bij week)
        if: env.SOORT == 'week'
        shell: pwsh
        run: |
          # Een echte save in het formaat van kern/opslag.gd (versie 3). Lang gang, vijf kamers, vier stekelputten,
          # (Olaf 14 nov: opslag.gd schuift het hol naar het tekstvak; op 1280 bij 160 blijven de putten van 19 en 24 over),
          # 320 opgegeten hoeden (berg maat 4: na ±15 uur open, Sanne 21:50), Royal Gloop en Deep Pit gekocht.
          # 'tijd' 3 uur geleden, zodat het spel bij openen vertelt wat er gebeurde terwijl je weg was.
          $dir = Join-Path $env:APPDATA "Dortus/Het Hol"   # project.godot: use_custom_user_dir (demo-einde, 13 nov)
          New-Item -ItemType Directory -Force $dir | Out-Null
          $gang = @(); $boven = @()
          for ($i = 0; $i -lt 40; $i++) { $gang += ($i -ge 1 -and $i -le 29); $boven += ($i -in 4,5,9,10,15,16,21,22) }
          $r = New-Object System.Random 11
          $hoeden = @(4, 8, 6, 2); for ($i = 0; $i -lt 316; $i++) { $hoeden += $r.Next(0, 10) }
          $nu = [int][double]::Parse((Get-Date -UFormat %s))
          $data = [ordered]@{ versie = 3; tijd = $nu - 10800; gang = $gang; boven = $boven; eerste_held_gedaan = $true
            vallen = @{ "7" = "stekelput"; "13" = "stekelput"; "19" = "stekelput"; "24" = "stekelput" }; ingang_kol = 2; schat_kol = 29
            gevallen_namen = @{ "Kees" = 1; "Odo" = 1; "Mara" = 1 }; goud = 240; terugkomers = @(); kroniek = @()
            begin_gedaan = @("vallen", "vluchten", "opgegeten", "terug", "doorlopen"); begin_vlucht = ""; helden_nr = 340; lied_helden = 0
            pensioen_namen = @(); slijm = @{ hoeden = $hoeden; gegeten = 320; gespuugd = 0; keer_plat = 12 }
            upgrades = @{ slijm = 3; stekelput = 2 } }
          $data | ConvertTo-Json -Depth 5 -Compress | Set-Content -Encoding utf8NoBOM (Join-Path $dir "hol.json")
          Get-Content (Join-Path $dir "hol.json") | Select-Object -First 1
      - name: Film op 1920 breed, elk 5e beeld bewaard
        shell: pwsh
        run: |
          $uit = "producten/steam-hol/e2e/winkel"
          New-Item -ItemType Directory -Force $uit | Out-Null
          $film = "$((Resolve-Path $uit).Path)/f"
          New-Item -ItemType Directory -Force $film | Out-Null
          $log = ($film -replace '\\','/') + "/film.log"
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
            -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle --write-movie `"$film/f.png`" --fixed-fps 15 --quit-after $(if ($env:MOMENT) { 2700 } elseif ($env:SOORT -eq 'week') { 1350 } else { 1125 }) -- hoogte=$env:HOOGTE $(if ($env:SOORT -eq 'week') { 'demo=0 vers=0' } else { 'demo=1 vers=1' }) film=1 log=$log $(if ($env:MOMENT) { "moment=$env:MOMENT" }) $(if ($env:SOORT -eq 'week' -and $env:DRUKTE -eq '1' -and -not $env:MOMENT) { 'drukte=1' })" -PassThru
          if (-not $p.WaitForExit(900000)) { Stop-Process -Id $p.Id -Force }
          Get-Content $log -ErrorAction SilentlyContinue
          $alle = Get-ChildItem $film -Filter "f*.png" | Sort-Object Name
          Write-Output "beelden: $($alle.Count)"
          New-Item -ItemType Directory -Force "$uit/los" | Out-Null
          $i = 0
          # Bram 15 nov: met moment= 180 s film (de eerste val of hap met hoed komt in een week-hol vaak pas na 90 s),
          # dan elk 10e beeld, zodat er even veel beelden op de tak komen als nu.
          $stap = $(if ($env:MOMENT) { 10 } else { 5 })
          foreach ($b in $alle) { if ($i % $stap -eq 0) { Copy-Item $b.FullName "$uit/los/$($b.Name)" }; $i++ }
          Remove-Item $film -Recurse -Force
      - name: Echt bureaublad op 1280 x 720 (of 1920 x 1080 met schermmaat=1920) met de echte taakbalk (alleen bij week)
        if: env.SOORT == 'week'
        shell: pwsh
        run: |
          # Olaf 14 nov (kan van Daan bij scherm 2): Rusty's toont een echt bureaublad met taakbalk. Hier geen
          # nagemaakte taakbalk: de runner zelf op 1920 x 1080, Kladblok erachter, het spel met de week-save
          # (de film hierboven speelde er al ±90 s op door), en elke 15 s een schermafbeelding van het hele scherm.
          # Olaf 14 nov 21:40 (wens Mila 20:55, kan Daan 20:50): 1280 x 720 in plaats van 1920 x 1080, zodat de strook
          # van 160 px 22% van het beeld is en op een kleine winkelplaat leest; Mila vergroot zelf naar 1920 x 1080.
          # Kladblok klein linksboven (420 x 170, kan Mila 15 nov 02:50: trok op 600 breed meer aandacht dan het spel) en de snelkoppelingen van de runner (R, Unity Hub) van het bureaublad.
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class Scherm {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll")] public static extern bool EnumDisplaySettings(string n, int m, ref DEVMODE d);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE d, int f);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int b, int hg, bool r);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);
            [DllImport("user32.dll")] public static extern IntPtr FindWindow(string c, string n);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc p, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr h, System.Text.StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint p);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            public static IntPtr[] Zichtbaar() {
              var l = new System.Collections.Generic.List<IntPtr>();
              EnumWindows((h, x) => { if (IsWindowVisible(h)) l.Add(h); return true; }, IntPtr.Zero);
              return l.ToArray();
            }
            public static string Titel(IntPtr h) { var s = new System.Text.StringBuilder(256); GetWindowText(h, s, 256); return s.ToString(); }
            public static string Klasse(IntPtr h) { var s = new System.Text.StringBuilder(256); GetClassName(h, s, 256); return s.ToString(); }
            public static uint Proces(IntPtr h) { uint p; GetWindowThreadProcessId(h, out p); return p; }
            public static int Zet(int b, int h) {
              DEVMODE d = new DEVMODE(); d.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
              EnumDisplaySettings(null, -1, ref d);
              d.dmPelsWidth = b; d.dmPelsHeight = h; d.dmFields = 0x80000 | 0x100000;
              return ChangeDisplaySettings(ref d, 0);
            }
          }
          "@
          # Olaf 21 nov (Sanne 21:45, Iris 22:50): met schermmaat=1920 blijft het scherm op 1920 x 1080, niet opgeschaald.
          # Valve vraagt schermen van minstens 1920 x 1080 (DERDEN, partner.steamgames.com/doc/store/assets/standard).
          # De strook kan in het spel hooguit 160 (kern/strook.gd: 96 tot 160); 240 naar verhouding kan dus niet.
          $sb = $(if ($env:SCHERMMAAT -eq '1920') { 1920 } else { 1280 }); $sh = $(if ($sb -eq 1920) { 1080 } else { 720 })
          $sf = $sb / 1280.0
          $r = [Scherm]::Zet($sb, $sh)
          Start-Sleep 3
          Add-Type -AssemblyName System.Windows.Forms
          $s = [System.Windows.Forms.Screen]::PrimaryScreen
          Write-Output "ChangeDisplaySettings gaf $r (0 = gelukt); scherm $($s.Bounds), werkgebied $($s.WorkingArea)"
          if ($s.Bounds.Width -ne $sb) { Write-Output "== SCHERMMAAT NIET GEZET, geen bureaubladbeelden"; exit 0 }
          $uit = "producten/steam-hol/e2e/winkel/bureaublad"
          New-Item -ItemType Directory -Force $uit | Out-Null
          $vol = (Resolve-Path $uit).Path
          # Eerst alles van de runner wegklappen (zijn eigen terminalvenster stond in beeld, run 43631337323),
          # dan Kladblok met een kort briefje, zodat het leest als een gewone werkdag.
          # Olaf 15 nov 04:30 (moet Daan 03:45, voorstel 03:55): de taakbalk verraadde een testmachine (2:49 AM,
          # servericoon met rood bolletje, doorgestreepte luidspreker). Klok op een werktijd (10:40, loopt daarna
          # gewoon door), tijdsynchronisatie uit zodat hij niet terugspringt; icoontjes in het overloopmenu
          # (EnableAutoTray) en de systeemicoontjes netwerk en volume verborgen (HideSCANetwork, HideSCAVolume),
          # dan Explorer opnieuw starten zodat de taakbalk het overneemt. Datum blijft staan. Niets achteraf bijgetekend.
          Set-TimeZone -Id "W. Europe Standard Time" -ErrorAction SilentlyContinue
          Set-Service w32time -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service w32time -Force -ErrorAction SilentlyContinue
          $voor = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          # Olaf 15 nov 11:30: alleen vooruit zetten. Na 10:40 (run 43708302242, 12:21 daar) zette dit de klok 6075 s
          # terug; de host zette hem daarna weer op de echte tijd (taakbalk 12:23 PM), terwijl de save wel terug was
          # geschoven, dus 6127 s "weg geweest", meer goud en andere helden met hetzelfde zaad. Nu: is het al na 10:40,
          # dan 10:40 van morgen. Vooruit zetten bleef in eerdere runs gewoon staan (klok 10:42 in de beelden).
          $doel = (Get-Date).Date.AddHours(10).AddMinutes(40)
          if ($doel -le (Get-Date)) { $doel = $doel.AddDays(1) }
          Set-Date -Date $doel | Out-Null
          $schuif = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $voor
          Write-Output "klok gezet: $(Get-Date -Format 'yyyy-MM-dd HH:mm') ($((Get-TimeZone).Id)), verschoven $schuif s"
          # de save (kern/opslag.gd, sleutel "tijd") schuift even ver mee, anders telt het spel de sprong als weg geweest
          # (vooruit: extra goud en helden in beeld; achteruit houdt opslag.gd de oude tijd vast). Zo blijft het hol gelijk.
          $sv = Join-Path $env:APPDATA "Dortus/Het Hol/hol.json"
          if (Test-Path $sv) {
            $tekst = Get-Content $sv -Raw
            $m = [regex]::Match($tekst, '"tijd":\s*(\d+)')
            if ($m.Success) {
              $oud = [long]$m.Groups[1].Value
              $tekst = $tekst.Substring(0, $m.Groups[1].Index) + ($oud + $schuif) + $tekst.Substring($m.Groups[1].Index + $m.Groups[1].Length)
              [System.IO.File]::WriteAllText($sv, $tekst)   # UTF-8 zonder BOM; Set-Content -Encoding gaf hier een fout (run 43676289503)
              Write-Output "save tijd $oud -> $($oud + $schuif)"
            } else { Write-Output "save zonder tijd gevonden, niets geschoven" }
          }
          # Olaf 15 nov 19:40 (wens Daan 18:50, proef blind 8 tegen 6): geen blauwe Windows-bloem maar een effen donkere
          # achtergrond 2c3440 (44 52 64), zoals een gebruiker die zelf kiest. Register voor Explorer, SetSysColors en
          # SystemParametersInfo voor nu meteen. We tekenen niets bij: dit is de instelling van de machine.
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class Achtergrond {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern bool SystemParametersInfo(uint a, uint b, string c, uint d);
            [DllImport("user32.dll")] public static extern bool SetSysColors(int n, int[] e, int[] k);
          }
          "@
          Set-ItemProperty "HKCU:\Control Panel\Colors" Background "44 52 64" -ErrorAction SilentlyContinue
          Set-ItemProperty "HKCU:\Control Panel\Desktop" WallPaper "" -ErrorAction SilentlyContinue
          $kleur = 44 + (52 * 256) + (64 * 65536)   # COLORREF is 0x00BBGGRR
          $a1 = [Achtergrond]::SetSysColors(1, @(1), @($kleur))   # 1 = COLOR_DESKTOP
          $a2 = [Achtergrond]::SystemParametersInfo(0x14, 0, "", 3)   # SPI_SETDESKWALLPAPER, leeg = geen foto; bijwerken en melden
          Write-Output "achtergrond: SetSysColors $a1, geen foto $a2, register $((Get-ItemProperty 'HKCU:\Control Panel\Colors').Background)"
          Set-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer" EnableAutoTray 1 -Type DWord -ErrorAction SilentlyContinue
          $pol = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer"
          if (-not (Test-Path $pol)) { New-Item -Path $pol -Force | Out-Null }
          foreach ($n in @("HideSCANetwork", "HideSCAVolume")) { Set-ItemProperty $pol $n 1 -Type DWord -ErrorAction SilentlyContinue }
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          for ($w = 0; $w -lt 15 -and -not (Get-Process explorer -ErrorAction SilentlyContinue); $w++) { Start-Sleep 1 }
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) { Start-Process explorer.exe; Write-Output "explorer zelf gestart" }
          Start-Sleep 6
          Write-Output "systeemvak: EnableAutoTray $((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer' -ErrorAction SilentlyContinue).EnableAutoTray), explorer draait: $([bool](Get-Process explorer -ErrorAction SilentlyContinue))"
          (New-Object -ComObject Shell.Application).MinimizeAll()
          $weg = Join-Path $env:RUNNER_TEMP "snelkoppelingen"; New-Item -ItemType Directory -Force $weg | Out-Null
          foreach ($bd in @("$env:PUBLIC\Desktop", [Environment]::GetFolderPath("Desktop"))) {
            Get-ChildItem -Path "$bd\*" -Include *.lnk, *.url -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "snelkoppeling weg: $($_.Name)"; Move-Item $_.FullName $weg -Force -ErrorAction SilentlyContinue }
          }
          Start-Sleep 2
          $briefje = Join-Path $env:RUNNER_TEMP "notes.txt"
          # Olaf 15 nov: briefje op 4 regels zonder lege regel en Kladblok 196 hoog (186 gaf nog een smalle schuifbalk, kan 2 Daan 04:45) (op 420 x 170 viel het af na regel 4, met schuifbalk; runs 43669366909 en 43671848393)
          Set-Content -Encoding utf8 $briefje "Monday`r`n- reply to Sam about the draft`r`n- slides for the 2 pm call`r`n- lunch with Noor"
          # Olaf 21 nov (Sanne 18:55, scherm 5 "naast echt werk"): met werkvenster=1 een groot Kladblok met een nep-begroting
          # (geen namen), van boven tot net boven de strook, zodat je ziet dat het spel onder gewoon werk doorleeft.
          if ($env:WERKVENSTER -eq '1') {
            $briefje = Join-Path $env:RUNNER_TEMP "Q4 budget draft.txt"
            $regels = @(
              "Q4 budget draft (v3)", "",
              "Item                      Oct      Nov      Dec    Total",
              "--------------------------------------------------------",
              "Office rent              1,850    1,850    1,850    5,550",
              "Software licences          420      420      460    1,300",
              "Printing                    85      120       60      265",
              "Travel                     310      180      540    1,030",
              "Team lunch                  95       95      240      430",
              "Coffee machine lease        40       40       40      120",
              "--------------------------------------------------------",
              "Total                    2,800    2,705    3,190    8,695", "",
              "Notes",
              "- check travel for December, seems high",
              "- licences go up 40 in Dec (new seat)",
              "- send to finance before Friday",
              "- ask about the printer contract")
            Set-Content -Encoding utf8 $briefje ($regels -join "`r`n")
          }
          # Olaf 22 nov (kan 1 Daan 23:55): met kladblok=smal grotere letters in Kladblok (16 pt bij 1920, 10,5 pt bij 1280), via de vaste plek in het register.
          if ($env:WERKVENSTER -eq '1' -and $env:KLADBLOK -eq 'smal') {
            New-Item -Path "HKCU:\Software\Microsoft\Notepad" -Force | Out-Null
            Set-ItemProperty -Path "HKCU:\Software\Microsoft\Notepad" -Name iPointSize -Type DWord -Value ([int](110 * $sf - 5))
            Set-ItemProperty -Path "HKCU:\Software\Microsoft\Notepad" -Name lfFaceName -Type String -Value "Consolas"
            Write-Output "Kladblok letters: $([int](110 * $sf - 5)) tienden pt"
          }
          $kl = Start-Process notepad.exe -ArgumentList "`"$briefje`"" -PassThru
          Start-Sleep 3
          $h = [IntPtr]::Zero
          for ($w = 0; $w -lt 10 -and $h -eq [IntPtr]::Zero; $w++) { $h = (Get-Process notepad -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0 | Select-Object -First 1).MainWindowHandle; if (-not $h) { $h = [IntPtr]::Zero; Start-Sleep 1 } }
          [Scherm]::ShowWindow($h, 9) | Out-Null
          if ($env:WERKVENSTER -eq '1') {
            $wg = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
            # Olaf 21 nov: bij schermmaat=1920 alles maal 1,5 (x 135, boven 24, rechts 60, ruimte boven de strook 15), Iris 22:50.
            $wx = [int](90 * $sf); $wy = [int](16 * $sf); $wr = [int](40 * $sf); $wo = [int](10 * $sf)
            $vh = $wg.Height - [int]$env:HOOGTE - $wy - $wo
            # Olaf 21 nov (Sanne 20:50, kan Daan 19:40): links vanaf x 90, zodat het label "Recycle Bin" vrij staat; rechterrand blijft op 40 van de rand.
            $wb = $wg.Width - $wx - $wr
            # Olaf 22 nov (kan 1 Daan 23:55): smal = 760 breed (1140 bij 1920), rechts blijft bureaublad zichtbaar.
            if ($env:KLADBLOK -eq 'smal') { $wb = [Math]::Min($wb, [int](760 * $sf)) }
            $gezet = [Scherm]::MoveWindow($h, $wx, $wy, $wb, $vh, $true)
            Write-Output "werkvenster groot: $wx,$wy $wb x $vh (werkgebied $wg, strook $env:HOOGTE, kladblok $env:KLADBLOK)"
          } else {
            $gezet = [Scherm]::MoveWindow($h, 110, 24, 420, 196, $true)
          }
          # de runner laat bij de start een melding "System Properties" (tijdelijk wisselbestand) staan (run 43642948819).
          # Olaf 15 nov 03:30: FindWindow(null, "System Properties") vond hem in run 43669366909 niet, terwijl hij in alle
          # 18 beelden stond. Nu: alle zichtbare vensters loggen (titel, klasse, proces) en elk venster met "System
          # Properties" in de titel op vier manieren dicht: WM_COMMAND IDOK, WM_CLOSE, voorgrond plus Enter (alleen als
          # hij echt voorgrond is, anders komt de Enter in Kladblok), en als laatste het proces stoppen (nooit explorer).
          function Vensters($wat) {
            foreach ($v in [Scherm]::Zichtbaar()) {
              $t = [Scherm]::Titel($v); if (-not $t) { continue }
              $pv = [Scherm]::Proces($v); $pn = (Get-Process -Id $pv -ErrorAction SilentlyContinue).ProcessName
              Write-Output "venster ($wat): '$t' klasse $([Scherm]::Klasse($v)) proces $pn ($pv)"
            }
          }
          function Dicht-Melding($wat) {
            # Olaf 15 nov 05:35 (run 43680490584): de melding is het proces SystemPropertiesPerformance. WM_CLOSE sloot
            # "System Properties", maar hetzelfde proces liet daarna "Performance Options" zien (achter Kladblok in beeld).
            # Dus eerst elk proces SystemProperties* stoppen; het is een los hulpprogramma, nooit explorer.
            foreach ($sp in @(Get-Process -Name "SystemProperties*" -ErrorAction SilentlyContinue)) {
              Stop-Process -Id $sp.Id -Force -ErrorAction SilentlyContinue
              Write-Output "melding ($wat): proces $($sp.ProcessName) ($($sp.Id)) gestopt"
            }
            foreach ($v in [Scherm]::Zichtbaar()) {
              $t = [Scherm]::Titel($v)
              $pv = [Scherm]::Proces($v); $pn = (Get-Process -Id $pv -ErrorAction SilentlyContinue).ProcessName
              # Daan 15 nov 05:45: na WM_CLOSE op "System Properties" bleef hetzelfde proces staan met "Performance Options"
              # (run 43680490584 en 43680432181, in alle beelden achter Kladblok). Daarom ook op procesnaam SystemProperties*.
              if ($t -notlike "*System Properties*" -and $t -notlike "*Systeemeigenschappen*" -and $t -notlike "*Performance Options*" -and $t -notlike "*Prestatieopties*" -and $t -notlike "*Virtual Memory*" -and $pn -notlike "SystemProperties*") { continue }
              [Scherm]::PostMessage($v, 0x0111, [IntPtr]1, [IntPtr]::Zero) | Out-Null; Start-Sleep -Milliseconds 500; $hoe = "IDOK"
              if ([Scherm]::IsWindowVisible($v)) { [Scherm]::PostMessage($v, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null; Start-Sleep -Milliseconds 500; $hoe = "WM_CLOSE" }
              if ([Scherm]::IsWindowVisible($v)) {
                [Scherm]::SetForegroundWindow($v) | Out-Null; Start-Sleep -Milliseconds 300
                if ([Scherm]::GetForegroundWindow() -eq $v) { [System.Windows.Forms.SendKeys]::SendWait("{ENTER}"); Start-Sleep -Milliseconds 500; $hoe = "Enter" }
              }
              if ([Scherm]::IsWindowVisible($v) -and $pn -and $pn -notin @("explorer", "csrss", "winlogon", "dwm", "svchost", "pwsh", "powershell", "notepad")) {
                Stop-Process -Id $pv -Force -ErrorAction SilentlyContinue; Start-Sleep -Milliseconds 500; $hoe = "proces $pn gestopt"
              }
              Write-Output "melding '$t' ($wat, proces $pn): laatste stap $hoe, nog zichtbaar: $([Scherm]::IsWindowVisible($v))"
            }
          }
          Vensters "start"
          Dicht-Melding "start"
          Start-Sleep 1
          Dicht-Melding "start 2"
          Get-Process SystemProperties* -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "proces $($_.ProcessName) ($($_.Id)) nog over, gestopt"; Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          # Olaf 15 nov 07:40 (kan Daan 06:45): het venster van de runner zelf (WindowsTerminal met hosted-compute-agent,
          # run 43684845585) stond als knop met streepje in de taakbalk. Alleen verbergen (SW_HIDE), nooit stoppen:
          # dat proces is de runner. Een verborgen venster heeft geen taakbalkknop meer.
          foreach ($v in [Scherm]::Zichtbaar()) {
            $pv = [Scherm]::Proces($v); $pn = (Get-Process -Id $pv -ErrorAction SilentlyContinue).ProcessName
            if ($pn -eq "WindowsTerminal" -or [Scherm]::Klasse($v) -eq "CASCADIA_HOSTING_WINDOW_CLASS" -or [Scherm]::Klasse($v) -eq "ConsoleWindowClass") {
              [Scherm]::ShowWindow($v, 0) | Out-Null
              Write-Output "runnervenster verborgen: '$([Scherm]::Titel($v))' proces $pn, nog zichtbaar: $([Scherm]::IsWindowVisible($v))"
            }
          }
          Write-Output "Kladblok 420 x 196 linksboven (naast de prullenbak): $gezet"
          $log = ($vol -replace '\\','/') + "/hol.log"
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
            -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle -- hoogte=$env:HOOGTE demo=0 vers=0 duur=200 log=$log $(if ($env:ZAAD) { "zaad=$env:ZAAD" }) $(if ($env:MOMENT) { "moment=$env:MOMENT" }) $(if ($env:SOORT -eq 'week' -and $env:DRUKTE -eq '1' -and -not $env:MOMENT) { 'drukte=1' })" -PassThru
          # Olaf 15 nov (wens Mila 23:50 voor scherm 2): in run 43653516628 was de gang in alle 6 beelden leeg, want een held
          # is in ±7 s binnen en weer weg en de beelden vielen ertussen. Nu: elke 0,5 s de log lezen; bij elke nieuwe regel
          # "HOL held binnen" een beeld na 2,5, 3,7 en 5 s (bureaublad-held-<nr>-a/b/c.png; run 43657940940: op 2,5 s op de
          # ladder, op 5 s vaak al in de put naast de ingang, dus 3,7 erbij), naast de 6 vaste beelden
          # (bureaublad-1 tot 6, elke 15 s vanaf 35 s). Echt moment uit het spel, niets nagemaakt. Hooguit 6 helden.
          $begin = Get-Date
          $vast = @(35, 50, 65, 80, 95, 110); $vi = 0
          $gezien = 0; $nr = 0; $wacht = @()
          # Bram 15 nov: met moment= staat het spel stil zodra "HOL moment vast" in de log staat; dan drie beelden
          # (bureaublad-moment-a/b/c.png na 0,5, 2 en 4 s), en niet stoppen voordat het moment er was.
          $moment_gezien = $false
          while (((Get-Date) - $begin).TotalSeconds -lt 190 -and -not $p.HasExited) {
            $nu = ((Get-Date) - $begin).TotalSeconds
            $binnen = @(Get-Content $log -ErrorAction SilentlyContinue | Where-Object { $_ -like "HOL held binnen*" })
            while ($gezien -lt $binnen.Count) {
              $gezien++
              if ($nr -lt 6) { $nr++; Write-Output ("{0,6:N1} s  {1}" -f $nu, $binnen[$gezien - 1]); $wacht += @(@{ t = $nu + 2.5; naam = "held-$nr-a" }, @{ t = $nu + 3.7; naam = "held-$nr-b" }, @{ t = $nu + 5; naam = "held-$nr-c" }) }
            }
            if ($env:MOMENT -and -not $moment_gezien -and (@(Get-Content $log -ErrorAction SilentlyContinue | Where-Object { $_ -like "HOL moment vast*" }).Count -gt 0)) {
              $moment_gezien = $true; Write-Output ("{0,6:N1} s  HOL moment vast" -f $nu)
              $wacht += @(@{ t = $nu + 0.5; naam = "moment-a" }, @{ t = $nu + 2; naam = "moment-b" }, @{ t = $nu + 4; naam = "moment-c" })
            }
            if ($vi -lt $vast.Count -and $nu -ge $vast[$vi]) { $vi++; $wacht += @(@{ t = $nu; naam = "$vi" }) }
            $klaar = @($wacht | Where-Object { $_.t -le $nu }); $wacht = @($wacht | Where-Object { $_.t -gt $nu })
            foreach ($k in $klaar) {
              if ($k.naam -eq "1") { Vensters "beeld 1" }
              Dicht-Melding $k.naam
              & producten/steam-hol/e2e/scherm.ps1 "$vol/bureaublad-$($k.naam).png"
              Write-Output ("{0,6:N1} s  beeld bureaublad-{1}.png" -f ((Get-Date) - $begin).TotalSeconds, $k.naam)
            }
            if ($vi -ge $vast.Count -and $nr -ge 6 -and $wacht.Count -eq 0 -and ($moment_gezien -or -not $env:MOMENT)) { break }
            Start-Sleep -Milliseconds 500
          }
          Write-Output "helden binnen gezien: $gezien, heldbeelden van $nr helden"
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content $log -ErrorAction SilentlyContinue | Select-Object -First 15
      - name: Openbaar zetten (tak schermen, steam-hol/winkel-1920)
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          SRC="$GITHUB_WORKSPACE/producten/steam-hol/e2e/winkel"
          [ -d "$SRC" ] || { echo "niets"; exit 0; }
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          T="$RUNNER_TEMP/s"
          D_REL="steam-hol/winkel-1920-$SOORT-$HOOGTE"
          [ "$GITHUB_REF_NAME" = main ] || D_REL="$D_REL-$(echo "$GITHUB_REF_NAME" | tr / -)"
          # Olaf 15 nov: met een vast zaad een eigen map, zodat runs naast elkaar elkaars beelden niet overschrijven.
          # Olaf 15 nov (wens Mila 11:50): met een zaad ook het run-id erbij, zodat een gekozen bron nooit meer
          # overschreven wordt door een latere opname met hetzelfde zaad. Zonder zaad blijft de vaste map (nieuwste).
          [ -z "$ZAAD" ] || D_REL="$D_REL-zaad$ZAAD-run$GITHUB_RUN_ID"
          # Olaf 15 nov: met moment= een eigen map met het run-id, zodat de gewone opname niet overschreven wordt.
          [ -z "$MOMENT" ] || D_REL="$D_REL-moment$MOMENT-run$GITHUB_RUN_ID"
          # Olaf 21 nov: het grote werkvenster (scherm 5) krijgt een eigen map met het run-id.
          [ "$WERKVENSTER" != 1 ] || D_REL="$D_REL-werkvenster-run$GITHUB_RUN_ID"
          # Olaf 21 nov: het bureaublad op 1920 x 1080 krijgt "-scherm1920" erbij, zodat het nooit een 1280-map overschrijft.
          [ "$SCHERMMAAT" != 1920 ] || D_REL="$D_REL-scherm1920"
          [ "$KLADBLOK" != smal ] || D_REL="$D_REL-smal"
          # Olaf 15 nov (tip Bram 04:45): smalle kloon, alleen onze eigen map uitpakken. Heel klonen duurde ±1,5 min
          # (de tak is groot); zo 2 tot 3 s, dus bij een geweigerde push gewoon opnieuw klonen en onze commit erop zetten.
          gelukt=0
          for poging in 1 2 3 4 5 6 7 8; do
            rm -rf "$T"
            git clone -q --depth 1 --filter=blob:none --sparse --branch schermen "$URL" "$T" || { sleep $((poging * 2)); continue; }
            git -C "$T" sparse-checkout set "$D_REL"
            D="$T/$D_REL"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            git -C "$T" add -A && git -C "$T" commit -q -m "Winkelbeelden steam-hol run ${GITHUB_RUN_ID}" || { gelukt=1; break; }
            if git -C "$T" push -q origin schermen; then gelukt=1; break; fi
            sleep $((poging * 2))
          done
          ls -la "$SRC" | head
          [ "$gelukt" = 1 ] || { echo "::error::push naar schermen 8 keer geweigerd"; exit 1; }
          echo "op tak schermen: $D_REL"
          echo "Beelden op tak schermen: \`$D_REL\`" >> "$GITHUB_STEP_SUMMARY"
