name: Het Hol winkelbeelden (1920 breed, Mila)

# Mila, 10 nov 2026. Opnames voor de schermafbeeldingen en de trailer op de winkelpagina (Daan keuring 6, moet 1):
# de strook over de hele breedte van een scherm van 1920 x 1080, zoals een koper hem krijgt.
# Raakt de gewone test van Olaf (steam-hol.yml) niet. Losse PNG's (met doorzichtige lucht) op de tak schermen,
# map steam-hol/winkel-1920-<soort>/ (demo of week).
on:
  workflow_dispatch:
    inputs:
      soort:
        description: "demo (de film van een minuut) of week (een hol na ±een week spelen, uit een save)"
        default: "week"
      hoogte:
        description: "hoogte van de strook in px (96 tot 160)"
        default: "120"
  push:
    branches: [main]
    paths: [".github/workflows/steam-hol-winkel.yml"]

permissions:
  contents: write

jobs:
  winkel:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SOORT: ${{ inputs.soort || 'week' }}
      HOOGTE: ${{ inputs.hoogte || '160' }}
    steps:
      - uses: actions/checkout@v4
      - name: Scherm op 1920 x 1080
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Output "Set-DisplayResolution: $_" }
          Start-Sleep 3
          Add-Type -AssemblyName System.Windows.Forms
          Write-Output "SCHERM $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
      - name: Godot 4.3 downloaden
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
      - name: Importeren
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64_console.exe" -ArgumentList "--headless --path producten/steam-hol/godot --import" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force }
      - name: Bureaublad met de strook (echt, ter vergelijking)
        if: env.SOORT == 'demo'
        shell: pwsh
        run: |
          $uit = "producten/steam-hol/e2e/winkel"
          New-Item -ItemType Directory -Force $uit | Out-Null
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
            -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle -- hoogte=120 demo=1 vers=1 duur=40" -PassThru
          Start-Sleep 30
          & producten/steam-hol/e2e/scherm.ps1 "$uit/bureaublad-echt.png"
          $p.WaitForExit(30000) | Out-Null
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
      - name: Save van een hol na een week (alleen bij week)
        if: env.SOORT == 'week'
        shell: pwsh
        run: |
          # Een echte save in het formaat van kern/opslag.gd (versie 3). Lang gang, vijf kamers, drie stekelputten,
          # 320 opgegeten hoeden (berg maat 4: na ±15 uur open, Sanne 21:50), Royal Gloop en Deep Pit gekocht.
          # 'tijd' 3 uur geleden, zodat het spel bij openen vertelt wat er gebeurde terwijl je weg was.
          $dir = Join-Path $env:APPDATA "Dortus/Het Hol"   # project.godot: use_custom_user_dir (demo-einde, 13 nov)
          New-Item -ItemType Directory -Force $dir | Out-Null
          $gang = @(); $boven = @()
          for ($i = 0; $i -lt 40; $i++) { $gang += ($i -ge 1 -and $i -le 29); $boven += ($i -in 4,5,9,10,15,16,21,22) }
          $r = New-Object System.Random 11
          $hoeden = @(4, 8, 6, 2); for ($i = 0; $i -lt 316; $i++) { $hoeden += $r.Next(0, 10) }
          $nu = [int][double]::Parse((Get-Date -UFormat %s))
          $data = [ordered]@{ versie = 3; tijd = $nu - 10800; gang = $gang; boven = $boven; eerste_held_gedaan = $true
            vallen = @{ "7" = "stekelput"; "13" = "stekelput"; "19" = "stekelput" }; ingang_kol = 2; schat_kol = 29
            gevallen_namen = @{ "Kees" = 1; "Odo" = 1; "Mara" = 1 }; goud = 240; terugkomers = @(); kroniek = @()
            begin_gedaan = @("vallen", "vluchten", "opgegeten", "terug", "doorlopen"); begin_vlucht = ""; helden_nr = 340; lied_helden = 0
            pensioen_namen = @(); slijm = @{ hoeden = $hoeden; gegeten = 320; gespuugd = 0; keer_plat = 12 }
            upgrades = @{ slijm = 3; stekelput = 2 } }
          $data | ConvertTo-Json -Depth 5 -Compress | Set-Content -Encoding utf8NoBOM (Join-Path $dir "hol.json")
          Get-Content (Join-Path $dir "hol.json") | Select-Object -First 1
      - name: Film op 1920 breed, elk 5e beeld bewaard
        shell: pwsh
        run: |
          $uit = "producten/steam-hol/e2e/winkel"
          New-Item -ItemType Directory -Force $uit | Out-Null
          $film = "$((Resolve-Path $uit).Path)/f"
          New-Item -ItemType Directory -Force $film | Out-Null
          $log = ($film -replace '\\','/') + "/film.log"
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
            -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle --write-movie `"$film/f.png`" --fixed-fps 15 --quit-after $(if ($env:SOORT -eq 'week') { 1350 } else { 1125 }) -- hoogte=$env:HOOGTE $(if ($env:SOORT -eq 'week') { 'demo=0 vers=0' } else { 'demo=1 vers=1' }) film=1 log=$log" -PassThru
          if (-not $p.WaitForExit(900000)) { Stop-Process -Id $p.Id -Force }
          Get-Content $log -ErrorAction SilentlyContinue
          $alle = Get-ChildItem $film -Filter "f*.png" | Sort-Object Name
          Write-Output "beelden: $($alle.Count)"
          New-Item -ItemType Directory -Force "$uit/los" | Out-Null
          $i = 0
          foreach ($b in $alle) { if ($i % 5 -eq 0) { Copy-Item $b.FullName "$uit/los/$($b.Name)" }; $i++ }
          Remove-Item $film -Recurse -Force
      - name: Echt bureaublad op 1280 x 720 met de echte taakbalk (alleen bij week)
        if: env.SOORT == 'week'
        shell: pwsh
        run: |
          # Olaf 14 nov (kan van Daan bij scherm 2): Rusty's toont een echt bureaublad met taakbalk. Hier geen
          # nagemaakte taakbalk: de runner zelf op 1920 x 1080, Kladblok erachter, het spel met de week-save
          # (de film hierboven speelde er al ±90 s op door), en elke 15 s een schermafbeelding van het hele scherm.
          # Olaf 14 nov 21:40 (wens Mila 20:55, kan Daan 20:50): 1280 x 720 in plaats van 1920 x 1080, zodat de strook
          # van 160 px 22% van het beeld is en op een kleine winkelplaat leest; Mila vergroot zelf naar 1920 x 1080.
          # Kladblok klein linksboven (520 x 300) en de snelkoppelingen van de runner (R, Unity Hub) van het bureaublad.
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class Scherm {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll")] public static extern bool EnumDisplaySettings(string n, int m, ref DEVMODE d);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE d, int f);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int b, int hg, bool r);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);
            public static int Zet(int b, int h) {
              DEVMODE d = new DEVMODE(); d.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
              EnumDisplaySettings(null, -1, ref d);
              d.dmPelsWidth = b; d.dmPelsHeight = h; d.dmFields = 0x80000 | 0x100000;
              return ChangeDisplaySettings(ref d, 0);
            }
          }
          "@
          $r = [Scherm]::Zet(1280, 720)
          Start-Sleep 3
          Add-Type -AssemblyName System.Windows.Forms
          $s = [System.Windows.Forms.Screen]::PrimaryScreen
          Write-Output "ChangeDisplaySettings gaf $r (0 = gelukt); scherm $($s.Bounds), werkgebied $($s.WorkingArea)"
          if ($s.Bounds.Width -ne 1280) { Write-Output "== SCHERMMAAT NIET GEZET, geen bureaubladbeelden"; exit 0 }
          $uit = "producten/steam-hol/e2e/winkel/bureaublad"
          New-Item -ItemType Directory -Force $uit | Out-Null
          $vol = (Resolve-Path $uit).Path
          # Eerst alles van de runner wegklappen (zijn eigen terminalvenster stond in beeld, run 43631337323),
          # dan Kladblok met een kort briefje, zodat het leest als een gewone werkdag.
          (New-Object -ComObject Shell.Application).MinimizeAll()
          $weg = Join-Path $env:RUNNER_TEMP "snelkoppelingen"; New-Item -ItemType Directory -Force $weg | Out-Null
          foreach ($bd in @("$env:PUBLIC\Desktop", [Environment]::GetFolderPath("Desktop"))) {
            Get-ChildItem -Path "$bd\*" -Include *.lnk, *.url -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "snelkoppeling weg: $($_.Name)"; Move-Item $_.FullName $weg -Force -ErrorAction SilentlyContinue }
          }
          Start-Sleep 2
          $briefje = Join-Path $env:RUNNER_TEMP "notes.txt"
          Set-Content -Encoding utf8 $briefje "Monday`r`n`r`n- reply to Sam about the draft`r`n- slides for the 2 pm call`r`n- lunch with Noor`r`n- water the plant"
          $kl = Start-Process notepad.exe -ArgumentList "`"$briefje`"" -PassThru
          Start-Sleep 3
          $h = [IntPtr]::Zero
          for ($w = 0; $w -lt 10 -and $h -eq [IntPtr]::Zero; $w++) { $h = (Get-Process notepad -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0 | Select-Object -First 1).MainWindowHandle; if (-not $h) { $h = [IntPtr]::Zero; Start-Sleep 1 } }
          [Scherm]::ShowWindow($h, 9) | Out-Null
          $gezet = [Scherm]::MoveWindow($h, 24, 24, 520, 300, $true)
          Write-Output "Kladblok 520 x 300 linksboven: $gezet"
          $log = ($vol -replace '\\','/') + "/hol.log"
          $p = Start-Process -FilePath "godot/Godot_v4.3-stable_win64.exe" `
            -ArgumentList "--path producten/steam-hol/godot --rendering-driver opengl3_angle -- hoogte=$env:HOOGTE demo=0 vers=0 duur=130 log=$log" -PassThru
          Start-Sleep 20
          for ($i = 1; $i -le 6; $i++) {
            Start-Sleep 15
            if ($p.HasExited) { Write-Output "spel gestopt voor beeld $i"; break }
            & producten/steam-hol/e2e/scherm.ps1 "$vol/bureaublad-$i.png"
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content $log -ErrorAction SilentlyContinue | Select-Object -First 15
      - name: Openbaar zetten (tak schermen, steam-hol/winkel-1920)
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          SRC="$GITHUB_WORKSPACE/producten/steam-hol/e2e/winkel"
          [ -d "$SRC" ] || { echo "niets"; exit 0; }
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          T="$RUNNER_TEMP/s"
          # Olaf 14 nov: één keer klonen (duurt ±1,5 min, de tak is groot) en bij een geweigerde push alleen de nieuwste
          # stand ophalen en onze ene commit erop zetten. Eerder kloonde elke poging opnieuw; dan duwde een andere
          # workflow er steeds tussen, faalden alle 5 pogingen en bleef de stap toch groen (run 43560837368).
          git clone -q --depth 1 --branch schermen "$URL" "$T" || exit 1
          D="$T/steam-hol/winkel-1920-$SOORT-$HOOGTE"
          [ "$GITHUB_REF_NAME" = main ] || D="$D-$(echo "$GITHUB_REF_NAME" | tr / -)"
          rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
          echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
          cd "$T" && git add -A && git commit -q -m "Winkelbeelden steam-hol run ${GITHUB_RUN_ID}" || exit 0
          gelukt=0
          for poging in 1 2 3 4 5 6 7 8; do
            if git push -q origin schermen; then gelukt=1; break; fi
            sleep $((poging * 2))
            git fetch -q --depth 1 origin schermen && git rebase -q --onto FETCH_HEAD HEAD~1 || { git rebase --abort 2>/dev/null; true; }
          done
          cd - >/dev/null
          ls -la "$SRC" | head
          [ "$gelukt" = 1 ] || { echo "::error::push naar schermen 8 keer geweigerd"; exit 1; }
          echo "op tak schermen: steam-hol/winkel-1920-$SOORT-$HOOGTE"
