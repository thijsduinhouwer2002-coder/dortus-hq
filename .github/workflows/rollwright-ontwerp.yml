name: Rollwright ontwerptest (Daan)

# Alleen schermafbeeldingen voor het oordeel van Daan. Start bij een push naar een tak ontwerp/...
on:
  push:
    branches: ["ontwerp/**"]
    paths: ["producten/obsidian-rollwright/**", ".github/workflows/rollwright-ontwerp.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ontwerp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: producten/obsidian-rollwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm install
        working-directory: producten/obsidian-rollwright/e2e
      # Obsidian en chromedriver komen van GitHub-releases; die gaven op 8 nov vaak 504.
      # Daarom: download bewaren tussen runs (ook als de test faalt), vooraf downloaden met
      # tot acht pogingen, en de test zelf tot drie keer opnieuw bij een downloadfout.
      - uses: actions/cache/restore@v4
        with:
          path: producten/obsidian-rollwright/e2e/.obsidian-cache
          key: obsidian-cache-${{ github.run_id }}
          restore-keys: obsidian-cache-
      - name: Obsidian vooraf downloaden (tot acht pogingen)
        working-directory: producten/obsidian-rollwright/e2e
        run: |
          for poging in 1 2 3 4 5 6 7 8; do
            npx obsidian-launcher download desktop -v latest -i latest -c .obsidian-cache && exit 0
            echo "downloadfout, poging $poging"; sleep $((poging * 10))
          done
          echo "vooraf downloaden lukte niet; de test probeert het zelf nog"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: producten/obsidian-rollwright/e2e/.obsidian-cache
          key: obsidian-cache-${{ github.run_id }}
      - name: Ontwerptest (tot drie keer bij een downloadfout)
        working-directory: producten/obsidian-rollwright/e2e
        run: |
          for poging in 1 2 3; do
            set +e
            xvfb-run --auto-servernum -s "-screen 0 1400x900x24" npx wdio run ./wdio.ontwerp.conf.mjs 2>&1 | tee /tmp/wdio.log
            code=${PIPESTATUS[0]}
            set -e
            [ "$code" = 0 ] && exit 0
            grep -q "Failed to download" /tmp/wdio.log || exit "$code"
            echo "downloadfout, poging $poging; even wachten"; sleep $((poging * 45))
          done
          exit 1
      # Ook na de test bewaren: chromedriver haalt de test zelf op, en die moet de volgende run er al zijn.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: producten/obsidian-rollwright/e2e/.obsidian-cache
          key: obsidian-cache-${{ github.run_id }}-na
      - name: Schermafbeeldingen openbaar zetten (tak schermen)
        if: always()
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
          TAK: ${{ github.ref_name }}
        run: |
          SRC="$GITHUB_WORKSPACE/producten/obsidian-rollwright/e2e/screenshots"
          [ -d "$SRC" ] && [ -n "$(ls -A "$SRC")" ] || { echo "geen schermafbeeldingen"; exit 0; }
          NAAM="ontwerp-$(echo "$TAK" | tr '/' '-')"
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898233+github-actions[bot]@users.noreply.github.com"
          for poging in 1 2 3 4 5; do
            rm -rf /tmp/s
            git clone -q --depth 1 --branch schermen "$URL" /tmp/s || exit 1
            D="/tmp/s/rollwright/$NAAM"
            rm -rf "$D" && mkdir -p "$D" && cp -r "$SRC"/. "$D"/
            echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ)" > "$D/RUN.txt"
            cd /tmp/s && git add -A && git commit -q -m "Schermen rollwright/$NAAM run ${GITHUB_RUN_ID}" || exit 0
            if git push -q origin schermen; then cd - >/dev/null; break; fi
            cd - >/dev/null; sleep $((poging * 3))
          done
          echo "Bekijk: https://github.com/${GITHUB_REPOSITORY}/tree/schermen/rollwright/$NAAM"
          ls "$SRC"
