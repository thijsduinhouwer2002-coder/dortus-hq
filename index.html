:root{
  --papier:#f3f4f6; --vlak:#ffffff; --vlak2:#f8f9fb; --inkt:#151d2b; --grijs:#535d6d; --zacht:#5f6879; --lijn:#e2e5ea; --lijn2:#cfd4dc;
  --accent:#2446ad; --accent-zacht:#e7ecfa; --accent-inkt:#1b3787;
  --goed:#13703f; --goed-z:#e1f2e8; --let:#8a5604; --let-z:#faefd9; --fout:#ad2c22; --fout-z:#fbe5e2; --stil:#525b6b; --stil-z:#eceef2;
  --r:10px;
  --tekst:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --smal:"Dortus Smal","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --papier:#12161d; --vlak:#191e27; --vlak2:#1d232d; --inkt:#e7eaf0; --grijs:#a9b1bf; --zacht:#9ba3b2; --lijn:#29303b; --lijn2:#38404d;
    --accent:#93a9ff; --accent-zacht:#222b47; --accent-inkt:#bccaff;
    --goed:#5bc994; --goed-z:#15302a; --let:#eab452; --let-z:#372c15; --fout:#ff8a7d; --fout-z:#3b1f1f; --stil:#aab2c0; --stil-z:#262c37;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--papier);color:var(--inkt);font:15px/1.5 var(--tekst);font-variant-numeric:tabular-nums;min-height:100vh}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.smal{font-family:var(--smal);font-feature-settings:"tnum" 1}

/* opbouw */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--vlak) 235px,var(--lijn) 235px,var(--lijn) 236px,transparent 236px)}
.zij{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 12px 24px;display:flex;flex-direction:column;gap:16px}
.merk{padding:0 10px;display:flex;align-items:baseline;gap:8px}
.merk b{font-family:var(--smal);font-size:24px;font-weight:600;letter-spacing:.01em;line-height:1}
.merk span{font-size:13px;color:var(--grijs)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .groep{font-size:12px;color:var(--zacht);padding:14px 10px 5px}
.nav a{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;color:var(--inkt);font-size:14px;line-height:1.3}
.nav a:hover{background:var(--vlak2);text-decoration:none}
.nav a[aria-current="page"]{background:var(--accent-zacht);color:var(--accent-inkt);font-weight:600}
.nav a .eind{margin-left:auto;color:var(--zacht);font-size:12.5px}
.nav a[aria-current="page"] .eind{color:inherit}
.hoofd{min-width:0;padding:26px 40px 80px}
.binnen{max-width:1100px;margin:0 auto}

/* tekst */
h1{font-family:var(--smal);font-size:34px;line-height:1.05;font-weight:600;letter-spacing:.005em}
h2{font-size:16px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--grijs);margin-top:6px;max-width:70ch}
.klein{font-size:13px;color:var(--grijs)}
.sectie{margin-top:24px}
.sectie>.kop{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:10px}

/* labels GEZIEN / DERDEN / GOK: alleen bij getallen */
.lb{font-family:var(--tekst);font-size:10.5px;line-height:1;font-weight:650;letter-spacing:.03em;color:var(--zacht);margin-left:5px;white-space:nowrap;vertical-align:1px}
.lb-gezien{color:var(--goed)}
.lb-derden{color:var(--accent)}
.nw{white-space:nowrap}

/* status: kleur, vorm en woord */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:1px 8px 1px 7px;border-radius:99px;white-space:nowrap;background:var(--stil-z);color:var(--stil);line-height:1.6}
.st i{width:8px;height:8px;flex:none;background:currentColor}
.st-op-koers{background:var(--goed-z);color:var(--goed)} .st-op-koers i{border-radius:50%}
.st-let-op{background:var(--let-z);color:var(--let)} .st-let-op i{clip-path:polygon(50% 0,100% 100%,0 100%);width:9px;height:8px}
.st-risico{background:var(--fout-z);color:var(--fout)} .st-risico i{transform:rotate(45deg);width:7px;height:7px}
.st-stil i{background:none;border:1.5px solid currentColor;border-radius:50%}
.stip{display:inline-flex;color:var(--stil)} .stip i{width:8px;height:8px;background:currentColor}
.stip.st-op-koers{color:var(--goed)} .stip.st-op-koers i{border-radius:50%}
.stip.st-let-op{color:var(--let)} .stip.st-let-op i{clip-path:polygon(50% 0,100% 100%,0 100%);width:9px}
.stip.st-risico{color:var(--fout)} .stip.st-risico i{transform:rotate(45deg);width:7px;height:7px}
.stip.st-stil i{background:none;border:1.5px solid currentColor;border-radius:50%}

function dag(iso){ const [j,m,d] = iso.slice(0,10).split("-").map(Number); return new Date(j, m-1, d); }
function datumKort(iso){ const t = dag(iso); return `${DAGEN[t.getDay()]} ${t.getDate()} ${MAANDEN[t.getMonth()]}`; }
function tijdKort(iso){ const t = new Date(iso); return `${DAGEN[t.getDay()]} ${t.getDate()} ${MAANDEN[t.getMonth()]} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`; }
function dagenTot(iso){ const v = new Date(); v.setHours(0,0,0,0); return Math.round((dag(iso) - v) / 864e5); }
function aftellen(iso){
  const n = dagenTot(iso);
  if (n < -1) return `${-n} dagen te laat`;
  if (n === -1) return "gisteren";
  if (n === 0) return "vandaag";
  if (n === 1) return "morgen";
  return `over ${n} dagen`;
}
function minutenOud(iso){ return iso ? Math.round((Date.now() - new Date(iso)) / 6e4) : Infinity; }
function geleden(iso){
  if (!iso) return "langer dan 3 weken";
  const m = Math.max(0, minutenOud(iso));
  if (m < 60) return `${m} min geleden`;
  if (m < 60*24) return `${Math.floor(m/60)} uur geleden`;
  const d = Math.floor(m/1440); return d === 1 ? "1 dag geleden" : `${d} dagen geleden`;
}
const STATUS_UITLEG = {"op-koers":"op koers","let-op":"let op","risico":"risico","stil":"geparkeerd of stil"};
const status = s => s ? `<span class="st st-${esc(s.kleur || "stil")}"><i aria-hidden="true"></i>${esc(s.woord)}</span>` : "";
const stip = s => `<span class="stip st-${esc((s && s.kleur) || "stil")}" aria-hidden="true"><i></i></span>`;
const project = id => D.projecten.find(p => p.id === id);
const isDortus = p => p.voor !== "Thijs-zelf";

/* kans en prognose */
const kansGetal = k => k && k.laag != null && k.hoog != null;
function kansTekst(k){
  if (kansGetal(k)) return k.laag === k.hoog ? `${k.laag}%` : `${k.laag} tot ${k.hoog}%`;
  return (k && k.tekst) || "nog geen schatting";
}
function geldSoort(p){
  const g = p.prognose || {}, v = g.verwacht;
  if (Array.isArray(v) && v[1] > 0) return "eigen";
  if (typeof v === "number" && v > 0) return "eigen";
  if (v === 0 || (Array.isArray(v) && v[1] === 0)) return "nul";
  if (g.samen && g.hoog != null) return "samen";
  return "geen";
}
function verwachtTekst(p){
  const g = p.prognose || {}, v = g.verwacht;
  if (Array.isArray(v)) return v[0] === v[1] ? euro(v[0]) : `${euro(v[0])} tot ${euro(v[1])}`;
  if (typeof v === "number") return euro(v);
  if (g.samen && g.hoog != null) return `${euro(g.laag || 0)} tot ${euro(g.hoog)}`;
  return g.tekst || "nog geen schatting";
}

/* geldlat: log-as van €0 tot €20.000, alleen voor projecten met een eigen bedrag */
const AS_MAX = 20000;
const pos = e => Math.min(100, Math.max(0, Math.log10(1 + Math.max(0, e)) / Math.log10(1 + AS_MAX) * 100));
const TIKKEN = [0, 100, 1000, 10000];
function lat(p){
  if (geldSoort(p) !== "eigen") return `<div></div>`;
  const g = p.prognose, v = Array.isArray(g.verwacht) ? g.verwacht : [g.verwacht, g.verwacht];
  let h = `<div class="lat" aria-hidden="true"><div class="as"></div>`;
  for (const t of TIKKEN) h += `<div class="tik" style="left:${pos(t)}%"></div>`;
  if (g.laag != null && g.hoog != null && g.hoog > g.laag) h += `<div class="span" style="left:${pos(g.laag)}%;width:${pos(g.hoog) - pos(g.laag)}%"></div>`;
  h += `<div class="band" style="left:${pos(v[0])}%;width:${Math.max(0.8, pos(v[1]) - pos(v[0]))}%"></div>`;
  return h + `</div>`;
}
function askop(){
  return `<div class="askop">` + TIKKEN.map(t => {
    const x = pos(t), kl = x < 5 ? "links" : x > 85 ? "rechts" : "";
    return `<span class="${kl} t${t}" style="left:${x > 85 ? 100 : x}%">${euro(t)}</span>`;
  }).join("") + `</div>`;
}
function geldCel(p){
  const g = p.prognose || {}, soort = geldSoort(p);
  let getal;
  if (soort === "eigen") getal = `<span class="getal">${metLabel(verwachtTekst(p), g.label)}</span>`;
  else if (soort === "nul") getal = `<span class="getal licht">${metLabel(verwachtTekst(p), g.label)}</span>`;
  else if (soort === "samen") getal = `<span class="getal licht" title="${esc(g.reden || "")}">${esc(verwachtTekst(p))}<small>samen</small>${lb(g.label)}</span>`;
  else getal = `<span class="getal geen">${esc(g.tekst || "nog geen schatting")}</span>`;
  const waarsch = (g.waarschijnlijk != null && soort === "eigen") ? `<small class="waarsch">meest waarschijnlijk ${euro(g.waarschijnlijk)}</small>` : "";
  return `<div class="geld"><div><span class="kl">Gemiddeld</span>${getal}${waarsch}</div>${lat(p)}</div>`;
}

function spark(reeks){
  const pts = (reeks || []).map(r => r[1]);
  if (pts.length < 2) return `<span class="spark-leeg">${pts.length ? "1 meting, nog geen reeks" : "geen reeks"}</span>`;
  const W = 130, H = 34, min = Math.min(...pts), max = Math.max(...pts), sp = (max - min) || 1;
  const xy = pts.map((v, i) => [i / (pts.length - 1) * W, H - 3 - (v - min) / sp * (H - 6)]);
  const d = xy.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");
  const eind = xy[xy.length - 1];
  const titel = reeks.map(r => `${datumKort(r[0])}: ${nf.format(r[1])}`).join(", ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titel)}"><title>${esc(titel)}</title><path d="${d}"/><circle cx="${eind[0]}" cy="${eind[1]}" r="2.6"/></svg>`;
}

/* ---------- navigatie ---------- */
function tekenNav(huidig){
  const item = (href, tekst, eind, titel) => `<a href="#${href}"${huidig === href ? ' aria-current="page"' : ""}${titel ? ` title="${esc(titel)}"` : ""}>${tekst}${eind ? `<span class="eind">${eind}</span>` : ""}</a>`;
  const proj = p => item(p.id, `${stip(p.status)}<span>${esc(p.kort || p.naam)}</span>`, "", STATUS_UITLEG[(p.status||{}).kleur]);
  $("nav").innerHTML =
    item("overzicht", "Overzicht", D.doen.length ? `${D.doen.length} voor jou` : "") +
    item("ploeg", "Ploeg", `${D.ploeg.filter(x => x.groep === "aan").length} aan`) +
    `<div class="groep">Projecten van Dortus</div>` + D.projecten.filter(isDortus).map(proj).join("") +
    `<div class="groep">Meetprojecten van Thijs zelf</div>` + D.projecten.filter(p => !isDortus(p)).map(proj).join("");
  const a = $("nav").querySelector('[aria-current="page"]');
  if (a && window.matchMedia("(max-width:860px)").matches) a.scrollIntoView({block: "nearest", inline: "center"});
}

function standRegel(){
  const b = D.projecten_bijgewerkt || {};
  const oudStand = minutenOud(b.iso) > 180, oudBouw = minutenOud(D.gebouwd) > 120;
  const stand = b.iso ? `Stand projecten <b>${esc(tijdKort(b.iso))}</b>${b.door ? `, door ${esc(b.door)}` : ""}` : "Stand projecten onbekend";
  return `<div class="stand"><div class="${oudStand ? "oud" : ""}">${stand}${oudStand ? ` (${esc(geleden(b.iso))})` : ""}</div>` +
    `<div class="${oudBouw ? "oud" : ""}">Pagina gebouwd ${esc(tijdKort(D.gebouwd))}${oudBouw ? ` (${esc(geleden(D.gebouwd))})` : ""}</div></div>`;
}
function foutBlok(){
  if (!D.fouten || !D.fouten.length) return "";
  return `<div class="fouten" role="alert"><b>projecten.json heeft ${D.fouten.length === 1 ? "een fout" : D.fouten.length + " fouten"}.</b> Wat hieronder staat kan daardoor onvolledig zijn; de hoofdchat herstelt het.<ul>${D.fouten.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>`;
}

/* ---------- overzicht ---------- */
function tekenOverzicht(){
  const dortus = D.projecten.filter(isDortus), zelf = D.projecten.filter(p => !isDortus(p));
  const t = D.totaal;
  const metGeld = dortus.filter(p => geldSoort(p) === "eigen").map(p => {
    const v = p.prognose.verwacht, a = Array.isArray(v) ? v : [v, v];
    return {p, m: (a[0] + a[1]) / 2};
  });
  const som = metGeld.reduce((s, x) => s + x.m, 0) || 1;
  const verdeling = metGeld.map(x => `<span style="width:${x.m / som * 100}%" title="${esc(x.p.naam)}: ${esc(verwachtTekst(x.p))}"></span>`).join("");
  const verdelingTekst = metGeld.map(x => `${esc(x.p.kort || x.p.naam)} ${esc(verwachtTekst(x.p))}`).join(", ");

  const doen = D.doen.map(d => {
    const p = d.project ? project(d.project) : null;
    const wanneerKort = d.voor ? `<span class="wanneer${dagenTot(d.voor) < 0 ? " laat" : ""}">${esc(aftellen(d.voor))}</span>` : "";
    const meta = [p ? `<a href="#${esc(p.id)}">${esc(p.kort || p.naam)}</a>` : "", wanneerKort].filter(Boolean).join(", ");
    return `<li class="${d.klein ? "klein-punt" : ""}"><span class="vink" aria-hidden="true"></span><div class="t" title="${esc(d.titel)}">${esc(d.titel)}</div><div class="m">${meta}</div></li>`;
  }).join("");
  const dls = D.deadlines.slice(0, 5).map(d => `<li><span class="d">${esc(datumKort(d.datum))}</span><span class="w" title="${esc(d.naam + ": " + d.wat)}"><a href="#${esc(d.project)}">${esc(d.naam)}</a>: ${esc(d.wat)}</span><small>${esc(aftellen(d.datum))}</small></li>`).join("");

  const rij = (p, i) => {
    const k = p.kans || {};
    const actie = (p.thijs || []).length ? `<span class="actie" title="${esc(p.thijs.map(x => x.doen).join(" En: "))}">actie voor jou</span>` : "";
    const dl = p.deadline ? `<div class="w">${esc(datumKort(p.deadline.datum))}</div><div class="k">${esc(aftellen(p.deadline.datum))}</div>` : `<div class="w woord">geen</div>`;
    return `<a class="rij" href="#${esc(p.id)}">
      <span class="rang">${i + 1}</span>
      <div class="hoofdcel"><div class="boven"><span class="naam">${esc(p.naam)}</span>${status(p.status)}${actie}</div>
        <div class="zin" title="${esc(p.status && p.status.zin)}">${esc(p.status && p.status.zin)}</div></div>
      ${geldCel(p)}
      <div class="cel kanscel"><div class="kl">Kans</div>${kansGetal(k) ? `<div class="w">${metLabel(kansTekst(k), k.label)}</div>` : `<div class="w woord">${esc(kansTekst(k))}</div>`}</div>
      <div class="cel dlcel"><div class="kl">Deadline</div>${dl}</div>
    </a>`;
  };
  const zelfRij = p => `<a class="rij" href="#${esc(p.id)}">
      <span class="rang" aria-hidden="true"></span>
      <div class="hoofdcel"><div class="boven"><span class="naam">${esc(p.naam)}</span>${status(p.status)}</div><div class="zin">${esc(p.volgende_stap)}</div></div>
      <div class="geld"><div><span class="kl">Geld</span><span class="getal geen">geen bedragen</span></div><div></div></div>
      <div class="cel kanscel"><div class="kl">Kans</div><div class="w woord">n.v.t.</div></div>
      <div class="cel dlcel"><div class="kl">Volgende</div>${p.deadline ? `<div class="w">${esc(datumKort(p.deadline.datum))}</div><div class="k">${esc(p.deadline.wat)}</div>` : ""}</div>
    </a>`;

  return `
    <div class="kopblok">
      <div><div class="wat">Verwacht in 12 weken, tot 11 feb 2027</div>
        <div class="totaal">${metLabel(`${euro(t.laag)} tot ${euro(t.hoog)}`, t.label, "Optelsom van de verwachte opbrengst per project, uit de keuringen")}</div>
        ${metGeld.length ? `<div class="verdeling" aria-hidden="true">${verdeling}</div>` : ""}
        <p class="verdeling-tekst">${verdelingTekst}.${t.zonder_schatting.length ? ` ${esc(t.zonder_schatting.map(n => n.split(",")[0]).join(", "))}: nog geen schatting.` : ""}</p></div>
      ${standRegel()}
    </div>
    ${foutBlok()}
    <div class="strook">
      <div><h2>Jij moet doen<span class="tel">${D.doen.length}</span></h2>${D.doen.length ? `<ul class="doen">${doen}</ul>` : `<p class="klein">Niets. De ploeg kan door.</p>`}</div>
      <div><h2>Eerstvolgende deadlines</h2><ul class="dl">${dls || `<li class="klein">Geen deadlines.</li>`}</ul></div>
    </div>
    <section class="sectie">
      <div class="kop"><h2>Projecten van Dortus</h2><span class="klein">op volgorde van gemiddeld verwacht geld: het gemiddelde over alle uitkomsten (kans maal opbrengst). Het kan veel lager uitvallen; de meest waarschijnlijke uitkomst staat eronder.</span></div>
      <div class="lijst">
        <div class="rijkop"><span></span><span>Project en stand</span><div class="geld"><span>Gemiddeld verwacht</span>${askop()}</div><span>Kans op geld</span><span>Deadline</span></div>

      <p class="klein" style="margin-top:8px">Balk: verwachte opbrengst, lijn: slechtste tot beste uitkomst, op een as die naar rechts ruimer wordt. "Samen": één bedrag voor meer projecten.</p>

      <div class="lijst">${zelf.map(zelfRij).join("")}</div>
    </section>`;
}

/* ---------- projectpagina ---------- */
function tekenProject(p){
  const k = p.kans || {}, g = p.prognose || {};
  const bronLink = x => x && x.bron_link ? ` <a href="${esc(x.bron_link)}">bron</a>` : "";
  const soort = geldSoort(p);
  const geldGroot = soort === "geen" ? `<div class="groot woord leeg">${esc(verwachtTekst(p))}</div>` : `<div class="groot">${metLabel(verwachtTekst(p), g.label)}</div>`;
  const prognoseExtra = ((g.laag != null && g.hoog != null && soort !== "nul") ? `<p>Slechtste ${euro(g.laag)}, beste ${euro(g.hoog)}${g.samen ? ", samen met andere projecten" : ""}.</p>` : "") + (g.waarschijnlijk != null && soort !== "nul" ? `<p><strong>Meest waarschijnlijk: ${euro(g.waarschijnlijk)}</strong> (GOK).</p>` : "");
  const dl = p.deadline ? `<div class="groot">${esc(datumKort(p.deadline.datum))}</div><p><b style="color:var(--inkt);font-weight:600">${esc(aftellen(p.deadline.datum))}</b>${p.deadline.tijd ? `, ${esc(p.deadline.tijd)} NL` : ""}. ${esc(p.deadline.wat)}</p>` : `<div class="groot woord leeg">geen</div>`;
  const punten = p.thijs || [];
  const jij = punten.length
    ? `<ul class="jijpunten">${punten.map(x => `<li><div class="t">${esc(x.doen)}</div>${x.voor ? `<div class="klein wanneer${dagenTot(x.voor) < 0 ? " laat" : ""}">Vóór ${esc(datumKort(x.voor))}, ${esc(aftellen(x.voor))}</div>` : ""}</li>`).join("")}</ul>`
    : `<div class="groot woord leeg">niets</div><p>De ploeg kan zonder jou verder.</p>`;
  const agents = [...new Set([p.eigenaar, ...(p.agents || [])].filter(Boolean))];
  const cijfers = (p.cijfers || []).map(c => {
    let verschil = "";
    if (c.waarde != null) {
      const nu = Number(String(c.waarde).replace(",", ".")), gis = Number(String(c.gisteren).replace(",", "."));
      if (c.gisteren !== "" && !isNaN(gis)) { const d = nu - gis; verschil = d > 0 ? `<span class="plus">+${nf.format(d)} sinds gisteren</span>` : d < 0 ? `<span class="min">${nf.format(d)} sinds gisteren</span>` : "gelijk aan gisteren"; }
      else if (c.reeks.length >= 2) { const d = c.reeks.at(-1)[1] - c.reeks.at(-2)[1]; verschil = d ? `${d > 0 ? "+" : ""}${nf.format(d)} sinds vorige meting` : "gelijk aan vorige meting"; }
    }
    const wanneer = c.gemeten ? (c.gemeten.length > 10 ? tijdKort(c.gemeten) : datumKort(c.gemeten)) : "onbekend";
    const waarde = c.waarde != null ? `<div class="waarde">${metLabel(nlGetal(c.waarde), c.label)}<small>${verschil}</small></div>` : `<div class="waarde niet">niet gelezen</div>`;
    return `<div class="cijfer">
      <div class="maat">${esc(c.maat)}<small>${esc(c.product)}, ${esc(c.platform)}${c.stand ? `. ${esc(c.stand)}` : ""}</small></div>
      ${waarde}<div class="grafiek">${spark(c.reeks)}</div>
      <div class="bron">${esc(c.bron)}<br>gemeten ${esc(wanneer)}</div></div>`;
  }).join("");
  const keuringen = (p.keuringen || []).map(x => `<li><span class="tijd">${x.tijd ? esc(tijdKort(x.tijd)) : ""}</span><div><span class="oordeel ${x.oordeel || "open"}">${x.oordeel === "ja" ? "akkoord" : x.oordeel === "nee" ? "nog niet akkoord" : "oordeel"}</span><a href="${esc(x.link)}">${esc(x.kop)}</a><div class="klein" style="margin-top:3px">${esc(x.akkoord)}</div></div></li>`).join("");
  const recent = (p.recent || []).map(c => `<li><span class="tijd">${esc(geleden(c.tijd))}</span><div><span class="door">${esc(c.wie)}</span>: ${esc(c.wat)}<a class="hash" href="https://github.com/${esc(D.repo)}/commit/${esc(c.hash)}">${esc(c.hash)}</a></div></li>`).join("");
  return `
    <a class="terug" href="#overzicht">Terug naar het overzicht</a>
    ${foutBlok()}
    <h1>${esc(p.naam)}</h1>
    <p class="sub">${esc(p.wat)}</p>
    <div class="kopregel">${status(p.status)}${punten.length ? `<span class="actie">actie voor jou</span>` : ""}<span class="chip">${esc(p.soort)}${isDortus(p) ? "" : ", Thijs zelf"}</span><span class="chip">${esc(p.platform)}</span></div>
    <p class="statuszin">${esc(p.status && p.status.zin)}</p>
    <div class="feiten">
      <div><h3>Kans op geld in 12 weken</h3>${kansGetal(k) ? `<div class="groot">${metLabel(kansTekst(k), k.label)}</div>` : `<div class="groot woord">${esc(kansTekst(k))}</div>`}<p>${esc(k.reden)}${bronLink(k)}</p></div>
      <div><h3>Verwacht in 12 weken</h3>${geldGroot}${soort === "eigen" ? `<div style="margin-top:12px">${lat(p)}${askop()}</div>` : ""}${prognoseExtra}<p>${esc(g.reden)}${bronLink(g)}</p></div>
      <div><h3>Deadline</h3>${dl}</div>
      <div><h3>Wat jij moet doen</h3>${jij}</div>
    </div>
    <div class="tweeluik">
      <div><h3>Volgende stap</h3><p>${esc(p.volgende_stap)}</p></div>
      <div><h3>Risico</h3><p>${esc(p.risico)}</p></div>
    </div>
    <div class="tweeluik" style="margin-top:18px">
      <div><h3>Eigenaar en wie eraan werkt</h3><div class="wie">${agents.length ? agents.map((a, i) => `<a class="chip" href="#ploeg">${esc(a)}${i === 0 ? " (eigenaar)" : ""}</a>`).join("") : `<span class="klein">niemand</span>`}</div></div>
      <div><h3>Links</h3><div class="links">${(p.links || []).map(l => `<a class="chip" href="${esc(l.url)}">${esc(l.naam)}</a>`).join("")}</div></div>
    </div>
    <section class="sectie">
      <div class="kop"><h2>Echte cijfers</h2><span class="klein">uit het scorebord${D.scorebord_gemeten ? `, gemeten ${esc(tijdKort(D.scorebord_gemeten))}` : ""}</span></div>
      <div class="tabel">${cijfers || `<div class="niets">${isDortus(p) ? "Nog geen cijfers in het scorebord voor dit project." : "Geen cijfers op dit dashboard: de uitslagen staan in de rapporten op de tak ai-handel-data."}</div>`}</div>
    </section>
    ${keuringen ? `<section class="sectie"><div class="kop"><h2>Keuringen</h2><span class="klein">laatste oordeel per keuring</span></div><ul class="regels">${keuringen}</ul></section>` : ""}
    <section class="sectie">
      <div class="kop"><h2>Laatste wijzigingen</h2><span class="klein">zonder logboekregels zonder nieuws</span></div>
      ${recent ? `<ul class="regels">${recent}</ul>` : `<div class="tabel"><div class="niets">Geen wijzigingen met nieuws.</div></div>`}
    </section>
    <p class="voet">Laatst bijgewerkt ${esc(p.laatste_update ? `${p.laatste_update.datum} door ${p.laatste_update.door}` : "onbekend")}. Bron: organisatie/projecten.json.</p>`;
}

function tekenPloeg(){
  const groep = g => D.ploeg.filter(x => x.groep === g);
  const persoon = x => `<div class="persoon">
      <div class="n">${esc(x.naam)}<small>${esc(x.rol)}</small></div>
      <div class="f">${esc(x.focus || x.team)}${x.projecten.length ? `<div class="wie">${x.projecten.map(id => { const p = project(id); return p ? `<a class="chip" href="#${esc(id)}">${stip(p.status)}${esc(p.kort || p.naam)}</a>` : ""; }).join("")}</div>` : ""}</div>
      <div class="l"><b>${esc(geleden(x.laatst))}</b>${x.vandaag ? `, ${x.vandaag} vandaag` : ""}<span>${esc(x.laatst_wat)}</span></div>
    </div>`;
  const blok = (titel, uitleg, lijst) => lijst.length ? `<section class="sectie"><div class="kop"><h2>${titel}</h2><span class="klein">${uitleg}</span></div><div class="tabel">${lijst.map(persoon).join("")}</div></section>` : "";
  const uit = groep("uit");
  const tests = (D.tests || []).map(r => `<li><span class="tijd">${esc(geleden(r.tijd))}</span><div><span class="oordeel ${r.uitkomst === "success" ? "ja" : "nee"}">${r.uitkomst === "success" ? "gelukt" : "mislukt"}</span>${r.url ? `<a href="${esc(r.url)}">${esc(r.naam)}</a>` : esc(r.naam)}</div></li>`).join("");
  return `
    <h1>Ploeg</h1>
    <p class="sub">Wie aan staat en waaraan hij werkt (uit het bord, deel 2), en wanneer hij voor het laatst iets op GitHub zette.</p>
    ${blok("Aan", `${groep("aan").length} volgens het bord`, groep("aan"))}
    ${blok("Ook bezig", "niet op het bord, wel iets op GitHub in de laatste 3 uur", groep("bezig"))}
    ${blok("Hoofdchat en keurders", "vast, niet op het bord", groep("vast"))}
    ${uit.length ? `<section class="sectie"><details class="uit"><summary><b>${uit.length} uit:</b> ${esc(uit.map(x => x.naam).join(", "))}</summary><div>${uit.map(persoon).join("")}</div></details></section>` : ""}
    ${tests ? `<section class="sectie"><div class="kop"><h2>Laatste runs met echt werk</h2><span class="klein">per workflow; runs die alleen de klok raadpleegden tellen niet</span></div><ul class="regels">${tests}</ul></section>` : ""}
    <p class="voet">Aan of uit en focus komen uit organisatie/bord.md, de rest uit git log en dashboard/ploeg.json.</p>`;
}

/* ---------- route ---------- */
function teken(){
  if (!D) { $("view").innerHTML = `<p class="niets">Geen gegevens. Bouw de pagina met python3 dashboard/bouw.py.</p>`; return; }
  const h = decodeURIComponent(location.hash.slice(1)) || "overzicht";
  const p = project(h);
  const huidig = p ? p.id : (h === "ploeg" ? "ploeg" : "overzicht");
  $("view").innerHTML = p ? tekenProject(p) : huidig === "ploeg" ? tekenPloeg() : tekenOverzicht();
  document.title = (p ? p.naam : huidig === "ploeg" ? "Ploeg" : "Overzicht") + ", Dortus";
  tekenNav(huidig);
}
window.addEventListener("hashchange", () => { teken(); window.scrollTo(0, 0); });
teken();
/* nieuwe stand ophalen zonder iemand midden in het lezen te storen: alleen als het tabblad
   een tijd verborgen was, of na een uur stilte */
const geladen = Date.now();
let laatsteActie = Date.now();
["scroll","pointerdown","keydown"].forEach(e => window.addEventListener(e, () => { laatsteActie = Date.now(); }, {passive: true}));
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - geladen > 15 * 6e4) location.reload(); });
setInterval(() => { if (Date.now() - geladen > 30 * 6e4 && Date.now() - laatsteActie > 60 * 6e4) location.reload(); }, 5 * 6e4);
</script>
