<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>Dortus HQ</title>
<style>
:root{
  --bg:#07090f; --ink:#e9edf5; --dim:#8a93a6; --line:rgba(255,255,255,.08);
  --glass:rgba(20,26,40,.55); --gold:#f5c45e; --mint:#5ee6b0; --rose:#ff6b8b; --sky:#6cb8ff; --violet:#a98bff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;
  background:
   radial-gradient(40% 35% at 15% 10%,rgba(169,139,255,.28),transparent 70%),
   radial-gradient(35% 30% at 85% 15%,rgba(94,230,176,.18),transparent 70%),
   radial-gradient(45% 40% at 70% 90%,rgba(245,196,94,.16),transparent 70%),
   radial-gradient(30% 30% at 10% 85%,rgba(108,184,255,.18),transparent 70%);
  animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(3%,-2%) rotate(3deg)}}
.app{display:grid;grid-template-columns:1fr 400px;min-height:100vh}
.wrap{max-width:1360px;width:100%;margin:0 auto;padding:28px 28px 60px}
.chat{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-left:1px solid var(--line);background:rgba(10,13,22,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.chat .kop{padding:20px 20px 12px}
.chat .kop b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.chat .kop small{display:block;color:var(--dim);margin-top:2px}
.tabs{display:flex;gap:6px;padding:0 20px 12px}
.tab{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);border-radius:12px;padding:8px 10px;font:inherit;font-weight:650;cursor:pointer}
.tab.on{color:var(--ink);background:linear-gradient(135deg,rgba(169,139,255,.25),rgba(255,107,139,.18));border-color:rgba(169,139,255,.45)}
.berichten{flex:1;overflow:auto;padding:4px 20px 12px;display:flex;flex-direction:column;gap:10px}
.bel{max-width:92%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;font-size:13.5px}
.bel.ik{align-self:flex-end;background:linear-gradient(135deg,#7b5cff,#ff5f8f);color:#fff;border-bottom-right-radius:6px}
.bel.hq{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line);border-bottom-left-radius:6px}
.bel .meta{display:block;font-size:11px;opacity:.7;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 10px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:99px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.invoer{display:flex;gap:8px;padding:12px 20px 20px;border-top:1px solid var(--line)}
.invoer textarea{flex:1;resize:none;height:44px;max-height:140px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;padding:11px 12px;outline:none}
.invoer textarea:focus{border-color:rgba(169,139,255,.6)}
.invoer button{border:0;border-radius:14px;padding:0 16px;font:inherit;font-weight:750;color:#fff;background:linear-gradient(135deg,#7b5cff,#ff5f8f);cursor:pointer}
.invoer button:disabled{opacity:.4;cursor:default}
.uitleg{padding:0 20px 8px;color:var(--dim);font-size:12px}
.st-nieuw{color:var(--gold)} .st-bezig{color:var(--sky)} .st-klaar{color:var(--mint)}
.av{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0b0f19}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.logo{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1}
.logo span{background:linear-gradient(90deg,var(--gold),var(--rose) 45%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);margin-top:6px}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(94,230,176,.7);animation:pulse 2s infinite;margin-right:8px;vertical-align:middle}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(94,230,176,0)}100%{box-shadow:0 0 0 0 rgba(94,230,176,0)}}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px 20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;overflow:hidden}
.card h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.kpi{grid-column:span 3}
.kpi .n{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi .l{color:var(--dim);margin-top:6px}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;opacity:.25;filter:blur(20px);background:var(--c)}
.wacht{grid-column:span 5}
.prod{grid-column:span 7}
.ploeg{grid-column:span 7}
.feed{grid-column:span 5;max-height:560px;overflow:auto}
.bes{grid-column:span 7}
.tests{grid-column:span 5}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item b{display:block;font-weight:650}
.item small{color:var(--dim)}
.urgent{border-left:3px solid var(--gold);padding-left:12px;margin-left:-4px}
.info{opacity:.55}
.leeg{font-size:20px;font-weight:700;color:var(--mint)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.p{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(255,255,255,.02)}
.p .pl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.p .nm{font-size:17px;font-weight:750;margin:2px 0 8px}
.p .hd{font-size:28px;font-weight:800;letter-spacing:-.02em}
.p .lb{color:var(--dim);font-size:12px}
.p .st{margin-top:8px;font-size:12px;color:var(--ink);opacity:.85}
.p .sd{margin-top:6px;font-size:11.5px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.m{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.02)}
.m.uit{opacity:.38}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px}
.m .nm{font-weight:700}
.m .rl{font-size:11.5px;color:var(--dim)}
.m .wt{font-size:11.5px;margin-top:4px;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--ink);margin-left:6px}
.f{display:grid;grid-template-columns:44px 74px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.f .t{color:var(--dim);font-variant-numeric:tabular-nums}
.f .w{font-weight:650}
.ok{color:var(--mint)} .bad{color:var(--rose)} .run{color:var(--gold)}
@media(max-width:1250px){.app{grid-template-columns:1fr}.chat{position:relative;height:640px;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:1100px){.kpi{grid-column:span 6}.wacht,.prod,.ploeg,.feed,.bes,.tests{grid-column:span 12}.pgrid,.mgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.pgrid,.mgrid{grid-template-columns:1fr}.logo{font-size:34px}}
</style>
</head>

      bel("ik",o.tekst,new Date(o.tijd).toLocaleString("nl-NL",{weekday:"short",hour:"2-digit",minute:"2-digit"}));
      const st=o.status==="klaar"?"klaar":o.status==="bezig"?"opgepakt":"wacht op de volgende ronde";
      const b=bel("hq",o.antwoord||"",st);b.querySelector(".meta").className="meta st-"+(o.status||"nieuw");
      if(!o.antwoord) b.firstChild.textContent="";
    });
  }
  (CHIPS[modus]||[]).forEach(c=>{const b=document.createElement("button");b.className="chip";b.textContent=c;b.onclick=()=>{$("tekst").value=c;stuur()};$("chips").appendChild(b)});
  $("stuur").disabled=bezig||(modus==="vraag"?!sample:!db);
}
async function stuur(){
  const t=$("tekst").value.trim(); if(!t||bezig) return;
  if(modus==="vraag"){
    if(!sample) return;
    $("tekst").value=""; hist.push({role:"user",content:t}); bel("ik",t);
    const out=bel("hq","Even kijken..."); bezig=true; $("stuur").disabled=true;
    const msgs=hist.map((m,i)=>i===0?{role:"user",content:SYS+"\n\nVraag: "+m.content}:m);
    try{
      const r=await sample(msgs,{cache:false,onText:({text})=>{out.textContent=text;$("berichten").scrollTop=1e9}});
      out.textContent=r.text; hist.push({role:"assistant",content:r.text});
    }catch(err){
      out.textContent=err&&err.code==="rate_limited"?"Even te veel vragen achter elkaar. Probeer het zo weer.":"Dat lukte niet. Vraag het in de gewone chat.";
      hist.pop();
    }
    bezig=false; $("stuur").disabled=false;
  }else{
    if(!db) return;
    bezig=true; $("stuur").disabled=true;
    try{ const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7); await db.collection("opdrachten").doc(id).set({tekst:t,tijd:new Date().toISOString(),status:"nieuw",antwoord:""}); $("tekst").value=""; }
    catch(err){ bel("hq","Opslaan lukte niet. Zeg het in de gewone chat."); }
    bezig=false; $("stuur").disabled=false;
  }
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{modus=t.dataset.m;teken()});
$("stuur").onclick=stuur;
$("tekst").addEventListener("keydown",ev=>{if(ev.key==="Enter"&&!ev.shiftKey){ev.preventDefault();stuur()}});
teken();
if(window.claude&&claude.use){
  claude.use("sample").then(s=>{sample=s;teken()});
  claude.use("db").then(d=>{
    db=d; if(!db){teken();return}
    db.collection("opdrachten").orderBy("tijd","desc").limit(30).onSnapshot(
      snap=>{opdrachten=snap.docs.map(x=>({id:x.id,...x.data()}));if(modus==="opdracht")teken()},
      ()=>{db=null;teken()});
    teken();
  });
}
</script>
</body>
</html>
