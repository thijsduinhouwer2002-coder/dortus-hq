<div class="app">
  <aside class="zij">
    <div class="merk"><b>Dortus</b><small id="gebouwd"></small></div>
    <nav class="nav" id="nav" aria-label="Tabs"></nav>
  </aside>
  <main class="hoofd"><div class="binnen" id="view"></div></main>

<script>
const D = /*DATA*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const DAGEN = ["zo","ma","di","wo","do","vr","za"];
const nf = new Intl.NumberFormat("nl-NL", {maximumFractionDigits: 0});
const euro = n => "€" + nf.format(n);
const lb = (l, titel) => l ? `<span class="lb lb-${esc(l.toLowerCase())}"${titel ? ` title="${esc(titel)}"` : ""}>${esc(l)}</span>` : "";

function dag(iso){ const [j,m,d] = iso.slice(0,10).split("-").map(Number); return new Date(j, m-1, d); }
function datumKort(iso){ const t = dag(iso); return `${DAGEN[t.getDay()]} ${t.getDate()} ${MAANDEN[t.getMonth()]}`; }
function tijdKort(iso){ const t = new Date(iso); return `${DAGEN[t.getDay()]} ${t.getDate()} ${MAANDEN[t.getMonth()]} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`; }
function dagenTot(iso){ const v = new Date(); v.setHours(0,0,0,0); return Math.round((dag(iso) - v) / 864e5); }
function aftellen(iso){
  const n = dagenTot(iso);
  if (n < -1) return `${-n} dagen te laat`;
  if (n === -1) return "gisteren";
  if (n === 0) return "vandaag";
  if (n === 1) return "morgen";
  return `over ${n} dagen`;
}
function geleden(iso){
  if (!iso) return "langer dan 3 weken";
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 6e4));
  if (m < 60) return `${m} min geleden`;
  if (m < 60*24) return `${Math.floor(m/60)} uur geleden`;
  const d = Math.floor(m/1440); return d === 1 ? "1 dag geleden" : `${d} dagen geleden`;
}
/* laatste woord en label blijven samen op één regel */
function metLabel(tekst, label, titel){
  const t = String(tekst ?? ""), i = t.lastIndexOf(" ");
  return esc(t.slice(0, i + 1)) + `<span class="nw">${esc(t.slice(i + 1))}${lb(label, titel)}</span>`;
}
const status = s => s ? `<span class="st st-${esc(s.kleur || "stil")}"><i aria-hidden="true"></i>${esc(s.woord)}</span>` : "";
const STATUS_UITLEG = {"op-koers":"op koers","let-op":"let op","risico":"risico","stil":"geparkeerd of stil"};
const project = id => D.projecten.find(p => p.id === id);

/* kans en prognose in woorden */
function kansTekst(k){
  if (!k) return "nog geen schatting";
  if (k.laag != null && k.hoog != null) return k.laag === k.hoog ? `${k.laag}%` : `${k.laag} tot ${k.hoog}%`;
  return k.tekst || "nog geen schatting";
}
function verwachtTekst(p){
  const g = p.prognose || {}; const v = g.verwacht;
  if (Array.isArray(v)) return `${euro(v[0])} tot ${euro(v[1])}`;
  if (typeof v === "number") return euro(v);
  if (g.samen && g.hoog != null) return `${euro(g.laag || 0)} tot ${euro(g.hoog)}`;
  return g.tekst || "nog geen schatting";
}

/* geldlat: één log-as van €0 tot €20.000 voor alle projecten */
const AS_MAX = 20000;
const pos = e => Math.min(100, Math.max(0, Math.log10(1 + Math.max(0, e)) / Math.log10(1 + AS_MAX) * 100));
const TIKKEN = [0, 100, 1000, 10000];
function lat(p, metBedrag = true){
  const g = p.prognose || {}; const v = g.verwacht;
  const heeftSpan = g.laag != null && g.hoog != null;
  if (v == null && !heeftSpan) return `<div class="lat leeg">${esc(g.tekst || "nog geen schatting")}${lb(g.label)}</div>`;
  let h = `<div class="lat" role="img" aria-label="Prognose 12 weken: ${esc(verwachtTekst(p))}"><div class="as"></div>`;
  for (const t of TIKKEN) h += `<div class="tik" style="left:${pos(t)}%"></div>`;
  if (heeftSpan && g.hoog > (g.laag || 0)) h += `<div class="span${g.samen ? " samen" : ""}" style="left:${pos(g.laag)}%;width:${pos(g.hoog) - pos(g.laag)}%"></div>`;
  let midden = null;
  if (Array.isArray(v)) { h += `<div class="band" style="left:${pos(v[0])}%;width:${pos(v[1]) - pos(v[0])}%"></div>`; midden = (pos(v[0]) + pos(v[1])) / 2; }
  else if (typeof v === "number" && v > 0) { h += `<div class="band" style="left:calc(${pos(v)}% - 2px);width:4px"></div>`; midden = pos(v); }
  else if (v === 0) { h += `<div class="nul" style="left:0"></div>`; midden = 0; }
  else if (g.samen) midden = (pos(g.laag || 0) + pos(g.hoog)) / 2;
  if (metBedrag && midden != null) {
    const plek = midden < 28 ? "left:0;transform:none" : midden > 72 ? "left:100%;transform:translateX(-100%)" : `left:${midden}%`;
    h += `<div class="bedrag" style="${plek}">${esc(verwachtTekst(p))}${g.samen ? " samen" : ""}${lb(g.label)}</div>`;
  }
  return h + `</div>`;
}
function askop(){
  return `<div class="askop">` + TIKKEN.map(t => `<span style="left:${pos(t)}%">${t ? euro(t) : "€0"}</span>`).join("") + `</div>`;
}

function spark(reeks){
  const pts = (reeks || []).map(r => r[1]);
  if (pts.length < 2) return `<span class="spark-leeg">${pts.length ? "1 meting, nog geen reeks" : "geen reeks"}</span>`;
  const W = 120, H = 34, min = Math.min(...pts), max = Math.max(...pts), sp = (max - min) || 1;
  const xy = pts.map((v, i) => [i / (pts.length - 1) * W, H - 3 - (v - min) / sp * (H - 6)]);
  const d = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const eind = xy[xy.length - 1];
  const titel = reeks.map(r => `${datumKort(r[0])}: ${nf.format(r[1])}`).join(", ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(titel)}"><title>${esc(titel)}</title><path d="${d}" vector-effect="non-scaling-stroke"/><circle cx="${eind[0]}" cy="${eind[1]}" r="2.6"/></svg>`;
}
