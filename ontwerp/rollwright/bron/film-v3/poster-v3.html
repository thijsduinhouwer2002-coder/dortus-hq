<script>
const g=document.getElementById('rayg');let h='';for(let i=0;i<18;i++){const a=i*20*Math.PI/180+.1,w=(i%2?3.2:5.5)*Math.PI/180;
h+=`<path d="M0 0 L${50*Math.cos(a-w)} ${50*Math.sin(a-w)} L${50*Math.cos(a+w)} ${50*Math.sin(a+w)} Z"/>`}g.innerHTML=h;
let seed=11;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;const c=document.getElementById('c').getContext('2d');
for(let i=0;i<90;i++){const x=r()*1200,y=r()*800,s=.6+r()*2.2;const near=Math.hypot(x-810,y-520)<380;if(x<560&&r()<.7)continue;
c.fillStyle=`rgba(255,${170+s*25|0},90,${(near?.5:.25)+r()*.4})`;c.beginPath();c.arc(x,y,s,0,7);c.fill()}
