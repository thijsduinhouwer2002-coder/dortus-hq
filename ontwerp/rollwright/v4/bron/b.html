<!doctype html><html><head><meta charset="utf-8"><style>

#end .o{position:absolute;top:486px;left:0;right:0;font:italic 27px Fell;color:#bfa682}

#end .ic{position:absolute;width:140px;height:140px;opacity:.45}
#hook,.half .win{-webkit-mask:linear-gradient(90deg,transparent 0,#000 13%,#000 87%,transparent 100%)}</style></head><body><div id="st">
<div id="bg"></div><div id="redwash"></div><div id="rays"></div><div id="flash"></div><canvas id="c" width="1280" height="720"></canvas>
<div class="big" id="bigill"></div>
<div class="win" id="hook"><img id="hi"></div>
<div class="hw" id="hw"></div>
<div id="title"><div class="t">Rollwright</div><div class="s">Dice that roll inside your notes</div></div>
<div id="page"><div class="no" id="pno">BESTIARY · I</div><div class="ill" id="pill"></div><div class="nm" id="pnm"></div><div class="ln"></div><div class="tx" id="ptx"></div></div>
<div class="win" id="w"><img id="wi"></div>

 <div class="half" id="hp"><div class="win" id="sp"><img id="spi"></div><div class="k">OPTIONAL SKIN</div><div class="n">Parchment</div></div>
 <div class="half" id="ha"><div class="win" id="sa"><img id="sai"></div><div class="k">OPTIONAL SKIN</div><div class="n">Arcane</div></div>
 <div id="seam"></div>
</div>

 <div class="t">Rollwright</div><div class="s">A natural 20 lands in gold. Every throw, kept.</div><div class="p">FREE IN OBSIDIAN COMMUNITY PLUGINS</div><div class="o">Parchment and Arcane: optional skins</div><div class="m">Made by Thijs at Dortus</div></div>
<div id="tag"><i></i>REAL PLUGIN FOOTAGE · OBSIDIAN</div>
</div>
<script src="common.js"></script>
<script>
const D=__DATA__, META=__META__;const FR=D.FR, GL=D.GL;const IW=__IW__, IH=__IH__;
function fr(label,since){const L=FR[label];if(!L)return null;if(since<0)return L[0][1];let f=L[0][1];for(const [m,n] of L){if(m>=0&&m<=since*1000)f=n}return f}
const rest=l=>FR[l][FR[l].length-1][1];
function place(el,img,file,x,y,w,h,sx,sy,sc,op){el.style.left=x+'px';el.style.top=y+'px';el.style.width=w+'px';el.style.height=h+'px';el.style.opacity=op;
 if(file)setImg(img,'fr/'+file);img.style.width=IW*sc+'px';img.style.transform=`translate(${-sx*sc}px,${-sy*sc}px)`}
const tok=(l,i)=>META[l][i];
// ink drawings, recoloured per use
const SV={wolf:`__WOLF__`,trap:`__TRAP__`,
 lantern:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><g fill="#3b2414"><path d="M232 30h48v26h-48z"/><path d="M256 6a34 34 0 0 1 34 34h-16a18 18 0 0 0-36 0h-16A34 34 0 0 1 256 6z"/><path d="M170 70h172l-22 46H192z"/><path d="M180 128h152v14H180z"/><path d="M188 142h14v232h-14zM310 142h14v232h-14z"/><path d="M168 374h176l20 40H148z"/><path d="M140 420h232v26H140z"/><path d="M196 446h120l-14 38H210z"/></g><path fill="#c8792a" d="M256 190c34 40 40 70 40 96a40 40 0 0 1-80 0c0-26 6-56 40-96z"/><path fill="#f6d27a" d="M256 238c18 22 22 38 22 52a22 22 0 0 1-44 0c0-14 4-30 22-52z"/></svg>`};
const ink=(k,col)=>SV[k].replace(/#3b2414/g,col);
let cur={};function setHTML(id,k,h){if(cur[id]!==k){cur[id]=k;document.getElementById(id).innerHTML=h}}
const T={hk:[0,1.0,1.55],hkEnd:2.15,titleEnd:3.5,
 seq:[{a:3.35,b:3.9,still:'f-001-top.png'},{a:3.9,b:4.4,glide:'glij1'},{a:4.4,b:5.3,r:'ini',i:0,pre:.12},{a:5.3,b:6.2,r:'att',i:1,pre:.08},{a:6.2,b:7.6,r:'dmg',i:2,pre:.08},{a:7.6,b:8.1,glide:'glij2'},{a:8.1,b:9.6,r:'dex',i:3,pre:.15,z:.6},{a:9.6,b:11.6,r:'per',i:4,pre:.15,z:.7},{a:11.6,b:13.4,r:'tab',i:5,pre:.1,full:1}],
 pages:[{a:5.95,b:7.65,k:'wolf',no:'BESTIARY · I',nm:'The Wolf',tx:'Attack 23.',tx2:'Attack 23. Damage 11.<br>It does not get up.',t2:7.0},{a:8.05,b:9.6,k:'trap',no:'BESTIARY · II',nm:'The Trap',tx:'Dexterity save: a natural 1.<br>Lands in red.'},{a:9.6,b:11.6,k:'lantern',no:'BESTIARY · III',nm:'The Lantern',tx:'Perception: a natural 20.<br>Lands in gold.'}],
 nat1:8.45,nat20:10.05,splitStart:13.4,splitEnd:15.9,endStart:15.9};
function render(t){
 const c=$('c').getContext('2d');c.clearRect(0,0,1280,720);
 ['hook','w','bigill','hw','title','page','c1','split','end'].forEach(i=>$(i).style.opacity=0);
 $('rays').style.opacity=0;$('flash').style.opacity=0;$('redwash').style.opacity=0;
 embers(c,t,.45);
 // ---- HOOK: three cuts
 if(t<T.hkEnd){
  const n=t<T.hk[1]?0:t<T.hk[2]?1:2;const s0=T.hk[n];const d=t-s0;
  const cfg=[{l:'per',i:4,k:'lantern',w:'NAT 20',col:'#ffd77a',g:1,off:.2},{l:'att',i:1,k:'wolf',w:'THE WOLF',col:'#f1dfbd',off:.45},{l:'dex',i:3,k:'trap',w:'NAT 1',col:'#ff7b6a',off:.75}][n];const G=cfg.g?1:0;
  const k0=tok(cfg.l,cfg.i);const k={x:k0.x-8,y:k0.y,w:k0.w+16,h:k0.h};const pad=14;const bw=k.w+pad*2,bh=k.h+pad*2;const sc=G?4.2:3.6;
  const file=fr(cfg.l,d+cfg.off);
  const pop=1+.12*Math.exp(-d*14);
  const x=(G?640:760)-bw*sc/2,y=(G?420:400)-bh*sc/2;
  place($('hook'),$('hi'),file,x,y,bw*sc,bh*sc,k.x-pad,k.y-pad,sc,1);$('hook').style.transform=`scale(${pop})`;
  if(!G){const b=$('bigill');setHTML('bigill',cfg.k+'h',ink(cfg.k,cfg.col));b.style.left='60px';b.style.top='170px';b.style.width='380px';b.style.height='380px';b.style.opacity=cl(d*10)*.95;b.style.transform=`scale(${1.15-.15*out(d*3)}) rotate(${n==2?-6:4}deg)`}
  const hw=$('hw');hw.textContent=cfg.w;hw.style.color=cfg.col;hw.style.top=G?'90px':'120px';hw.style.textAlign=G?'center':'right';hw.style.right=G?'0':'110px';hw.style.left=G?'0':'auto';
  hw.style.opacity=cl(d*10)*(n==2?(1-ph(t,T.hkEnd-.15,T.hkEnd)):1);hw.style.transform=`scale(${1+.35*Math.exp(-d*12)})`;
  const LD=.15;$('flash').style.opacity=G?Math.max(0,.9-(d-LD)*2.2)*(d>LD?1:0):Math.max(0,.35-d*2);
  if(n==2)$('redwash').style.opacity=Math.max(0,.9-d*1.4);
  if(n==2)$('hook').style.opacity=1-ph(t,T.hkEnd-.15,T.hkEnd);if(G&&d>LD){const e=d-LD;$('rays').style.opacity=cl(e*5)*.95*(1-ph(t,T.hk[1]-.12,T.hk[1]));$('rays').style.transform=`rotate(${e*14}deg)`;burst(c,t,s0+LD,640,420)}
 }
 // ---- TITLE
 if(t>=T.hkEnd&&t<T.titleEnd){const a=ph(t,T.hkEnd,T.hkEnd+.25)*(1-ph(t,T.titleEnd-.25,T.titleEnd));const e=$('title');e.style.opacity=a;e.style.transform=`scale(${1.08-.08*out(ph(t,T.hkEnd,T.titleEnd))})`}
 // ---- WINDOW with follow camera
 if(t>=T.titleEnd-.15&&t<T.splitStart){
  const a=ph(t,T.titleEnd-.15,T.titleEnd+.35);let file=null,s=null;
  for(const q of T.seq){if(t>=q.a&&t<q.b){s=q;if(q.glide){const L=GL[q.glide];file=L[Math.min(L.length-1,Math.floor(ph(t,q.a,q.b)*L.length))]}else if(q.still)file=q.still;else file=fr(q.r,t-q.a-q.pre)}}
  // box: right of the bestiary page; full window for the log beat
  const full=s&&s.full?ease(ph(t,s.a,s.a+.45)):0;const intro=1-ease(ph(t,T.titleEnd+.3,T.titleEnd+.9));const wide=Math.max(full,intro);
  const lz=s&&s.full?ease(ph(t,s.a+.55,s.a+1.15)):0;const fsc0=Math.min(1180/IW,(intro>full?640:560)/IH);const fsc=fsc0+(1.55-fsc0)*lz;const fw=Math.min(1180,IW*fsc),fh=Math.min(intro>full?640:560,IH*fsc);const bw=860*(1-wide)+fw*wide, bh=600*(1-wide)+fh*wide, bx=380*(1-wide)+(640-fw/2)*wide, by=(intro>full?366:330)-bh/2;
  const zz=s&&s.z?ease(ph(t,s.a+.1,s.a+.6))*s.z:0;const sc=(1.0+zz)*(1-wide)+fsc*wide;
  let cx=IW/2,cy=IH/2;if(s&&s.r&&!s.full){const k=tok(s.r,s.i);cx=k.x+k.w/2+120/(1+zz);cy=k.y}
  else if(s&&s.glide){cx=560;cy=IH/2}else if(s&&s.full){cx=IW/2+(1030-IW/2)*lz;cy=IH/2+(330-IH/2)*lz}
  // smooth the camera between beats
  window._cx=window._cx??cx;window._cy=window._cy??cy;
  const sx=cl(cx-bw/sc/2,0,IW-bw/sc),sy=cl(cy-bh/sc/2,0,IH-bh/sc);
  const fly=1-out(a);
  place($('w'),$('wi'),file,bx,by+fly*120,bw,bh,sx,sy,sc,a);
  $('w').style.transform=`perspective(1400px) rotateX(${fly*18}deg) scale(${.92+.08*out(a)})`;
  // bestiary page
  const p=T.pages.find(q=>t>=q.a&&t<q.b);
  if(p){const pa=cl((t-p.a)*5)*(1-ph(t,p.b-.15,p.b));const pg=$('page');pg.style.opacity=pa;pg.style.transform=`translateX(${(1-out(cl((t-p.a)*3)))*-80}px) rotate(${p.k=='trap'?-2.5:p.k=='wolf'?1.5:-1}deg)`;
   setHTML('pill',p.k,ink(p.k,'#3b2414'));$('pnm').textContent=p.nm;$('pnm').style.fontSize=p.nm.length>9?'33px':'40px';$('ptx').innerHTML=(p.t2&&t>=p.t2)?p.tx2:p.tx;$('pno').textContent=p.no}
  const cap=(h,o)=>{const e=$('c1');e.innerHTML=h;e.style.opacity=o};
  if(t>=T.nat1&&t<T.nat1+1.1){const d=t-T.nat1;cap('A natural 1 lands <b class="red">in red.</b>',cl(d*4)*(1-ph(t,T.nat1+.9,T.nat1+1.1)));$('redwash').style.opacity=Math.max(0,.6-d*.8)}
  if(t>=T.nat20&&t<T.nat20+1.5){const d=t-T.nat20;const o=cl(d*4)*(1-ph(t,T.nat20+1.3,T.nat20+1.5));cap('A natural 20 lands <b class="gold">in gold.</b>',o);burst(c,t,T.nat20,1240,330);
   c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(800,330,0,800,330,700);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.6,`rgba(255,170,60,${.3*o})`);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,1280,720);c.restore()}
  if(s&&s.full){const e=$('c1');e.style.left='40px';e.innerHTML='Every throw, kept in your <b class="gold">session log.</b>';e.style.opacity=cl((t-s.a-.3)*4)*(1-ph(t,s.b-.2,s.b))} else $('c1').style.left='380px';
 }
 // ---- SKINS: two worlds side by side
 if(t>=T.splitStart&&t<T.endStart){
  const a=cl((t-T.splitStart)*5)*(1-ph(t,T.endStart-.2,T.endStart));$('split').style.opacity=a;
  const op=(t-T.splitStart);
  [['sp','spi','skin-parchment',0],['sa','sai','skin-arcane',.25]].forEach(([w,i,l,off])=>{
   const k=tok(l,4);const sc=2.3;const bw=560,bh=330;const f=fr(l,op-off-.15);
   const sx=k.x-24, sy=k.y-bh/sc/2+10;
   place($(w),$(i),f,40,250+(1-out(cl((op-off)*3)))*40,bw,bh,sx,sy,sc,1)});
  $('seam').style.transform=`scaleY(${out(cl(op*3))})`;
  if(op>.2){const ctx=c;ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(190,225,255,.85)';for(let n=0;n<70;n++){const x=640+(n*137.5%640),y=(n*71.3+t*30*(1+n%3))%720;ctx.globalAlpha=a*(.3+.5*Math.abs(Math.sin(t*2+n)));ctx.fillRect(x,y,1.8,1.8)}ctx.restore()}
 }
 // ---- END
 if(t>=T.endStart){const a=ph(t,T.endStart,T.endStart+.4);$('end').style.opacity=a;$('end').style.transform=`scale(${1.04-.04*out(a)})`;
  setHTML('e1','w',ink('wolf','#e8d2a8'));setHTML('e2','t',ink('trap','#e8d2a8'))}
 $('tag').style.opacity=(t>=T.hkEnd&&t<T.titleEnd)||t>=11.6?0:.9;
}
</script></body></html>
