<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cz;src:url(cinzel.woff2)}
@font-face{font-family:CzD;src:url(cinzeldec.woff2);font-weight:700}
@font-face{font-family:Sp;src:url(spectral.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:Sp,serif;color:#efe6d4;
 background:radial-gradient(ellipse at 62% 58%,#2a2130 0%,#15121a 55%,#0b0a0e 100%);position:relative}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 74% 40%,rgba(230,160,70,.16),transparent 45%),radial-gradient(circle at 70% 85%,rgba(120,40,20,.18),transparent 40%)}
h1{position:absolute;left:90px;top:70px;font-family:CzD;font-weight:700;font-size:92px;letter-spacing:1px;color:#f3e3bf;text-shadow:0 2px 0 #000,0 0 40px rgba(240,180,90,.25)}
.sub{position:absolute;left:94px;top:196px;font-size:34px;color:#cbbfa9;font-style:italic}
.card{position:absolute;border-radius:14px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08)}
.card img{display:block;width:100%}
.free{left:80px;top:360px;width:600px}
.parch{left:760px;top:330px;width:960px;transform:rotate(-2.5deg)}
.arc{left:1080px;top:640px;width:810px;transform:rotate(2deg)}
.lab{position:absolute;font-family:Cz;font-weight:700;letter-spacing:3px;font-size:24px;text-transform:uppercase}
.chip{display:inline-block;padding:6px 14px;border-radius:8px;margin-right:14px;font-size:22px}
.l1{left:82px;top:752px}.l1 .chip{background:#e9e2d2;color:#1b1820}
.l1 .t{color:#e9e2d2}
.n1{position:absolute;left:94px;top:804px;width:600px;font-size:28px;line-height:1.35;color:#cbbfa9}
.l2{left:768px;top:268px}.l2 .chip{background:linear-gradient(#e8b85a,#b8822e);color:#24170a}
.l2 .t{color:#f0c46e}
.arrow{position:absolute;left:692px;top:470px;font-size:120px;font-weight:700;color:#f0c46e;font-family:Cz;text-shadow:0 0 20px rgba(240,180,90,.5)}
.foot{position:absolute;left:84px;bottom:50px;font-family:Cz;font-size:26px;letter-spacing:2px;color:#a99d88}
.foot b{color:#f3e3bf}
</style></head><body>
<h1>One note. Three worlds.</h1>
<div class="sub">Dice rolls in your notes, free. A skin turns the page into a world.</div>
<div class="lab l2"><span class="chip">Optional skins</span><span class="t">Parchment &amp; Arcane · $6 once</span></div>
<div class="card free"><img src="classic-obsidian.png"></div>
<div class="lab l1"><span class="chip">Free</span><span class="t">Classic</span></div>
<div class="n1">Calm tokens in your own theme. A natural 20 lands in gold, a 1 in red.</div>
<div class="arrow">›</div>
<div class="card parch"><img src="parchment-moonstone.png"></div>
<div class="card arc"><img src="arcane-moonstone.png"></div>
<div class="foot"><b>ROLLWRIGHT</b> · free on the Obsidian community plugins</div>
</body></html>
