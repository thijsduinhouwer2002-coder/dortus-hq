; Olaf, 13 nov 2026: twee echte Windows-bouwsels (demolijst 6). "Windows" is het volle spel,
; "Windows demo" krijgt de Godot-feature steamdemo (kern/demo_einde.gd), zodat de demo zonder startargument stopt
; na ongeveer 2 uur. Beide schrijven dezelfde save (%APPDATA%/Dortus/Het Hol), dus de save gaat mee naar het volle spel.
; Bouwen en toetsen: .github/workflows/steam-hol-exe.yml.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="kunst/3d/*.json, kunst/letters/*.txt, kunst/icoon.ico"
exclude_filter="systemen/toetsen/*, *.md"
export_path="../bouw/volledig/HetHol.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://kunst/icoon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/company_name="Dortus"
application/product_name="Het Hol"
application/file_description="Het Hol"
application/copyright=""
application/trademarks=""
application/export_angle=1
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false

[preset.1]

name="Windows demo"
platform="Windows Desktop"
runnable=false
advanced_options=false
dedicated_server=false
custom_features="steamdemo"
export_filter="all_resources"
include_filter="kunst/3d/*.json, kunst/letters/*.txt, kunst/icoon.ico"
exclude_filter="systemen/toetsen/*, *.md"
export_path="../bouw/demo/HetHol.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://kunst/icoon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/company_name="Dortus"
application/product_name="Het Hol Demo"
application/file_description="Het Hol Demo"
application/copyright=""
application/trademarks=""
application/export_angle=1
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
