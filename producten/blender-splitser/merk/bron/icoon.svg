<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icoon splitser (Dortus, merk-agent 23 nov 2026): een blok in twee stukken, met twee gouden pennen in de spleet. -->
  <defs>
    <clipPath id="blok"><rect x="112" y="112" width="288" height="288" rx="64"/></clipPath>
    <clipPath id="linksboven"><polygon points="0,0 512,0 0,512"/></clipPath>
    <clipPath id="rechtsonder"><polygon points="512,0 512,512 0,512"/></clipPath>
    <linearGradient id="koraal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A55"/><stop offset="1" stop-color="#FF4A2E"/></linearGradient>
    <linearGradient id="kobalt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A76FF"/><stop offset="1" stop-color="#2F4BF0"/></linearGradient>
    <linearGradient id="goud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#FFC23D"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1D1426"/>
  <g transform="translate(-22,-22)"><g clip-path="url(#linksboven)"><g clip-path="url(#blok)"><rect x="100" y="100" width="312" height="312" fill="url(#koraal)"/></g></g></g>
  <g transform="translate(22,22)"><g clip-path="url(#rechtsonder)"><g clip-path="url(#blok)"><rect x="100" y="100" width="312" height="312" fill="url(#kobalt)"/></g></g></g>
  <!-- twee pennen dwars over de spleet -->
  <g transform="rotate(45 206 306)"><rect x="150" y="290" width="112" height="32" rx="16" fill="url(#goud)"/></g>
  <g transform="rotate(45 306 206)"><rect x="250" y="190" width="112" height="32" rx="16" fill="url(#goud)"/></g>
</svg>
